<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Globe grid lines (subtle) -->
  <circle cx="512" cy="512" r="290" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <ellipse cx="512" cy="512" rx="290" ry="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <ellipse cx="512" cy="512" rx="290" ry="200" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <line x1="222" y1="512" x2="802" y2="512" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <line x1="512" y1="222" x2="512" y2="802" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Paper plane: centered, pointing upper-right -->
  <!-- Main body -->
  <polygon points="512,260 260,620 430,580 512,260" fill="url(#plane)" opacity="0.95"/>
  <polygon points="512,260 764,480 600,520 512,260" fill="#FFFFFF"/>
  <!-- Tail fold -->
  <polygon points="430,580 512,260 600,520 480,680" fill="#C7D2FE"/>
  <!-- Wing accent line -->
  <line x1="512" y1="260" x2="490" y2="560" stroke="rgba(99,102,241,0.3)" stroke-width="3"/>

  <!-- Pin dot (location marker beneath plane) -->
  <circle cx="512" cy="740" r="28" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="512" cy="740" r="16" fill="#6366F1" opacity="0.7"/>
</svg>
