<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111;
      padding: 0;
    }

    .header {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .app-name { color: #fff; font-size: 15px; font-weight: 700; }
    .sub-title { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 1px; }

    .body { padding: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .hint {
      font-size: 12px;
      color: #6B7280;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #D1D5DB;
      border-radius: 10px;
      font-size: 13px;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 14px;
    }
    input[type="url"]:focus { border-color: #4F46E5; }

    .save-btn {
      width: 100%;
      padding: 11px;
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .save-btn:hover { background: #4338CA; }

    .feedback {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      color: #059669;
      font-weight: 500;
      min-height: 20px;
    }
    .feedback.error { color: #DC2626; }

    .divider {
      border: none;
      border-top: 1px solid #E5E7EB;
      margin: 18px 0;
    }

    .info-block {
      background: #F9FAFB;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      padding: 12px;
    }
    .info-block p { font-size: 12px; color: #6B7280; line-height: 1.6; }
    .info-block code {
      background: #E5E7EB;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">✈️</div>
    <div>
      <div class="app-name">TravelPanel Clipper</div>
      <div class="sub-title">Settings</div>
    </div>
  </div>

  <div class="body">
    <label for="app-url">TravelPanel App URL</label>
    <p class="hint">Enter the URL where your TravelPanel app is deployed (no trailing slash).</p>
    <input
      type="url"
      id="app-url"
      placeholder="https://your-app.vercel.app"
      spellcheck="false"
      autocomplete="off"
    />
    <button class="save-btn" id="save-btn">Save Settings</button>
    <div class="feedback" id="feedback"></div>

    <hr class="divider" />

    <div class="info-block">
      <p>
        After saving, click the ✈️ extension icon on any travel page to clip it.
        The extension opens TravelPanel's share sheet where you can pick a board.<br><br>
        <strong>Running locally?</strong> Use <code>http://localhost:3000</code>.
      </p>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
