<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111827;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }

    h1 small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: #6b7280;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 13px;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }

    input[type="url"]:focus {
      border-color: #4f46e5;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .save-btn {
      flex: 1;
      padding: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .save-btn:hover { opacity: 0.9; }

    .test-btn {
      padding: 10px 16px;
      background: #f9fafb;
      color: #374151;
      font-size: 13px;
      font-weight: 600;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .test-btn:hover { border-color: #d1d5db; }

    .status {
      margin-top: 14px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .divider {
      border: none;
      border-top: 1px solid #f3f4f6;
      margin: 20px 0;
    }

    .example-section p {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.6;
    }

    code {
      background: #f3f4f6;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-mark">✈️</div>
    <h1>
      TravelPanel Clipper
      <small>Extension Settings</small>
    </h1>
  </div>

  <label for="urlInput">TravelPanel URL</label>
  <p class="hint">Enter the URL where your TravelPanel app is hosted.</p>
  <input
    type="url"
    id="urlInput"
    placeholder="https://your-app.vercel.app"
    autocomplete="off"
    spellcheck="false"
  />

  <div class="btn-row">
    <button class="save-btn" id="saveBtn">Save</button>
    <button class="test-btn" id="testBtn">Test →</button>
  </div>

  <div class="status" id="status"></div>

  <hr class="divider" />

  <div class="example-section">
    <p>
      <strong>Where to find your URL:</strong><br />
      If you deployed to Vercel, it looks like <code>https://travelpanel-xyz.vercel.app</code>.<br />
      For local development, use <code>http://localhost:3000</code>.
    </p>
  </div>

  <script src="options.js"></script>
</body>
</html>
