<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelPanel Clipper — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #0f172a;
      background: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo {
      width: 36px;
      height: 36px;
      background: #6366f1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
      background: white;
    }
    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.5;
    }
    .save-btn {
      padding: 11px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .save-btn:hover { background: #4f46e5; }
    .save-btn:active { transform: scale(0.97); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #10b981;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
      margin-left: 12px;
    }
    .status.visible { opacity: 1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
        <path d="M8 1.5C5.51 1.5 3.5 3.51 3.5 6c0 3.75 4.5 8.5 4.5 8.5S12.5 9.75 12.5 6c0-2.49-2.01-4.5-4.5-4.5z" fill="white"/>
        <circle cx="8" cy="6" r="1.5" fill="#6366f1"/>
      </svg>
    </div>
    <h1>TravelPanel Settings</h1>
  </div>

  <div class="card">
    <label for="urlInput">TravelPanel URL</label>
    <input
      type="url"
      id="urlInput"
      placeholder="http://localhost:3000"
      autocomplete="off"
      spellcheck="false"
    />
    <p class="hint">
      Your local dev server (<code>http://localhost:3000</code>) or your deployed Vercel URL
      (<code>https://your-app.vercel.app</code>).
    </p>
  </div>

  <div style="display:flex;align-items:center">
    <button class="save-btn" id="saveBtn">Save settings</button>
    <span class="status" id="status">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2.5 7l3 3 6-6" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Saved!
    </span>
  </div>

  <script src="options.js"></script>
</body>
</html>
