<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --indigo: #4f46e5;
      --indigo-dark: #4338ca;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --green: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: var(--gray-900);
      background: var(--gray-50);
      padding: 32px;
      max-width: 520px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo-icon { font-size: 28px; }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--indigo);
    }

    .logo-sub {
      font-size: 13px;
      color: var(--gray-400);
      margin-left: 2px;
    }

    .card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-500);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-700);
    }

    .input-group input {
      padding: 10px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-size: 13px;
      color: var(--gray-900);
      outline: none;
      transition: border-color 0.15s;
      background: white;
      width: 100%;
    }

    .input-group input:focus {
      border-color: var(--indigo);
    }

    .input-hint {
      font-size: 11.5px;
      color: var(--gray-400);
      line-height: 1.6;
    }

    .input-hint code {
      background: var(--gray-100);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: var(--indigo);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--indigo-dark);
    }

    #saved-msg {
      font-size: 13px;
      color: #15803d;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #saved-msg.visible { opacity: 1; }

    .divider {
      height: 1px;
      background: var(--gray-100);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-label {
      font-size: 13px;
      color: var(--gray-700);
    }

    .info-value {
      font-size: 12px;
      color: var(--gray-400);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo-icon">✈</span>
    <div>
      <span class="logo-text">TravelPanel</span>
      <span class="logo-sub">Clipper Settings</span>
    </div>
  </div>

  <div class="card">
    <p class="section-title">Configuration</p>

    <div class="input-group">
      <label for="app-url">TravelPanel App URL</label>
      <input
        id="app-url"
        type="url"
        placeholder="https://your-app.vercel.app"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="input-hint">
        The URL where TravelPanel is deployed.<br />
        Examples: <code>https://travelpanel.vercel.app</code> · <code>http://localhost:3000</code>
      </p>
    </div>

    <div class="actions">
      <button id="save-btn" class="btn btn-primary">Save Settings</button>
      <span id="saved-msg">✓ Saved</span>
    </div>

    <div class="divider"></div>

    <div class="info-row">
      <span class="info-label">Extension version</span>
      <span id="ext-version" class="info-value">—</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
