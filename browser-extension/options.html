<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 20px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid #334155;
      overflow: hidden;
    }
    .card-header {
      padding: 24px 28px;
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .card-header svg { width: 36px; height: 36px; flex-shrink: 0; }
    .card-header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .card-header p  { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }
    .card-body { padding: 28px; display: flex; flex-direction: column; gap: 20px; }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    input[type="url"], input[type="text"] {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    input:focus { border-color: #0ea5e9; }
    .hint {
      font-size: 11px;
      color: #475569;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      margin-top: 2px;
    }

    .save-btn {
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .save-btn:hover { opacity: 0.9; }

    .toast {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #052e16;
      border: 1px solid #166534;
      border-radius: 10px;
      font-size: 13px;
      color: #86efac;
    }
    .toast.show { display: flex; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #475569;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
    }
    .info-row strong { color: #f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <svg viewBox="0 0 36 36" fill="none">
        <circle cx="18" cy="15" r="9" fill="rgba(255,255,255,0.9)"/>
        <circle cx="18" cy="15" r="4" fill="#0ea5e9"/>
        <path d="M18 24 L13 33 L18 30 L23 33 Z" fill="rgba(255,255,255,0.9)"/>
      </svg>
      <div>
        <h1>TravelPanel Clipper</h1>
        <p>Extension settings</p>
      </div>
    </div>

    <div class="card-body">
      <div class="toast" id="toast">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Settings saved!
      </div>

      <div>
        <div class="section-title">Connection</div>
      </div>

      <label>
        TravelPanel URL
        <input type="url" id="travelPanelUrl" placeholder="https://travelpanel.vercel.app" />
        <span class="hint">The URL where your TravelPanel app is deployed. Use http://localhost:3000 for local development.</span>
      </label>

      <button class="save-btn" id="saveBtn">Save Settings</button>

      <div>
        <div class="section-title" style="margin-bottom:12px">About</div>
        <div class="info-row"><span>Version</span><strong>1.0.0</strong></div>
        <div class="info-row" style="margin-top:8px"><span>Manifest</span><strong>v3</strong></div>
        <div class="info-row" style="margin-top:8px">
          <span>Compatible with</span><strong>Chrome, Edge, Brave, Safari</strong>
        </div>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
