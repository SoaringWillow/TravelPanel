<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TravelPanel Clipper — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #111827;
      font-size: 14px;
      padding: 40px 0;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .logo-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 32px;
    }
    .logo {
      width: 32px; height: 32px;
      background: #111827;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 18px; height: 18px; color: #fff; }
    .logo-name { font-weight: 700; font-size: 16px; }
    .logo-sub { color: #6b7280; font-weight: 400; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
    }
    .card-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    input[type="url"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 6px;
    }
    input[type="url"]:focus { border-color: #9ca3af; }
    .hint { font-size: 12px; color: #9ca3af; margin-bottom: 16px; }
    .btn {
      padding: 10px 20px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #1f2937; }
    .saved-msg {
      display: inline-block;
      margin-left: 12px;
      font-size: 13px;
      color: #16a34a;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved-msg.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-row">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <span class="logo-name">TravelPanel <span class="logo-sub">Clipper</span></span>
    </div>

    <div class="card">
      <div class="card-title">TravelPanel URL</div>
      <div class="card-desc">
        Set the URL where your TravelPanel app is running. Clips will be sent to this address.
      </div>
      <label for="app-url">App URL</label>
      <input type="url" id="app-url" placeholder="https://your-app.vercel.app" autocomplete="off">
      <div class="hint">Use <code>http://localhost:3000</code> for local development.</div>
      <button class="btn" id="btn-save">Save</button>
      <span class="saved-msg" id="saved-msg">✓ Saved</span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
