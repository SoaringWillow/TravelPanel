<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F172A;
      color: #F1F5F9;
      padding: 28px 24px;
      min-width: 380px;
      max-width: 480px;
    }

    .header { margin-bottom: 28px; }

    .logo { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }

    .logo svg { width: 22px; height: 22px; }

    .logo-text { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }

    .subtitle { font-size: 13px; color: #64748B; }

    label { display: block; font-size: 12px; font-weight: 500; color: #94A3B8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }

    input[type="url"] {
      width: 100%;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #F1F5F9;
      font-size: 14px;
      padding: 10px 13px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 6px;
    }

    input[type="url"]:focus { border-color: #10B981; }
    input[type="url"]::placeholder { color: #475569; }

    .help { font-size: 12px; color: #475569; line-height: 1.5; margin-bottom: 18px; }

    .actions { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }

    .btn {
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary { background: #10B981; color: #fff; }
    .btn-primary:hover { background: #059669; }

    .toast { font-size: 13px; color: #10B981; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }

    hr { border: none; border-top: 1px solid #1E293B; margin: 0 0 24px; }

    .danger-label { font-size: 12px; font-weight: 600; color: #EF4444; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }

    .clip-count { font-size: 13px; color: #64748B; margin-bottom: 12px; }

    .btn-danger {
      background: transparent;
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.08); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="12" fill="#1E293B"/>
        <path d="M12 3C8.69 3 6 5.69 6 9c0 4.5 6 12 6 12s6-7.5 6-12c0-3.31-2.69-6-6-6z" fill="#10B981"/>
        <circle cx="12" cy="9" r="2.3" fill="#1E293B"/>
      </svg>
      <span class="logo-text">TravelPanel Clipper</span>
    </div>
    <p class="subtitle">Extension settings</p>
  </div>

  <label for="urlInput">TravelPanel URL</label>
  <input type="url" id="urlInput" placeholder="https://your-app.vercel.app" />
  <p class="help">
    The URL where TravelPanel is running.<br>
    Local dev: <code style="color:#94A3B8">http://localhost:3000</code>
  </p>

  <div class="actions">
    <button class="btn btn-primary" id="saveBtn">Save</button>
    <span class="toast" id="toast">✓ Saved!</span>
  </div>

  <hr />

  <p class="danger-label">Danger Zone</p>
  <p class="clip-count" id="clipCount"></p>
  <button class="btn-danger" id="clearBtn">Clear extension storage</button>

  <script src="options.js"></script>
</body>
</html>
