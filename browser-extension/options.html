<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #111827;
      padding: 40px 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .logo-icon { font-size: 22px; }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: #4f46e5;
    }

    .logo-sub {
      font-size: 13px;
      color: #9ca3af;
      margin-left: 4px;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h2 {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="url"] {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input[type="url"]:focus { border-color: #6366f1; }
    input[type="url"].error { border-color: #ef4444; }

    .hint {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }

    .hint code {
      background: #f1f5f9;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 11px;
      color: #4f46e5;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: #4f46e5;
      color: white;
      flex: 1;
    }

    .btn-primary:hover { background: #4338ca; }

    .btn-ghost {
      background: #f1f5f9;
      color: #374151;
    }

    .btn-ghost:hover { background: #e2e8f0; }

    #status {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }

    #status.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    #status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-icon">✈️</span>
    <span class="logo-text">TravelPanel</span>
    <span class="logo-sub">Clipper Settings</span>
  </div>

  <div class="card">
    <h2>TravelPanel URL</h2>

    <div class="field">
      <label for="url-input">Your TravelPanel URL</label>
      <input
        type="url"
        id="url-input"
        placeholder="https://your-app.vercel.app"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="hint">
        Enter the URL where TravelPanel is deployed. Examples:<br />
        <code>https://your-app.vercel.app</code> &nbsp;·&nbsp;
        <code>http://localhost:3000</code>
      </p>
    </div>

    <div id="status"></div>

    <div class="actions">
      <button class="btn-ghost" id="test-btn">Test connection</button>
      <button class="btn-primary" id="save-btn">Save</button>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
