<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper — Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 200px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    h1 span {
      font-weight: 400;
      color: #475569;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    input[type="url"] {
      width: 100%;
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus { border-color: #6366f1; }

    .hint {
      margin-top: 5px;
      font-size: 11px;
      color: #475569;
    }

    .save-btn {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .save-btn:hover { background: #4f46e5; }
    .save-btn:active { transform: scale(0.98); }

    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .status.success {
      display: block;
      background: #042f2e;
      color: #34d399;
      border: 1px solid #065f46;
    }

    .status.error {
      display: block;
      background: #2d0505;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    </div>
    <h1>TravelPanel <span>Settings</span></h1>
  </div>

  <form id="settings-form">
    <div class="field">
      <label for="url-input">TravelPanel URL</label>
      <input
        id="url-input"
        type="url"
        placeholder="https://travel-panel.vercel.app"
        spellcheck="false"
        autocomplete="off"
      >
      <p class="hint">The URL of your TravelPanel app. Change only if self-hosting.</p>
    </div>

    <button type="submit" class="save-btn">Save settings</button>
    <div id="status" class="status"></div>
  </form>

  <script src="options.js"></script>
</body>
</html>
