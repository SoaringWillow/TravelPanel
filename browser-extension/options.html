<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelPanel Clipper — Settings</title>
  <style>
    :root {
      --bg:     #0f172a;
      --bg2:    #1e293b;
      --bg3:    #334155;
      --text:   #f1f5f9;
      --text2:  #94a3b8;
      --text3:  #64748b;
      --accent: #14b8a6;
      --border: #334155;
      --r:      8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px; min-height: 260px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px; padding: 28px 24px;
    }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .logo-icon { width: 20px; height: 20px; color: var(--accent); }
    h1 { font-size: 16px; font-weight: 700; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    input[type="url"] {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--r); color: var(--text);
      font-size: 13px; padding: 9px 12px; outline: none; transition: border-color .15s;
    }
    input[type="url"]:focus { border-color: var(--accent); }
    .hint { font-size: 11px; color: var(--text3); margin-top: 5px; }
    .row { display: flex; align-items: center; gap: 10px; }
    button {
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--r); padding: 9px 20px;
      font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s;
    }
    button:hover { background: #0d9488; }
    .saved { font-size: 13px; color: #22c55e; opacity: 0; transition: opacity .2s; }
    .saved.show { opacity: 1; }
    .divider { height: 1px; background: var(--border); margin: 18px 0; }
    .shortcuts { font-size: 12px; color: var(--text2); }
    .shortcuts strong { color: var(--text); }
    kbd {
      display: inline-block; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 1px 6px; font-size: 11px; font-family: monospace;
    }
  </style>
</head>
<body>
  <header>
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </svg>
    <h1>TravelPanel Clipper Settings</h1>
  </header>

  <div class="field">
    <label>TravelPanel app URL</label>
    <input type="url" id="appUrl" placeholder="http://localhost:3000">
    <p class="hint">Where your TravelPanel app is running (local or production)</p>
  </div>

  <div class="row">
    <button id="saveBtn">Save</button>
    <span class="saved" id="savedMsg">✓ Saved!</span>
  </div>

  <div class="divider"></div>

  <div class="shortcuts">
    <p><strong>Keyboard shortcut</strong> — open clipper from any tab:</p>
    <p style="margin-top:6px">
      <kbd>⌘ Cmd</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> &nbsp; (Mac)
    </p>
    <p style="margin-top:4px">
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> &nbsp; (Windows / Linux)
    </p>
    <p style="margin-top:10px; color: var(--text3)">You can also right-click any page or link to clip it.</p>
  </div>

  <script src="options.js"></script>
</body>
</html>
