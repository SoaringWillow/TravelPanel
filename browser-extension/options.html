<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px;
      background: #ffffff;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #6366f1;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      font-weight: 400;
    }

    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 5px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      color: #111827;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    input[type="text"]::placeholder { color: #d1d5db; }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }
    .save-btn {
      padding: 10px 20px;
      background: #6366f1;
      color: white;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .save-btn:hover { background: #4f46e5; }
    .reset-btn {
      padding: 10px 16px;
      background: none;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 500;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .reset-btn:hover { border-color: #9ca3af; color: #6b7280; }

    .saved-msg {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #15803d;
      margin-top: 12px;
    }
    .saved-msg.visible { display: flex; }

    hr { border: none; border-top: 1px solid #f1f5f9; margin: 28px 0; }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .preset-list { display: flex; flex-direction: column; gap: 6px; }
    .preset-btn {
      text-align: left;
      padding: 9px 13px;
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      background: none;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .preset-btn:hover { border-color: #6366f1; background: #eef2ff; }
    .preset-btn strong { font-size: 13px; font-weight: 600; color: #374151; display: block; }
    .preset-btn span { font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-icon">📍</div>
    <div>
      <h1>TravelPanel Clipper</h1>
      <div class="subtitle">Extension Settings</div>
    </div>
  </div>

  <div class="field">
    <label for="app-url-input">TravelPanel App URL</label>
    <input
      type="text"
      id="app-url-input"
      placeholder="http://localhost:3000"
      spellcheck="false"
      autocomplete="off"
    />
    <p class="hint">Where your TravelPanel instance is running. Include the protocol (http:// or https://).</p>
  </div>

  <div class="btn-row">
    <button class="save-btn" id="save-btn">Save</button>
    <button class="reset-btn" id="reset-btn">Reset to default</button>
  </div>
  <div class="saved-msg" id="saved-msg">✓ Settings saved</div>

  <hr />

  <div class="section-title">Quick presets</div>
  <div class="preset-list">
    <button class="preset-btn" data-url="http://localhost:3000">
      <strong>Local development</strong>
      <span>http://localhost:3000</span>
    </button>
    <button class="preset-btn" data-url="https://travelpanel.vercel.app">
      <strong>Vercel production</strong>
      <span>https://travelpanel.vercel.app</span>
    </button>
  </div>

  <script src="options.js"></script>
</body>
</html>
