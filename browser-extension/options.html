<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 40px 24px;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.4px;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      color: #1e293b;
      transition: border-color 0.15s;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #6366f1;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-save {
      flex: 1;
      padding: 11px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-save:hover { background: #4f46e5; }

    .btn-save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
      min-height: 20px;
    }

    .status-msg.success { color: #16a34a; }
    .status-msg.error   { color: #dc2626; }

    .examples {
      margin-top: 10px;
    }

    .examples p {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .example-chip {
      display: inline-block;
      background: #f1f5f9;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-family: monospace;
      color: #475569;
      margin: 2px;
      cursor: pointer;
    }

    .example-chip:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-icon">🗺</div>
    <div>
      <h1>TravelPanel</h1>
      <div class="subtitle">Extension Settings</div>
    </div>
  </div>

  <div class="card">
    <label for="urlInput">TravelPanel App URL</label>
    <p class="hint">
      Enter the URL where your TravelPanel app is running. This is where clipped pages will be sent.
    </p>
    <input
      type="url"
      id="urlInput"
      placeholder="https://your-app.vercel.app"
      autocomplete="off"
      spellcheck="false"
    />

    <div class="examples">
      <p>Quick-fill:</p>
      <span class="example-chip" data-url="http://localhost:3000">localhost:3000</span>
    </div>

    <div class="btn-row">
      <button class="btn-save" id="saveBtn">Save</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
