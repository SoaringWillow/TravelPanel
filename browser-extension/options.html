<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/>
          </svg>
        </div>
        <span>TravelPanel Clipper</span>
      </div>
    </header>

    <main>
      <div class="section">
        <h2>App URL</h2>
        <p class="description">
          Enter the URL of your TravelPanel deployment. Clips will be sent here.
        </p>
        <div class="input-group">
          <input
            type="url"
            id="appUrl"
            placeholder="https://travelpanel.vercel.app"
            autocomplete="off"
            spellcheck="false"
          >
          <div class="input-hint">Example: <code>https://your-app.vercel.app</code></div>
        </div>
      </div>

      <div class="section">
        <h2>Keyboard Shortcut</h2>
        <p class="description">
          Set a shortcut to clip the current page without opening the popup.
          Go to <code>chrome://extensions/shortcuts</code> to configure.
        </p>
      </div>

      <div class="actions">
        <button id="saveBtn" class="save-btn">Save Settings</button>
        <button id="resetBtn" class="reset-btn">Reset to Default</button>
        <span id="savedMsg" class="saved-msg hidden">✓ Settings saved</span>
      </div>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
