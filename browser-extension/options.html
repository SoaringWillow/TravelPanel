<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      padding: 32px;
      max-width: 520px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    h1 { font-size: 20px; font-weight: 700; }
    h1 span { color: #666; font-weight: 400; font-size: 14px; }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
    }

    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus { border-color: #3b82f6; }

    .hint {
      font-size: 11px;
      color: #555;
      margin-top: 5px;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.9; }

    #saveStatus {
      font-size: 12px;
      color: #4ade80;
      display: none;
    }

    .divider {
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 24px 0;
    }

    .about {
      font-size: 12px;
      color: #444;
      line-height: 1.6;
    }

    .about a { color: #3b82f6; text-decoration: none; }
    .about a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✈</div>
    <h1>TravelPanel Clipper <span>Settings</span></h1>
  </div>

  <div class="field">
    <label for="appUrl">TravelPanel App URL</label>
    <input type="url" id="appUrl" placeholder="https://your-app.vercel.app" />
    <p class="hint">The URL where your TravelPanel app is deployed. Used to send clips and open the app.</p>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="saveBtn">Save Settings</button>
    <span id="saveStatus">✓ Saved</span>
  </div>

  <hr class="divider" />

  <p class="about">
    TravelPanel Clipper saves travel content from any page into your TravelPanel boards.<br><br>
    Source: <a href="https://github.com/soaringwillow/travelpanel" target="_blank">github.com/soaringwillow/travelpanel</a>
  </p>

  <script src="options.js"></script>
</body>
</html>
