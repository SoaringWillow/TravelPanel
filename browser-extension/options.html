<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#4F46E5"/>
        </svg>
        <h1>TravelPanel Clipper</h1>
      </div>
      <p class="subtitle">Settings</p>
    </div>

    <div class="card">
      <label for="appUrl">
        <span class="label-text">Your TravelPanel URL</span>
        <span class="label-hint">The URL where your TravelPanel app is deployed (e.g. https://your-app.vercel.app)</span>
      </label>
      <input
        type="url"
        id="appUrl"
        placeholder="https://your-app.vercel.app"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="saveBtn" class="save-btn">Save Settings</button>
      <div class="status" id="status"></div>
    </div>

    <div class="info-card">
      <p>Once configured, you can save any travel page to TravelPanel by:</p>
      <ul>
        <li>Clicking the extension icon in the toolbar</li>
        <li>Right-clicking a page and selecting "Save page to TravelPanel"</li>
        <li>Right-clicking a link and selecting "Save link to TravelPanel"</li>
      </ul>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
