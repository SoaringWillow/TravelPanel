<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelPanel — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F9FAFB;
      color: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: #4F46E5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }
    .header-sub {
      font-size: 12px;
      color: #9CA3AF;
      margin-top: 1px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #E5E7EB;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    label {
      display: block;
      font-size: 13px;
      color: #374151;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .hint {
      font-size: 11px;
      color: #9CA3AF;
      margin-top: 4px;
      line-height: 1.5;
    }

    input[type="url"],
    input[type="text"] {
      width: 100%;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #111827;
      transition: border-color 0.15s;
      outline: none;
      font-family: inherit;
    }
    input:focus { border-color: #4F46E5; }

    .save-btn {
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 14px;
    }
    .save-btn:hover { background: #4338CA; }

    .success-msg {
      display: none;
      font-size: 13px;
      color: #16A34A;
      margin-top: 10px;
      align-items: center;
      gap: 5px;
    }
    .success-msg.show { display: flex; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #F3F4F6;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { font-size: 13px; color: #6B7280; }
    .stat-value { font-size: 14px; font-weight: 700; color: #111827; }

    .reset-btn {
      background: none;
      border: none;
      color: #EF4444;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      margin-top: 12px;
    }
    .reset-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-icon">✈</div>
      <div>
        <div class="header-title">TravelPanel</div>
        <div class="header-sub">Extension Settings</div>
      </div>
    </div>

    <!-- App URL -->
    <div class="card">
      <div class="card-title">App URL</div>
      <label for="app-url">TravelPanel Web App URL</label>
      <input
        type="url"
        id="app-url"
        placeholder="https://your-app.vercel.app"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="hint">
        The URL of your TravelPanel deployment. Clips open the share flow at this address.
        If you're running locally, use <code>http://localhost:3000</code>.
      </p>
      <button class="save-btn" id="save-btn">Save Settings</button>
      <div class="success-msg" id="success-msg">✅ Saved!</div>
    </div>

    <!-- Stats -->
    <div class="card">
      <div class="card-title">Stats</div>
      <div class="stat-row">
        <span class="stat-label">Total clips saved</span>
        <span class="stat-value" id="clip-count">0</span>
      </div>
      <button class="reset-btn" id="reset-btn">Reset clip count</button>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
