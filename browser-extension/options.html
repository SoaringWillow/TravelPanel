<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TravelPanel Clipper — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F8FAFC;
      color: #1E293B;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #0EA5E9;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #0F172A;
    }

    .subtitle {
      font-size: 13px;
      color: #64748B;
      margin-top: 1px;
    }

    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .field-hint {
      font-size: 12px;
      color: #94A3B8;
      margin-bottom: 8px;
    }

    input[type="url"], input[type="text"] {
      width: 100%;
      border: 2px solid #E2E8F0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #1E293B;
      background: #F8FAFC;
      transition: border-color 0.15s;
      outline: none;
    }

    input:focus { border-color: #0EA5E9; background: #FFFFFF; }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .preset-btn {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border: 1.5px solid #E2E8F0;
      border-radius: 20px;
      background: transparent;
      color: #64748B;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover { border-color: #0EA5E9; color: #0EA5E9; background: #F0F9FF; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-primary {
      flex: 1;
      padding: 11px;
      background: #0EA5E9;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-primary:hover { background: #0284C7; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      padding: 11px 16px;
      background: #F1F5F9;
      color: #374151;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover { background: #E2E8F0; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1E293B;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 4.5C9.52 4.5 7.5 6.52 7.5 9c0 3.75 4.5 10.5 4.5 10.5S16.5 12.75 16.5 9c0-2.48-2.02-4.5-4.5-4.5zm0 6.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="white"/>
        </svg>
      </div>
      <div>
        <h1>TravelPanel Clipper</h1>
        <p class="subtitle">Extension Settings</p>
      </div>
    </div>

    <div class="card">
      <p class="section-title">App URL</p>
      <div class="field-label">Your TravelPanel URL</div>
      <div class="field-hint">The URL where your TravelPanel app is deployed.</div>
      <input
        type="url"
        id="panel-url"
        placeholder="https://travelpanel.vercel.app"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="presets">
        <button class="preset-btn" data-url="https://travelpanel.vercel.app">Production</button>
        <button class="preset-btn" data-url="http://localhost:3000">localhost:3000</button>
        <button class="preset-btn" data-url="http://localhost:3001">localhost:3001</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="save-btn">Save Settings</button>
      <button class="btn-secondary" id="test-btn">Test Connection</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="options.js"></script>
</body>
</html>
