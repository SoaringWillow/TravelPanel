<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Airplane silhouette (pointing up-right) -->
  <g transform="translate(64,64) rotate(-30)" fill="white">
    <!-- Fuselage -->
    <rect x="-4" y="-30" width="8" height="52" rx="4"/>
    <!-- Wings -->
    <path d="M-4,2 L-32,20 L-32,26 L-4,16 Z"/>
    <path d="M4,2 L32,20 L32,26 L4,16 Z"/>
    <!-- Tail fins -->
    <path d="M-4,20 L-18,30 L-18,34 L-4,28 Z"/>
    <path d="M4,20 L18,30 L18,34 L4,28 Z"/>
  </g>
</svg>
