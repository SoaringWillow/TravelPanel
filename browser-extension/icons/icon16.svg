<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Globe -->
  <circle cx="64" cy="58" r="28" fill="none" stroke="white" stroke-width="4"/>
  <!-- Latitude lines -->
  <ellipse cx="64" cy="58" rx="14" ry="28" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <line x1="36" y1="58" x2="92" y2="58" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <!-- Location pin -->
  <circle cx="64" cy="95" r="5" fill="white" opacity="0.9"/>
  <line x1="64" y1="86" x2="64" y2="100" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
