<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #eef2ff;
      --success: #10b981;
      --error: #ef4444;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --radius: 14px;
    }

    body {
      width: 340px;
      background: var(--surface-2);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { display: block; }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .settings-btn:hover { background: var(--surface-2); color: var(--text-2); }

    /* ── Main content ───────────────────────────── */
    .content { padding: 12px; }

    /* ── Page preview card ──────────────────────── */
    .page-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px 3px 6px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: white;
      margin-bottom: 10px;
    }
    .platform-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
    }
    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .page-url {
      font-size: 12px;
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Blocked state ──────────────────────────── */
    .blocked-state {
      text-align: center;
      padding: 24px 16px;
    }
    .blocked-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .blocked-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .blocked-desc {
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.5;
    }

    /* ── CTA button ─────────────────────────────── */
    .clip-btn {
      width: 100%;
      padding: 13px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }
    .clip-btn:hover { background: var(--primary-hover); }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Success state ──────────────────────────── */
    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 8px;
      animation: fadeIn 0.2s ease;
    }
    .success-state.visible { display: flex; }
    .success-ring {
      width: 52px;
      height: 52px;
      background: #ecfdf5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .success-desc {
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
      line-height: 1.5;
    }

    /* ── Loading state ──────────────────────────── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 1.5C5.51 1.5 3.5 3.51 3.5 6c0 3.75 4.5 8.5 4.5 8.5S12.5 9.75 12.5 6c0-2.49-2.01-4.5-4.5-4.5z" fill="white"/>
          <circle cx="8" cy="6" r="1.5" fill="#6366f1"/>
        </svg>
      </div>
      <span class="header-title">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 10a2 2 0 100-4 2 2 0 000 4z"/>
        <path fill-rule="evenodd" d="M8 1a.75.75 0 01.75.75v.64a5.27 5.27 0 011.79.74l.45-.45a.75.75 0 111.06 1.06l-.45.45c.32.55.56 1.15.74 1.79h.64a.75.75 0 010 1.5h-.64a5.27 5.27 0 01-.74 1.79l.45.45a.75.75 0 11-1.06 1.06l-.45-.45a5.27 5.27 0 01-1.79.74v.64a.75.75 0 01-1.5 0v-.64a5.27 5.27 0 01-1.79-.74l-.45.45a.75.75 0 11-1.06-1.06l.45-.45A5.27 5.27 0 012.39 8.75h-.64a.75.75 0 010-1.5h.64c.18-.64.42-1.24.74-1.79l-.45-.45A.75.75 0 113.74 3.95l.45.45a5.27 5.27 0 011.79-.74v-.64A.75.75 0 018 1z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>

  <!-- Main content -->
  <div class="content">

    <!-- Page preview (shown while not yet clipped) -->
    <div id="previewSection">
      <div class="page-card" id="pageCard">
        <div class="platform-badge" id="platformBadge">
          <span class="platform-dot"></span>
          <span id="platformLabel">Web</span>
        </div>
        <div class="page-title" id="pageTitle">Loading…</div>
        <div class="page-url" id="pageUrl"></div>
      </div>

      <button class="clip-btn" id="clipBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 1.5C5.51 1.5 3.5 3.51 3.5 6c0 3.75 4.5 8.5 4.5 8.5S12.5 9.75 12.5 6c0-2.49-2.01-4.5-4.5-4.5z" fill="white"/>
          <circle cx="8" cy="6" r="1.5" fill="#6366f1"/>
        </svg>
        Clip to TravelPanel
      </button>
    </div>

    <!-- Blocked state (chrome:// pages) -->
    <div class="blocked-state" id="blockedSection" style="display:none">
      <div class="blocked-icon">🔒</div>
      <div class="blocked-title">Can't clip this page</div>
      <div class="blocked-desc">Navigate to a travel site like YouTube, Xiaohongshu, or Bilibili and try again.</div>
    </div>

    <!-- Success state -->
    <div class="success-state" id="successSection">
      <div class="success-ring">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M5 13l4 4L19 7" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="success-title">Opening TravelPanel…</div>
      <div class="success-desc">Pick a board to save your clip.<br>You can close this popup.</div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
