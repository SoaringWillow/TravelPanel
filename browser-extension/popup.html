<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- ── Header ─────────────────────────────────────────────────── -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="#6366f1"/>
          <path d="M12 4C9.2 4 7 6.2 7 9c0 4.2 5 11 5 11s5-6.8 5-11c0-2.8-2.2-5-5-5z" fill="white"/>
          <circle cx="12" cy="9" r="2" fill="#6366f1"/>
        </svg>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
      </button>
    </header>

    <!-- ── Setup prompt (shown until TravelPanel URL is configured) ── -->
    <div class="screen" id="setupScreen" hidden>
      <div class="setup-content">
        <div class="setup-icon">🗺️</div>
        <h2 class="setup-title">Set up TravelPanel</h2>
        <p class="setup-desc">Enter your TravelPanel URL to start clipping travel content.</p>
        <button class="btn-primary" id="openSettingsFromSetup">Configure URL →</button>
      </div>
    </div>

    <!-- ── Main screen ─────────────────────────────────────────────── -->
    <div class="screen" id="mainScreen">

      <!-- Page card -->
      <div class="page-card" id="pageCard">
        <div class="page-card-top">
          <img class="favicon" id="favicon" src="" alt="" width="18" height="18">
          <span class="platform-badge" id="platformBadge" hidden></span>
        </div>
        <h2 class="page-title" id="pageTitle">
          <span class="skeleton skeleton-title"></span>
        </h2>
        <p class="page-url" id="pageUrl"></p>
      </div>

      <!-- Board selector (minimal) -->
      <div class="board-row">
        <span class="board-label">Save to</span>
        <button class="board-chip active" id="inboxChip">📥 Inbox</button>
      </div>

    </div>

    <!-- ── Error screen ─────────────────────────────────────────────── -->
    <div class="screen" id="errorScreen" hidden>
      <div class="setup-content">
        <div class="setup-icon">⚠️</div>
        <p class="setup-desc" id="errorMsg">Something went wrong.</p>
      </div>
    </div>

    <!-- ── Footer / CTA ────────────────────────────────────────────── -->
    <footer class="footer">
      <button class="btn-clip" id="clipBtn">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
        </svg>
        <span id="clipBtnLabel">Clip to TravelPanel</span>
      </button>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
