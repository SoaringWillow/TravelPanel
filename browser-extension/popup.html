<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    :root {
      --bg: #0d0f1a;
      --surface: #161929;
      --surface-2: #1e2238;
      --border: rgba(255,255,255,0.07);
      --text: #eef0ff;
      --text-muted: #7c7fa8;
      --accent: #6366f1;
      --accent-dark: #4f52d9;
      --accent-light: rgba(99,102,241,0.12);
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Layout ── */
    .container { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.4px;
    }

    .logo svg { flex-shrink: 0; }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 5px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface); }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: -4px 0;
    }

    /* ── Platform badge ── */
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .platform-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ── Page info card ── */
    .page-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .page-url {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      transition: all 0.15s;
      letter-spacing: -0.2px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface-2); }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.75s linear infinite; }

    /* ── States ── */
    .state { display: none; }
    .state.active { display: flex; }

    /* ── Not configured ── */
    #notConfiguredState {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 8px 0 4px;
    }
    .setup-icon {
      width: 52px;
      height: 52px;
      background: var(--accent-light);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .state-title { font-size: 15px; font-weight: 700; }
    .state-body { font-size: 13px; color: var(--text-muted); line-height: 1.5; max-width: 230px; }

    /* ── No URL ── */
    #noUrlState {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      padding: 4px 0;
    }
    .no-url-icon { font-size: 30px; }

    /* ── Main view ── */
    #mainView { flex-direction: column; gap: 12px; }

    /* ── Success state ── */
    #successState {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      padding: 4px 0;
    }

    .success-ring {
      width: 56px;
      height: 56px;
      background: rgba(34,197,94,0.12);
      border: 2px solid var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--success);
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .success-title { font-size: 17px; font-weight: 700; }
    .success-body  { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

    .info-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      justify-content: center;
      padding-top: 2px;
    }
    .footer-link {
      font-size: 11px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      font-family: inherit;
      transition: color 0.15s;
    }
    .footer-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        TravelPanel
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Not configured -->
    <div class="state" id="notConfiguredState">
      <div class="setup-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <div>
        <div class="state-title">Set up TravelPanel</div>
      </div>
      <div class="state-body">Enter your TravelPanel URL to start clipping travel inspiration.</div>
      <button class="btn btn-primary" id="openSettingsBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Configure
      </button>
    </div>

    <!-- No URL (chrome://, about:, etc.) -->
    <div class="state" id="noUrlState">
      <div class="no-url-icon">🚫</div>
      <div class="state-title">Can't clip this page</div>
      <div class="state-body">Navigate to a travel blog, Instagram, YouTube, or any webpage to clip it.</div>
    </div>

    <!-- Main view -->
    <div class="state" id="mainView">
      <!-- Platform badge -->
      <div id="platformBadge"></div>

      <!-- Page info card -->
      <div class="page-card">
        <div class="page-title" id="pageTitle">Loading…</div>
        <div class="page-url" id="pageUrl"></div>
      </div>

      <!-- Clip button -->
      <button class="btn btn-primary" id="clipBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="clipIcon">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span id="clipBtnText">Clip this page</span>
      </button>
    </div>

    <!-- Success -->
    <div class="state" id="successState">
      <div class="success-ring">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="success-title">Clip sent to TravelPanel!</div>
      <div class="success-body" id="successBody">TravelPanel is extracting locations and travel wisdom from this page.</div>
      <div class="info-chips" id="infoChips"></div>
      <button class="btn btn-secondary" id="openAppBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
        </svg>
        Open TravelPanel
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="footer-link" id="footerLink">travelpanel.app</button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
