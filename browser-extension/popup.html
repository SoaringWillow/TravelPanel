<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      width: 340px;
      background: #fff;
      color: #111827;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f3f4f6;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 16px; height: 16px; }
    .logo-name {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.3px;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #6b7280; background: #f3f4f6; }

    /* ── Page info ── */
    .page-info {
      padding: 14px 16px 10px;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 9px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Divider ── */
    .divider { height: 1px; background: #f3f4f6; margin: 0 16px; }

    /* ── Action area ── */
    .action-area {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clip-btn {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    .clip-btn:hover { opacity: 0.92; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .clip-btn svg { flex-shrink: 0; }

    .open-app-btn {
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      color: #6b7280;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .open-app-btn:hover {
      border-color: #4f46e5;
      color: #4f46e5;
      background: #f5f3ff;
    }

    /* ── Status messages ── */
    .status {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .status.show { display: flex; }
    .status.success {
      background: #f0fdf4;
      color: #15803d;
    }
    .status.error {
      background: #fff1f2;
      color: #be123c;
    }
    .status.info {
      background: #eff6ff;
      color: #1d4ed8;
    }

    /* ── No-URL state ── */
    .no-url-state {
      padding: 24px 16px;
      text-align: center;
      display: none;
    }
    .no-url-state.show { display: block; }
    .no-url-state .icon { font-size: 32px; margin-bottom: 8px; }
    .no-url-state p {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }

    /* ── Not configured state ── */
    .not-configured {
      padding: 16px;
      background: #fffbeb;
      border-top: 1px solid #fef3c7;
      font-size: 12px;
      color: #92400e;
      display: none;
      align-items: flex-start;
      gap: 8px;
    }
    .not-configured.show { display: flex; }
    .not-configured a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }
    .not-configured a:hover { text-decoration: underline; }

    /* Platform colours */
    .platform-instagram { background: #fce7f3; color: #9d174d; }
    .platform-youtube   { background: #fee2e2; color: #b91c1c; }
    .platform-tiktok    { background: #f0fdf4; color: #166534; }
    .platform-twitter   { background: #eff6ff; color: #1e40af; }
    .platform-xiaohongshu { background: #fff1f2; color: #9f1239; }
    .platform-web       { background: #f3f4f6; color: #374151; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="7" r="5" stroke="white" stroke-width="1.4"/>
          <line x1="3" y1="7" x2="13" y2="7" stroke="white" stroke-width="1.2"/>
          <line x1="8" y1="2" x2="8" y2="12" stroke="white" stroke-width="1.2"/>
          <path d="M4.5 4 Q8 6 11.5 4" stroke="white" stroke-width="1" fill="none"/>
          <path d="M4.5 10 Q8 8 11.5 10" stroke="white" stroke-width="1" fill="none"/>
          <path d="M8 12 L6.5 15 L8 14 L9.5 15 Z" fill="white"/>
        </svg>
      </div>
      <span class="logo-name">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <!-- Page info (shown when URL is available) -->
  <div class="page-info" id="pageInfo">
    <div class="platform-badge platform-web" id="platformBadge">
      <span id="platformIcon"></span>
      <span id="platformLabel">Web</span>
    </div>
    <div class="page-title" id="pageTitle">Loading…</div>
    <div class="page-url" id="pageUrl"></div>
  </div>

  <!-- No-URL fallback -->
  <div class="no-url-state" id="noUrlState">
    <div class="icon">🌍</div>
    <p>Navigate to any travel page and click the extension to clip it to your boards.</p>
  </div>

  <div class="divider"></div>

  <!-- Actions -->
  <div class="action-area" id="actionArea">
    <button class="clip-btn" id="clipBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      Clip this page
    </button>
    <button class="open-app-btn" id="openAppBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15,3 21,3 21,9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open TravelPanel
    </button>
  </div>

  <!-- Status -->
  <div class="status" id="statusMsg" role="status"></div>

  <!-- Not-configured warning -->
  <div class="not-configured" id="notConfigured">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>Set your TravelPanel URL in <a href="#" id="configureLink">settings</a> to start clipping.</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
