<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      width: 340px;
      background: #ffffff;
      color: #111827;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: background 0.12s;
      color: #9ca3af;
      text-decoration: none;
    }
    .icon-btn:hover { background: #f3f4f6; }

    /* ── Page card ── */
    .page-card {
      margin: 12px 12px 8px;
      padding: 12px 14px;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      min-height: 64px;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-title.empty {
      color: #9ca3af;
      font-weight: 400;
    }

    .page-url {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Platform chip ── */
    .platform-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* ── Clip button ── */
    .clip-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: calc(100% - 24px);
      margin: 0 12px 10px;
      padding: 13px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: -0.1px;
    }
    .clip-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #4338ca, #6d28d9);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
      transform: translateY(-1px);
    }
    .clip-btn:active:not(:disabled) {
      transform: scale(0.98) translateY(0);
      box-shadow: none;
    }
    .clip-btn:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 12px 12px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .open-app {
      font-size: 12px;
      color: #6b7280;
      text-decoration: none;
      transition: color 0.12s;
    }
    .open-app:hover { color: #4f46e5; }

    .clip-count {
      font-size: 11px;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🗺</div>
      <span class="logo-text">TravelPanel</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="settings-btn" title="Settings">⚙️</button>
    </div>
  </div>

  <div class="page-card">
    <div id="platform-chip"></div>
    <div class="page-title" id="page-title">Loading…</div>
    <div class="page-url" id="page-url"></div>
  </div>

  <button class="clip-btn" id="clip-btn" disabled>
    <span>📍</span>
    <span id="btn-label">Clip to TravelPanel</span>
  </button>

  <div class="footer">
    <a class="open-app" id="open-app" href="#" target="_blank">Open TravelPanel →</a>
    <span class="clip-count" id="clip-count"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
