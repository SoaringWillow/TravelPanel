<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 200px;
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
      color: #f8fafc;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .settings-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: #94a3b8; }

    /* ── Page info ─────────────────────────────────── */
    .page-info {
      padding: 14px 16px 10px;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
      color: #fff;
    }
    .platform-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
    }
    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 11px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Board picker ──────────────────────────────── */
    .section {
      padding: 12px 16px 0;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .board-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .board-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      background: #1e293b;
      border: 1.5px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .board-item:hover { background: #253147; }
    .board-item.selected {
      border-color: #6366f1;
      background: #1e1e3f;
    }
    .board-emoji {
      font-size: 16px;
      flex-shrink: 0;
    }
    .board-name {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
      flex: 1;
    }
    .board-count {
      font-size: 11px;
      color: #64748b;
      background: #0f172a;
      padding: 2px 7px;
      border-radius: 100px;
    }
    .check-icon {
      display: none;
      color: #6366f1;
    }
    .board-item.selected .check-icon { display: block; }
    .board-item.selected .board-count { display: none; }

    /* ── Inbox option ──────────────────────────────── */
    .inbox-item {
      background: #0f172a;
      border: 1.5px dashed #334155;
    }
    .inbox-item:hover { background: #141f35; border-style: solid; }
    .inbox-item.selected { border-color: #6366f1; border-style: solid; background: #1e1e3f; }

    /* ── No boards state ──────────────────────────── */
    .empty-boards {
      padding: 6px 0;
      color: #475569;
      font-size: 12px;
      text-align: center;
    }

    /* ── Actions ───────────────────────────────────── */
    .actions {
      padding: 14px 16px 16px;
    }
    .clip-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }
    .clip-btn:hover { opacity: 0.92; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Success state ─────────────────────────────── */
    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      gap: 10px;
    }
    .success-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .success-title {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }
    .success-sub {
      font-size: 12px;
      color: #64748b;
    }
    .open-link {
      font-size: 12px;
      color: #6366f1;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .open-link:hover { background: #1e293b; }

    /* ── Not a travel page hint ───────────────────── */
    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      margin: 0 16px 14px;
      background: #1e293b;
      border-radius: 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* ── Loading ───────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🗺</div>
      TravelPanel
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </button>
  </div>

  <!-- ── Main content ── -->
  <div id="mainContent">

    <!-- Page info -->
    <div class="page-info">
      <div class="platform-badge" id="platformBadge">
        <span class="platform-dot"></span>
        <span id="platformLabel">Web</span>
      </div>
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-url" id="pageUrl"></div>
    </div>

    <!-- Non-travel hint (hidden by default) -->
    <div class="hint" id="travelHint" style="display:none">
      <span>🌍</span>
      <span>Tip: Works best with Instagram, YouTube, TikTok, Bilibili, and travel blogs.</span>
    </div>

    <!-- Board picker -->
    <div class="section">
      <div class="section-label">Save to board</div>
      <div class="board-list" id="boardList"></div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="clip-btn" id="clipBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        Clip to TravelPanel
      </button>
    </div>

  </div>

  <!-- ── Success state ── -->
  <div class="success-state" id="successState">
    <div class="success-icon">✓</div>
    <div class="success-title">Clipped!</div>
    <div class="success-sub" id="successSub">Opening TravelPanel…</div>
    <button class="open-link" id="openAppBtn">Open TravelPanel app</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
