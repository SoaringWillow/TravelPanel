<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <span class="brand-icon">✈️</span>
        <span class="brand-name">TravelPanel</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <!-- Page preview -->
    <div class="preview-card" id="preview-card">
      <div class="page-platform" id="platform-badge"></div>
      <div class="page-title" id="page-title">Loading page…</div>
      <div class="page-url" id="page-url"></div>
    </div>

    <!-- Error state (hidden by default) -->
    <div class="error-state hidden" id="error-state">
      <div class="error-icon">⚠️</div>
      <div class="error-message" id="error-message">Cannot clip this page.</div>
    </div>

    <!-- Actions -->
    <div class="actions" id="actions">
      <button id="save-btn" class="btn-primary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save to TravelPanel
      </button>

      <div class="quick-actions">
        <span class="quick-label">Quick save:</span>
        <button id="inbox-btn" class="btn-chip" disabled>📥 Inbox</button>
      </div>
    </div>

    <!-- Not configured state -->
    <div class="setup-state hidden" id="setup-state">
      <div class="setup-icon">🗺️</div>
      <p class="setup-text">Set your TravelPanel URL to start clipping.</p>
      <button id="setup-btn" class="btn-primary">Open Settings</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span id="app-url-display" class="app-url"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
