<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f1f1f1;
    }
    .header-logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      flex: 1;
    }
    .header-settings {
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      padding: 2px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .header-settings:hover { color: #555; }

    /* ── Current page preview ── */
    .page-preview {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f1f1f1;
    }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .platform-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    /* ── Board section ── */
    .board-section {
      padding: 12px 16px 8px;
    }
    .board-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .board-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }
    .chip {
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 99px;
      transition: opacity 0.1s, transform 0.1s;
      user-select: none;
    }
    .chip:active { transform: scale(0.95); }
    .chip-inbox {
      background: #EEF2FF;
      color: #4338CA;
    }
    .chip-inbox:hover { background: #E0E7FF; }
    .chip-board {
      background: #F3F4F6;
      color: #374151;
    }
    .chip-board:hover { background: #E5E7EB; }
    .chip-new {
      background: none;
      border: 2px dashed #D1D5DB;
      color: #6B7280;
    }
    .chip-new:hover { border-color: #9CA3AF; color: #374151; }

    /* ── New board input ── */
    .new-board-form {
      display: none;
      gap: 6px;
      margin-top: 6px;
      margin-bottom: 4px;
    }
    .new-board-form.visible { display: flex; }
    .new-board-input {
      flex: 1;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .new-board-input:focus { border-color: #6366F1; }
    .new-board-create {
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .new-board-create:hover { background: #4338CA; }
    .new-board-create:disabled { opacity: 0.4; cursor: default; }

    /* ── Footer / clip button ── */
    .footer {
      padding: 10px 16px 14px;
    }
    .clip-btn {
      width: 100%;
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, transform 0.1s;
    }
    .clip-btn:hover { background: #4338CA; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    /* ── States ── */
    #state-no-url {
      padding: 28px 16px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }
    #state-no-config {
      padding: 18px 16px;
    }
    #state-no-config p {
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    #state-no-config .config-btn {
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    #state-no-config .config-btn:hover { background: #4338CA; }

    #state-success {
      padding: 28px 16px;
      text-align: center;
    }
    .success-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }
    .success-sub {
      font-size: 12px;
      color: #888;
    }
    .success-action {
      margin-top: 14px;
      background: none;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .success-action:hover { border-color: #9CA3AF; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>
<body>

  <!-- ── States ─────────────────────────────────────────── -->

  <!-- No app URL configured -->
  <div id="state-no-config" style="display:none">
    <div class="header">
      <img class="header-logo" src="icons/icon48.png" alt="" />
      <span class="header-title">TravelPanel</span>
    </div>
    <div style="padding: 18px 16px;">
      <p style="font-size:13px; color:#555; margin-bottom:12px; line-height:1.5">
        Set your TravelPanel URL to start clipping travel posts to your boards.
      </p>
      <button class="config-btn" id="btn-open-options"
        style="background:#4F46E5;color:white;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;width:100%">
        Configure URL →
      </button>
    </div>
  </div>

  <!-- No URL on page (about:blank etc.) -->
  <div id="state-no-url" style="display:none">
    <div class="header">
      <img class="header-logo" src="icons/icon48.png" alt="" />
      <span class="header-title">TravelPanel</span>
    </div>
    <div style="padding:28px 16px; text-align:center; color:#aaa; font-size:13px; line-height:1.5">
      📍 Navigate to a travel post, article, or video to clip it.
    </div>
  </div>

  <!-- Main clipping UI -->
  <div id="state-main" style="display:none">
    <!-- Header -->
    <div class="header">
      <img class="header-logo" src="icons/icon48.png" alt="" />
      <span class="header-title">TravelPanel</span>
      <button class="header-settings" id="btn-settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <!-- Page preview -->
    <div class="page-preview">
      <div class="page-title" id="page-title"></div>
      <div class="page-url">
        <span class="platform-badge" id="platform-badge"></span>
        <span id="page-url-text"></span>
      </div>
    </div>

    <!-- Board picker -->
    <div class="board-section">
      <div class="board-label">Save to</div>
      <div class="board-chips" id="board-chips">
        <button class="chip chip-inbox" data-board-id="" data-board-name="Inbox">Inbox</button>
      </div>
      <!-- New board inline form -->
      <div class="new-board-form" id="new-board-form">
        <input type="text" class="new-board-input" id="new-board-input" placeholder="Board name…" maxlength="40" />
        <button class="new-board-create" id="btn-create-board">Create</button>
      </div>
    </div>

    <!-- Clip button -->
    <div class="footer">
      <button class="clip-btn" id="btn-clip" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        Clip to TravelPanel
      </button>
    </div>
  </div>

  <!-- Success state -->
  <div id="state-success" style="display:none">
    <div class="header">
      <img class="header-logo" src="icons/icon48.png" alt="" />
      <span class="header-title">TravelPanel</span>
    </div>
    <div style="padding:24px 16px; text-align:center">
      <div class="success-icon">✅</div>
      <div class="success-title" id="success-title">Saved to Inbox!</div>
      <div class="success-sub" id="success-sub">Opening TravelPanel…</div>
      <button class="success-action" id="btn-clip-another">Clip another</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
