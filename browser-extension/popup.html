<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- Header (always visible) -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">✈️</span>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Setup required -->
    <div id="setup-view" class="view hidden">
      <div class="setup-content">
        <div class="setup-icon">🗺️</div>
        <h2>Almost there!</h2>
        <p>Enter your TravelPanel URL to start saving travel inspiration from any site.</p>
        <button id="open-settings-btn" class="btn btn-primary">Configure URL</button>
      </div>
    </div>

    <!-- Main clip view -->
    <div id="main-view" class="view hidden">
      <div class="page-card">
        <div class="page-card-top">
          <div id="favicon-wrap">
            <div class="favicon-placeholder" id="favicon-placeholder"></div>
            <img id="favicon" class="favicon hidden" src="" alt="" width="16" height="16" />
          </div>
          <span id="platform-badge" class="platform-badge"></span>
        </div>
        <div id="page-title" class="page-title">Loading…</div>
        <div id="page-url" class="page-url"></div>
      </div>

      <button id="save-btn" class="btn btn-primary btn-large">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save to TravelPanel
      </button>

      <div class="footer">
        <button id="open-app-btn" class="text-btn">Open TravelPanel →</button>
      </div>
    </div>

    <!-- Success view -->
    <div id="success-view" class="view hidden">
      <div class="success-content">
        <div class="success-icon">✅</div>
        <p>Opening TravelPanel…</p>
        <p class="success-sub">Choose a board to save this clip.</p>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
