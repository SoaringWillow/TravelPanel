<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #ffffff;
      color: #1a1a1a;
    }

    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      padding: 14px 18px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: rgba(255,255,255,0.12);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-sub  { font-size: 11px; opacity: 0.55; margin-top: 1px; }

    .content { padding: 14px 16px 4px; }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .page-info {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 14px;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }

    .page-url {
      font-size: 11px;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .clip-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
      letter-spacing: -0.2px;
    }

    .clip-btn:hover  { opacity: 0.88; }
    .clip-btn:active { opacity: 0.7; transform: scale(0.99); }

    .clip-hint {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin: 9px 0 12px;
    }

    .divider { border: none; border-top: 1px solid #f1f5f9; }

    .settings-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 9px;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.1s;
    }
    .settings-link:hover { color: #0f172a; }

    /* Not-configured state */
    .setup-screen {
      padding: 20px 18px 16px;
      text-align: center;
    }
    .setup-icon { font-size: 32px; margin-bottom: 10px; }
    .setup-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .setup-desc {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .setup-btn {
      display: inline-block;
      padding: 10px 20px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      color: white;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .setup-btn:hover { opacity: 0.85; }

    /* Saved confirmation */
    .saved-screen {
      padding: 24px 18px;
      text-align: center;
    }
    .saved-check { font-size: 40px; margin-bottom: 10px; }
    .saved-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .saved-desc { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">✈️</div>
    <div>
      <div class="logo-text">TravelPanel</div>
      <div class="logo-sub">Clip travel inspiration</div>
    </div>
  </div>

  <!-- Main clip view -->
  <div id="main-content" style="display:none">
    <div class="content">
      <div id="platform-badge" class="platform-badge"></div>
      <div class="page-info">
        <div id="page-title" class="page-title"></div>
        <div id="page-url"   class="page-url"></div>
      </div>
      <button id="clip-btn" class="clip-btn">
        <span>📍</span>
        <span>Save to TravelPanel</span>
      </button>
      <p class="clip-hint">AI will extract locations &amp; wisdom from this page</p>
    </div>
    <hr class="divider">
    <a id="settings-link" class="settings-link" href="#">⚙️ Settings</a>
  </div>

  <!-- Not configured -->
  <div id="not-configured" style="display:none">
    <div class="setup-screen">
      <div class="setup-icon">🗺️</div>
      <div class="setup-title">Connect TravelPanel</div>
      <p class="setup-desc">Enter your TravelPanel app URL to start clipping travel inspiration from any webpage.</p>
      <button class="setup-btn" id="open-options">Open Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
