<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111827;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f3f4f6;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    .logo-text {
      font-size: 14px;
      font-weight: 700;
      color: #4f46e5;
      letter-spacing: -0.01em;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #6366f1; background: #eef2ff; }

    .content { padding: 14px 16px 16px; }

    .warning {
      background: #fef3c7;
      border: 1px solid #fbbf24;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #92400e;
      margin-bottom: 12px;
      display: none;
      line-height: 1.4;
    }
    .warning a {
      color: #d97706;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .warning a:hover { text-decoration: underline; }
    .warning.visible { display: block; }

    .platform-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .divider { height: 1px; background: #f3f4f6; margin: 14px -16px; }

    .save-btn {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .save-btn:hover { opacity: 0.9; }
    .save-btn:active { transform: scale(0.98); }
    .save-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* Success state */
    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      gap: 10px;
      text-align: center;
    }
    .success.visible { display: flex; }
    .success-icon {
      font-size: 44px;
      animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .success-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }
    .success-sub {
      font-size: 12px;
      color: #6b7280;
    }
    .open-app-btn {
      background: #eef2ff;
      color: #4f46e5;
      border: none;
      border-radius: 10px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .open-app-btn:hover { background: #e0e7ff; }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="icons/icon.svg" alt="" />
      <span class="logo-text">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="mainView" class="content">
    <div class="warning" id="warningBanner">
      App URL not configured. <a id="configureLink">Set it up →</a>
    </div>

    <span class="platform-chip" id="platformChip">Web</span>
    <div class="page-title" id="pageTitle">Loading…</div>
    <div class="page-url" id="pageUrl"></div>

    <div class="divider"></div>

    <button class="save-btn" id="saveBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      Save to TravelPanel
    </button>
  </div>

  <div id="successView" class="success">
    <div class="success-icon">✅</div>
    <div class="success-title">Saved!</div>
    <div class="success-sub">Opening TravelPanel in the background…</div>
    <button class="open-app-btn" id="openAppBtn">Open TravelPanel →</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
