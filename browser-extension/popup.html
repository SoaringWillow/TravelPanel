<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 120px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: #6366f1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #475569;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .settings-btn:hover { color: #94a3b8; }

    /* ── Page preview ── */
    .page-preview {
      padding: 11px 14px 10px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      border-bottom: 1px solid #1e293b;
      min-height: 48px;
    }

    .favicon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .favicon-placeholder {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      background: #1e293b;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-size: 10px;
    }

    .page-meta { flex: 1; min-width: 0; }

    .page-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.45;
    }

    .page-url {
      font-size: 11px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* ── Actions ── */
    .actions { padding: 11px 14px 14px; }

    .clip-btn {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
    }

    .clip-btn:hover:not(:disabled) { background: #4f46e5; }
    .clip-btn:active:not(:disabled) { transform: scale(0.98); }
    .clip-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Status ── */
    .status {
      margin-top: 9px;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .status.success {
      display: block;
      background: #042f2e;
      color: #34d399;
      border: 1px solid #065f46;
    }

    .status.error {
      display: block;
      background: #2d0505;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }

    /* ── Unsupported page notice ── */
    .unsupported {
      padding: 0 14px 12px;
      color: #475569;
      font-size: 11.5px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      TravelPanel
    </div>
    <button id="settings-btn" class="settings-btn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Page preview -->
  <div class="page-preview">
    <div class="favicon-placeholder" id="favicon-placeholder">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </div>
    <img id="favicon" class="favicon" style="display:none" alt="">
    <div class="page-meta">
      <div id="page-title" class="page-title">Loading…</div>
      <div id="page-url" class="page-url"></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button id="clip-btn" class="clip-btn" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      Clip to TravelPanel
    </button>
    <div id="status" class="status"></div>
  </div>

  <div id="unsupported" class="unsupported">
    Can't clip this page type
  </div>

  <script src="popup.js"></script>
</body>
</html>
