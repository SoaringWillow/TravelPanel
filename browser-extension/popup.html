<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #1f2937;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #6366f1;
      letter-spacing: -0.2px;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 5px;
      border-radius: 6px;
      line-height: 0;
    }
    .settings-btn:hover { background: #f3f4f6; color: #6b7280; }

    /* ── Page info ── */
    .content { padding: 14px 16px; }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 10px;
      white-space: nowrap;
    }

    .page-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #111827;
    }

    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .divider { height: 1px; background: #f3f4f6; margin: 13px 0; }

    /* ── Clip button ── */
    .clip-btn {
      width: 100%;
      padding: 11px 14px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.12s;
    }
    .clip-btn:hover { background: #4f46e5; }
    .clip-btn:active { background: #4338ca; transform: scale(0.99); }
    .clip-btn:disabled { background: #c7d2fe; cursor: not-allowed; }

    /* ── Not configured state ── */
    .no-config {
      padding: 20px 16px 16px;
      text-align: center;
    }
    .no-config-icon { font-size: 28px; margin-bottom: 10px; }
    .no-config-title {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    .no-config-sub {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    /* ── Success state ── */
    .success {
      padding: 28px 16px 20px;
      text-align: center;
    }
    .success-icon { font-size: 36px; margin-bottom: 10px; }
    .success-title {
      font-size: 14px;
      font-weight: 600;
      color: #059669;
      margin-bottom: 4px;
    }
    .success-sub { font-size: 12px; color: #9ca3af; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header (always visible) -->
  <div class="header">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5Z" fill="#6366f1" opacity="0.35"/>
        <path d="M2 17l10 5 10-5M2 12l10 5 10-5"
              stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      TravelPanel
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06
                 a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0
                 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0
                 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65
                 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65
                 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33
                 l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21
                 a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Main clip view -->
  <div id="mainView" class="hidden">
    <div class="content">
      <span class="platform-badge" id="platformBadge"></span>
      <div class="page-title" id="pageTitle"></div>
      <div class="page-url" id="pageUrl"></div>
      <div class="divider"></div>
      <button class="clip-btn" id="clipBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
        </svg>
        Save to TravelPanel
      </button>
    </div>
  </div>

  <!-- Not configured -->
  <div id="noConfigView" class="hidden">
    <div class="no-config">
      <div class="no-config-icon">🗺️</div>
      <div class="no-config-title">Connect TravelPanel</div>
      <div class="no-config-sub">Enter your TravelPanel URL to start saving travel clips.</div>
      <button class="clip-btn" id="openSettingsBtn">Open Settings</button>
    </div>
  </div>

  <!-- Success -->
  <div id="successView" class="hidden">
    <div class="success">
      <div class="success-icon">✅</div>
      <div class="success-title">Opening TravelPanel…</div>
      <div class="success-sub">Choose a board and save your clip.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
