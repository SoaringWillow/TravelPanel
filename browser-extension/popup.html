<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    /* ── Header ── */
    .header {
      background: #6366f1;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      font-size: 18px;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .header-sub {
      font-size: 11px;
      color: #c7d2fe;
      margin-top: 1px;
    }

    /* ── Page info ── */
    .page-info {
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
    }
    .platform-chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Actions ── */
    .actions {
      padding: 12px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-primary {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
      transform: none;
    }
    .btn-ghost {
      width: 100%;
      background: transparent;
      color: #6b7280;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-ghost:hover {
      border-color: #6366f1;
      color: #6366f1;
    }

    /* ── Loading state ── */
    #state-loading, #state-done {
      display: none;
    }
    .state-center {
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e0e7ff;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 14px;
      color: #6b7280;
    }

    /* ── Done state ── */
    .checkmark-icon {
      font-size: 48px;
      line-height: 1;
    }
    .done-title {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }
    .done-sub {
      font-size: 13px;
      color: #6b7280;
    }
    .btn-view {
      display: inline-block;
      margin-top: 4px;
      background: #eef2ff;
      color: #6366f1;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-view:hover { background: #e0e7ff; }

    /* ── Error state ── */
    .error-msg {
      padding: 10px 16px;
      background: #fef2f2;
      border-radius: 8px;
      font-size: 12px;
      color: #dc2626;
      margin: 0 16px 12px;
      display: none;
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-brand {
      font-size: 11px;
      color: #d1d5db;
      font-weight: 500;
    }
    .footer-settings {
      font-size: 11px;
      color: #9ca3af;
      cursor: pointer;
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
    }
    .footer-settings:hover { color: #6366f1; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="logo">📍</span>
    <div>
      <div class="header-title">TravelPanel</div>
      <div class="header-sub">Clip travel inspiration</div>
    </div>
  </div>

  <!-- ── State: Ready ── -->
  <div id="state-ready">
    <div class="page-info">
      <div id="platform-chip" class="platform-chip" style="background:#6366f1">Web</div>
      <p id="page-title" class="page-title">Loading…</p>
      <p id="page-url" class="page-url"></p>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <div class="actions">
      <button id="clip-btn" class="btn-primary">
        <span>📍</span>
        <span>Clip to TravelPanel</span>
      </button>
    </div>

    <div class="footer">
      <span class="footer-brand">TravelPanel Clipper</span>
      <button class="footer-settings" id="open-options">Settings ⚙</button>
    </div>
  </div>

  <!-- ── State: Loading ── -->
  <div id="state-loading">
    <div class="state-center">
      <div class="spinner"></div>
      <p class="loading-text">Opening TravelPanel…</p>
    </div>
  </div>

  <!-- ── State: Done ── -->
  <div id="state-done">
    <div class="state-center">
      <div class="checkmark-icon">✅</div>
      <p class="done-title">Clip saved!</p>
      <p class="done-sub" id="done-message">TravelPanel is extracting locations…</p>
      <a href="#" id="view-link" class="btn-view" target="_blank">View in TravelPanel →</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
