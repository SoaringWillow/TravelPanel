<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#f97316"/>
        <circle cx="12" cy="9" r="2.5" fill="white"/>
      </svg>
      <span class="logo-text">TravelPanel</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
      </svg>
    </button>
  </header>

  <!-- Main view -->
  <main id="mainView">
    <!-- Page preview card -->
    <div class="page-card" id="pageCard">
      <div class="thumbnail-wrap" id="thumbnailWrap">
        <div class="thumbnail-placeholder" id="thumbnailPlaceholder">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
        </div>
        <img class="thumbnail" id="thumbnail" alt="" style="display:none" />
      </div>
      <div class="page-info">
        <div class="platform-badge" id="platformBadge" style="display:none"></div>
        <div class="page-title" id="pageTitle">Loading page…</div>
        <div class="page-url" id="pageUrl"></div>
      </div>
    </div>

    <!-- Description preview -->
    <p class="description" id="description" style="display:none"></p>

    <!-- Save button -->
    <button class="clip-btn" id="clipBtn" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      </svg>
      <span>Clip to TravelPanel</span>
    </button>

    <!-- No URL configured warning -->
    <div class="warning" id="noUrlWarning" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Set your TravelPanel URL in settings first.
    </div>
  </main>

  <!-- Success view -->
  <div id="successView" class="success-view" style="display:none">
    <div class="success-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <p class="success-title">Clip saved!</p>
    <p class="success-sub">TravelPanel is opening…</p>
  </div>

  <!-- Settings view -->
  <div id="settingsView" style="display:none">
    <div class="settings-header">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <span class="settings-title">Settings</span>
    </div>

    <div class="settings-body">
      <label class="field-label" for="appUrlInput">TravelPanel URL</label>
      <input
        type="url"
        id="appUrlInput"
        class="field-input"
        placeholder="https://your-app.vercel.app"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="field-hint">The URL of your deployed TravelPanel app.</p>

      <button class="save-btn" id="saveSettingsBtn">Save</button>
      <div class="save-confirm" id="saveConfirm" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Saved
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
