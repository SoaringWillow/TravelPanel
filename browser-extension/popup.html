<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- ── Idle state ── -->
    <div id="idleState" class="state">
      <div class="url-card">
        <div class="url-card-header">
          <span id="platformBadge" class="platform-badge">Web</span>
          <span class="card-label">Current page</span>
        </div>
        <p id="pageTitle" class="page-title">Loading…</p>
        <p id="pageUrl" class="page-url">…</p>
      </div>

      <button id="clipBtn" class="clip-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Clip to TravelPanel
      </button>

      <div class="divider"><span>or clip a different URL</span></div>

      <div class="custom-url-row">
        <input type="url" id="customUrl" class="url-input" placeholder="https://…">
        <button id="customClipBtn" class="secondary-btn">Clip</button>
      </div>
    </div>

    <!-- ── Loading state ── -->
    <div id="loadingState" class="state hidden">
      <div class="center-card">
        <div class="spinner"></div>
        <p class="state-title">Opening TravelPanel…</p>
        <p class="state-sub">Extracting locations &amp; tips</p>
      </div>
    </div>

    <!-- ── Success state ── -->
    <div id="successState" class="state hidden">
      <div class="center-card">
        <div class="status-icon success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <p class="state-title">Opened in TravelPanel!</p>
        <p class="state-sub">Complete the clip in the TravelPanel tab</p>
        <button id="clipAnotherBtn" class="secondary-btn" style="margin-top:4px">Clip another</button>
      </div>
    </div>

    <!-- ── Error state ── -->
    <div id="errorState" class="state hidden">
      <div class="center-card">
        <div class="status-icon error-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </div>
        <p class="state-title error-title" id="errorMessage">Something went wrong</p>
        <button id="retryBtn" class="secondary-btn" style="margin-top:4px">Try again</button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>TravelPanel Clipper · v1.0</span>
      <span>·</span>
      <a id="openAppLink" href="#" class="footer-link">Open app</a>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
