<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: #ffffff;
      color: #1e293b;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      line-height: 1;
    }

    .brand-name {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      padding: 5px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .header-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }

    /* ── Page info card ── */
    .page-card {
      margin: 14px 14px 0;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .favicon-wrap {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #e2e8f0;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .favicon-wrap img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .favicon-placeholder {
      font-size: 14px;
    }

    .page-text {
      flex: 1;
      min-width: 0;
    }

    .page-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.4;
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-domain {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Restricted page state ── */
    .restricted {
      margin: 14px 14px 0;
      background: #fef9c3;
      border: 1px solid #fde047;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: #854d0e;
      line-height: 1.5;
      display: none;
    }

    /* ── Actions ── */
    .actions {
      padding: 14px;
    }

    .clip-btn {
      width: 100%;
      padding: 11px 18px;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 2px 10px rgba(14, 165, 233, 0.35);
      letter-spacing: -0.1px;
    }

    .clip-btn:hover:not(:disabled) { opacity: 0.9; }
    .clip-btn:active:not(:disabled) { transform: scale(0.98); }
    .clip-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .clip-btn.success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
    }

    .clip-btn .btn-icon { font-size: 15px; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid #f1f5f9;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer a {
      font-size: 11.5px;
      color: #64748b;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .footer a:hover { color: #0ea5e9; }

    .footer-arrow {
      font-size: 10px;
      opacity: 0.7;
    }

    /* ── Unconfigured state ── */
    .setup-notice {
      margin: 14px 14px 0;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #1d4ed8;
      line-height: 1.5;
      display: none;
    }

    .setup-notice a {
      font-weight: 600;
      color: #1d4ed8;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <div class="brand-icon">✈️</div>
      <span class="brand-name">TravelPanel</span>
    </div>
    <button class="header-btn" id="settingsBtn" title="Settings">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div class="setup-notice" id="setupNotice">
    ⚙️ First time? <a id="setupLink">Open Settings</a> to set your TravelPanel app URL.
  </div>

  <div class="restricted" id="restrictedNotice">
    ⚠️ This page can't be clipped. Navigate to a travel blog, Instagram, YouTube, or any travel content page.
  </div>

  <div class="page-card" id="pageCard">
    <div class="favicon-wrap" id="faviconWrap">
      <span class="favicon-placeholder">🌐</span>
    </div>
    <div class="page-text">
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-domain" id="pageDomain"></div>
    </div>
  </div>

  <div class="actions">
    <button class="clip-btn" id="clipBtn" disabled>
      <span class="btn-icon">✂️</span>
      <span id="clipBtnLabel">Clip this page</span>
    </button>
  </div>

  <div class="footer">
    <a id="openAppLink" href="#">
      Open TravelPanel <span class="footer-arrow">›</span>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
