<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      background: #fff;
      border-bottom: 1px solid #E2E8F0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #0D9488;
      letter-spacing: -0.3px;
    }

    .logo svg {
      flex-shrink: 0;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #94A3B8;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #475569; background: #F1F5F9; }

    /* ── Content ── */
    .content {
      padding: 14px 16px;
    }

    /* Page card */
    .page-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .favicon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      flex-shrink: 0;
      object-fit: contain;
      background: #F1F5F9;
    }

    .page-info { flex: 1; min-width: 0; }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #0F172A;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .page-url {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Platform badge */
    .platform-row {
      margin-bottom: 12px;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 20px;
      border: 1px solid;
      letter-spacing: 0.1px;
    }

    /* Save button */
    .save-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #0D9488;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }
    .save-btn:hover { background: #0F766E; }
    .save-btn:active { transform: scale(0.98); }
    .save-btn:disabled {
      background: #99F6E4;
      cursor: default;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #F1F5F9;
    }

    .open-app-link {
      font-size: 12px;
      color: #0D9488;
      text-decoration: none;
      font-weight: 500;
    }
    .open-app-link:hover { text-decoration: underline; }

    .version {
      font-size: 11px;
      color: #CBD5E1;
    }

    /* ── Success state ── */
    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 12px;
      text-align: center;
    }

    .success-icon {
      width: 52px;
      height: 52px;
      background: #CCFBF1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-title {
      font-size: 15px;
      font-weight: 700;
      color: #0F172A;
    }

    .success-sub {
      font-size: 12px;
      color: #64748B;
    }

    /* ── Error state ── */
    .error-banner {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #DC2626;
    }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, #F1F5F9 25%, #E2E8F0 50%, #F1F5F9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-title {
      height: 13px;
      width: 85%;
      margin-bottom: 6px;
    }
    .skeleton-url {
      height: 11px;
      width: 60%;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 2C7.24 2 5 4.24 5 7c0 3.75 5 11 5 11s5-7.25 5-11c0-2.76-2.24-5-5-5zm0 6.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="#0D9488"/>
      </svg>
      TravelPanel
    </div>
    <button class="settings-btn" id="settings-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M6.5 1a.5.5 0 0 0-.5.5v.527A5.98 5.98 0 0 0 3.35 3.544L2.887 3.28a.5.5 0 0 0-.683.183l-1.5 2.598a.5.5 0 0 0 .183.683l.463.267A5.97 5.97 0 0 0 1.25 8c0 .444.047.877.1 1.299l-.463.267a.5.5 0 0 0-.183.683l1.5 2.598a.5.5 0 0 0 .683.183l.463-.267A5.98 5.98 0 0 0 6 14.027v.473a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-.473A5.98 5.98 0 0 0 12.65 12.48l.463.267a.5.5 0 0 0 .683-.183l1.5-2.598a.5.5 0 0 0-.183-.683l-.463-.267c.053-.422.1-.855.1-1.299 0-.444-.047-.877-.1-1.299l.463-.267a.5.5 0 0 0 .183-.683l-1.5-2.598a.5.5 0 0 0-.683-.183l-.463.267A5.98 5.98 0 0 0 10 2.027V1.5a.5.5 0 0 0-.5-.5h-3zm.5 7a1.5 1.5 0 1 1 2 0A1.5 1.5 0 0 1 7 8z"/>
      </svg>
    </button>
  </div>

  <!-- Main content -->
  <div class="content">

    <!-- Page info card -->
    <div class="page-card">
      <img class="favicon" id="favicon" src="" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2218%22>🌐</text></svg>'">
      <div class="page-info" id="page-info-loading">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-url"></div>
      </div>
      <div class="page-info" id="page-info" style="display:none">
        <div class="page-title" id="page-title"></div>
        <div class="page-url" id="page-url"></div>
      </div>
    </div>

    <!-- Platform -->
    <div class="platform-row">
      <span class="platform-badge" id="platform-badge" style="background:#F0FDF4;color:#16A34A;border-color:#BBF7D0">
        🌐 Web page
      </span>
    </div>

    <!-- Error -->
    <div class="error-banner" id="error-banner"></div>

    <!-- Save button -->
    <button class="save-btn" id="save-btn" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4.414A1 1 0 0 0 14.707 3.707L13.293 2.293A1 1 0 0 0 12.586 2H2zm5.5 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zM3 4.5A.5.5 0 0 1 3.5 4h7a.5.5 0 0 1 .5.5V7a.5.5 0 0 1-.5.5h-7A.5.5 0 0 1 3 7V4.5z"/>
      </svg>
      Save to TravelPanel
    </button>

    <!-- Footer -->
    <div class="footer">
      <a href="#" class="open-app-link" id="open-app-link">Open TravelPanel App ↗</a>
      <span class="version" id="version-label">v1.0</span>
    </div>

  </div>

  <!-- Success state (replaces content) -->
  <div class="success-state" id="success-state">
    <div class="success-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="success-title">Clip saved!</div>
    <div class="success-sub" id="success-sub">Opening TravelPanel...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
