<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #fff;
      color: #111827;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f3f4f6;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; }
    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.3px;
    }
    .settings-btn {
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: #9ca3af;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #6b7280; background: #f3f4f6; }

    /* ── Setup state ────────────────────────────────────────────── */
    #setup-section {
      padding: 20px 16px;
      text-align: center;
    }
    .setup-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .setup-title {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 6px;
    }
    .setup-desc {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* ── Clip section ───────────────────────────────────────────── */
    #clip-section {
      padding: 14px 16px;
    }

    /* Platform badge */
    .platform-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .platform-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      color: #fff;
      letter-spacing: 0.2px;
    }
    .platform-icon {
      font-size: 14px;
    }

    /* Page info */
    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 16px;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 11px 16px;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn-primary svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.2; }

    .btn-secondary {
      width: 100%;
      padding: 10px 16px;
      background: #f9fafb;
      color: #6366f1;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #f3f4f6; border-color: #d1d5db; }

    .btn-configure {
      width: 100%;
      padding: 11px 16px;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-configure:hover { background: #4f46e5; }

    /* Success state */
    #success-section {
      padding: 20px 16px;
      text-align: center;
    }
    .success-icon { font-size: 40px; margin-bottom: 10px; }
    .success-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }
    .success-desc { font-size: 13px; color: #6b7280; }

    /* ── Footer ─────────────────────────────────────────────────── */
    .footer {
      border-top: 1px solid #f3f4f6;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-link {
      font-size: 11px;
      color: #9ca3af;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    .footer-link:hover { color: #6b7280; }

    /* ── Utility ─────────────────────────────────────────────────── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
    </div>
    <span class="logo-text">TravelPanel</span>
  </div>
  <button class="settings-btn" id="settings-btn" title="Settings">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>
</div>

<!-- Setup state (no app URL configured) -->
<div id="setup-section" class="hidden">
  <div class="setup-icon">🗺️</div>
  <div class="setup-title">Connect to your TravelPanel</div>
  <div class="setup-desc">Enter your TravelPanel URL to start clipping travel inspiration with one click.</div>
  <button class="btn-configure" id="configure-btn">Configure App URL</button>
</div>

<!-- Main clip state -->
<div id="clip-section" class="hidden">
  <div class="platform-row">
    <span class="platform-badge" id="platform-badge">Web</span>
  </div>
  <div class="page-title" id="page-title">Loading...</div>
  <div class="page-url" id="page-url"></div>

  <button class="btn-primary" id="clip-btn">
    <svg viewBox="0 0 24 24">
      <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
    </svg>
    Clip to TravelPanel
  </button>
  <button class="btn-secondary" id="open-app-btn">
    Open TravelPanel ↗
  </button>
</div>

<!-- Success state -->
<div id="success-section" class="hidden">
  <div class="success-icon">✅</div>
  <div class="success-title">Clipped!</div>
  <div class="success-desc">Opening TravelPanel to save your inspiration…</div>
</div>

<!-- Footer -->
<div class="footer">
  <span class="footer-link" id="footer-settings">Settings</span>
  <span style="font-size:11px;color:#d1d5db;">v1.0</span>
</div>

<script src="popup.js"></script>
</body>
</html>
