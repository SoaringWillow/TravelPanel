<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a2e;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
    }
    .header-logo {
      width: 30px;
      height: 30px;
      background: rgba(255,255,255,0.18);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .header-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.2px;
    }
    .header-subtitle {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 1px;
    }

    /* ── Content ─────────────────────────────── */
    .content { padding: 14px 16px 16px; }

    /* Platform badge */
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    /* URL card */
    .url-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }
    .url-favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
      background: #e2e8f0;
      object-fit: contain;
    }
    .url-info { flex: 1; min-width: 0; }
    .url-title {
      font-weight: 500;
      font-size: 13px;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .url-host {
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Inputs */
    .input-group { margin-bottom: 12px; }
    .input-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 5px;
    }
    .input-field {
      width: 100%;
      padding: 8px 11px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: #1e293b;
      background: #fff;
      transition: border-color 0.12s;
      outline: none;
    }
    .input-field:focus { border-color: #4f46e5; }
    .input-field::placeholder { color: #94a3b8; }

    /* Primary button */
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #4f46e5, #0ea5e9);
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.12s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.1px;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }
    .btn-primary:active:not(:disabled) { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Error message */
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      color: #dc2626;
      margin-bottom: 12px;
      display: none;
    }

    /* Spinner */
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Success state ─────────────────────────── */
    #successState {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 20px;
      text-align: center;
      gap: 10px;
    }
    .success-icon {
      width: 52px;
      height: 52px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    .success-title {
      font-weight: 700;
      font-size: 16px;
      color: #15803d;
    }
    .success-subtitle {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }

    /* ── Footer ─────────────────────────────── */
    .footer {
      padding: 9px 16px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-link {
      font-size: 11px;
      color: #94a3b8;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.12s;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
    }
    .footer-link:hover { color: #4f46e5; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">✈️</div>
    <div>
      <div class="header-title">TravelPanel Clipper</div>
      <div class="header-subtitle">Save travel inspiration</div>
    </div>
  </div>

  <!-- Main content -->
  <div id="mainContent" class="content">
    <!-- Platform badge (shown when detected) -->
    <div id="platformBadge" class="platform-badge" style="display:none;"></div>

    <!-- Error message -->
    <div id="errorMsg" class="error-msg"></div>

    <!-- URL card -->
    <div class="url-card" id="urlCard">
      <img class="url-favicon" id="favicon" src="" alt="" onerror="this.style.display='none'">
      <div class="url-info">
        <div class="url-title" id="pageTitle">Loading…</div>
        <div class="url-host" id="pageHost"></div>
      </div>
    </div>

    <!-- Note input -->
    <div class="input-group">
      <label class="input-label" for="noteInput">Note (optional)</label>
      <input
        type="text"
        id="noteInput"
        class="input-field"
        placeholder="e.g. Great for sunset views…"
        maxlength="200"
        autocomplete="off"
      >
    </div>

    <!-- Save button -->
    <button id="saveBtn" class="btn-primary">
      <span id="btnText">✈️ &nbsp;Save to TravelPanel</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>

  <!-- Success state -->
  <div id="successState">
    <div class="success-icon">✅</div>
    <div class="success-title">Saved!</div>
    <div class="success-subtitle" id="successSubtitle">Opening TravelPanel to process your clip…</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="footer-link" id="openApp">Open TravelPanel ↗</button>
    <button class="footer-link" id="openOptions">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
