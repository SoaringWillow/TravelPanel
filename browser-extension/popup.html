<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- ─── Default view ──────────────────────────────────────────────────────── -->
<div id="view-main">

  <header class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="6" fill="#4F46E5"/>
        <circle cx="12" cy="10" r="4.5" fill="white"/>
        <circle cx="12" cy="10" r="1.8" fill="#4F46E5"/>
        <path d="M10.5 13.8 L12 18 L13.5 13.8" fill="white"/>
      </svg>
      <span class="logo-text">TravelPanel</span>
    </div>
    <button id="btn-settings" class="btn-icon" title="Settings" aria-label="Open settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <main class="main">
    <div class="page-info">
      <div id="platform-chip" class="platform-chip" style="display:none"></div>
      <div id="page-title" class="page-title">Loading…</div>
      <div id="page-url" class="page-url"></div>
    </div>

    <button id="btn-clip" class="btn-clip" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13"/>
        <path d="M22 2L15 22 11 13 2 9 22 2z"/>
      </svg>
      <span>Clip to TravelPanel</span>
    </button>
  </main>

  <footer class="footer">
    <a id="link-open-app" href="#" class="open-app-link" target="_blank" rel="noopener noreferrer">
      Open TravelPanel
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </footer>

</div>

<!-- ─── Success view ───────────────────────────────────────────────────────── -->
<div id="view-success" class="view-hidden">
  <div class="success-inner">
    <div class="success-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 12l3 3 5-5"/>
      </svg>
    </div>
    <p class="success-title">Opening TravelPanel…</p>
    <p class="success-sub">Choose a board to save your clip</p>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
