<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .logo {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      flex: 1;
    }
    .settings-btn {
      background: none; border: none;
      color: #64748b; cursor: pointer;
      padding: 4px; border-radius: 4px;
      font-size: 16px; line-height: 1;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: #94a3b8; }

    /* ── Page Info ───────────────────────────────────────── */
    .page-info {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
      min-height: 76px;
    }
    .platform-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 99px;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge-xhs   { background: #fee2e2; color: #991b1b; }
    .badge-tiktok{ background: #f0fdf4; color: #166534; }
    .badge-yt    { background: #fef9c3; color: #854d0e; }
    .badge-ig    { background: #fce7f3; color: #9d174d; }
    .badge-web   { background: #e0e7ff; color: #3730a3; }

    .page-title {
      font-size: 13px; font-weight: 500; color: #e2e8f0;
      line-height: 1.4; margin-bottom: 4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .page-url {
      font-size: 11px; color: #475569;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Clip button ────────────────────────────────────── */
    .main { padding: 12px 16px 16px; }

    .clip-btn {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }
    .clip-btn:hover:not(:disabled) { opacity: 0.9; }
    .clip-btn:active:not(:disabled) { transform: scale(0.98); }
    .clip-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .clip-btn.success { background: linear-gradient(135deg, #10b981, #059669); }

    /* ── No-URL state ────────────────────────────────────── */
    .no-url {
      text-align: center; padding: 28px 16px;
      color: #475569; font-size: 13px; line-height: 1.6;
    }
    .no-url .emoji { font-size: 28px; margin-bottom: 8px; }

    /* ── Settings panel ──────────────────────────────────── */
    .settings-panel {
      display: none;
      padding: 0 16px 16px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
    }
    .settings-panel.open { display: block; }

    .settings-label {
      font-size: 10px; font-weight: 600;
      color: #64748b; text-transform: uppercase; letter-spacing: 0.06em;
      margin: 12px 0 5px;
    }
    .settings-input {
      width: 100%;
      padding: 8px 10px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 6px; color: #e2e8f0;
      font-size: 12px; outline: none;
      transition: border-color 0.15s;
    }
    .settings-input:focus { border-color: #6366f1; }
    .settings-input::placeholder { color: #475569; }

    .save-btn {
      margin-top: 8px;
      padding: 7px 14px;
      background: #1e293b; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 6px;
      font-size: 12px; cursor: pointer; transition: background 0.15s;
    }
    .save-btn:hover { background: #334155; }

    .hint {
      margin-top: 8px;
      font-size: 10px; color: #475569; line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">✈</div>
    <span class="header-title">TravelPanel Clipper</span>
    <button class="settings-btn" id="settingsToggle" title="Settings">⚙</button>
  </div>

  <!-- Page info + clip button (shown when a clippable URL is active) -->
  <div id="mainContent">
    <div class="page-info" id="pageInfo">
      <div id="platformBadge"></div>
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-url"  id="pageUrl"></div>
    </div>
    <div class="main">
      <button class="clip-btn" id="clipBtn">
        <span id="clipIcon">📌</span>
        <span id="clipText">Clip to TravelPanel</span>
      </button>
    </div>
  </div>

  <!-- Fallback shown on chrome://, about:, etc. -->
  <div class="no-url" id="noUrl" style="display:none">
    <div class="emoji">🗺️</div>
    <div>Navigate to a travel page<br>to clip it into TravelPanel</div>
  </div>

  <!-- Settings panel (toggled by gear icon) -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-label">TravelPanel URL</div>
    <input
      type="text"
      class="settings-input"
      id="urlInput"
      placeholder="https://your-app.vercel.app"
    />
    <button class="save-btn" id="saveBtn">Save</button>
    <div class="hint">
      Set this to your deployed TravelPanel URL, or<br>
      <code style="color:#818cf8">http://localhost:3000</code> during development.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
