<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .app-name {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .settings-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      padding: 5px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.12s, background 0.12s;
    }
    .settings-btn:hover { color: #94a3b8; background: #1e293b; }

    /* ── Page info ── */
    .page-info {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e293b;
    }
    .page-title {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-url {
      font-size: 11px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      margin-top: 8px;
    }
    .badge-xiaohongshu { background: #450a0a; color: #fca5a5; }
    .badge-youtube     { background: #450a0a; color: #f87171; }
    .badge-instagram   { background: #3b0764; color: #d8b4fe; }
    .badge-wechat      { background: #052e16; color: #86efac; }
    .badge-douyin      { background: #0c0a09; color: #d4d4d4; }
    .badge-other       { background: #1e293b; color: #94a3b8; }

    /* ── Actions ── */
    .actions {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clip-btn {
      width: 100%;
      padding: 11px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s, transform 0.08s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .clip-btn:hover:not(:disabled) { background: #1d4ed8; }
    .clip-btn:active:not(:disabled) { transform: scale(0.98); }
    .clip-btn:disabled {
      background: #1e293b;
      color: #475569;
      cursor: default;
    }

    .secondary-row {
      display: flex;
      gap: 8px;
    }
    .secondary-btn {
      flex: 1;
      padding: 8px 12px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
      text-align: center;
    }
    .secondary-btn:hover { background: #273549; border-color: #475569; color: #e2e8f0; }

    /* ── Not configured state ── */
    .setup-screen {
      padding: 20px 16px 18px;
      text-align: center;
    }
    .setup-screen .setup-icon { font-size: 32px; margin-bottom: 10px; }
    .setup-screen h2 {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }
    .setup-screen p {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .setup-btn {
      padding: 9px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .setup-btn:hover { background: #1d4ed8; }

    /* ── Success / Error overlays ── */
    .toast {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }
    .toast-icon { font-size: 36px; }
    .toast-msg { font-size: 13px; font-weight: 500; color: #94a3b8; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">✈️</div>
    <span class="app-name">TravelPanel</span>
    <button class="settings-btn" id="settings-btn" title="Settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Main: page info + actions -->
  <div id="main-screen">
    <div class="page-info">
      <div class="page-title" id="page-title">Loading…</div>
      <div class="page-url"  id="page-url"></div>
      <div id="platform-badge-wrap"></div>
    </div>
    <div class="actions">
      <button class="clip-btn" id="clip-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Clip to TravelPanel
      </button>
      <div class="secondary-row">
        <button class="secondary-btn" id="open-app-btn">Open App ↗</button>
      </div>
    </div>
  </div>

  <!-- Setup screen (no URL configured) -->
  <div id="setup-screen" style="display:none">
    <div class="setup-screen">
      <div class="setup-icon">🗺️</div>
      <h2>Connect TravelPanel</h2>
      <p>Enter your TravelPanel URL to start<br>clipping travel inspiration.</p>
      <button class="setup-btn" id="setup-btn">Configure →</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
