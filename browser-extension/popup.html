<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <!-- Location pin icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>TravelPanel</h1>
        <span>Clip travel inspiration</span>
      </div>
    </header>

    <main id="main-content">
      <!-- Loading state -->
      <div id="loading-state" class="page-card">
        <div class="page-favicon-placeholder"></div>
        <div class="page-text">
          <div class="skeleton wide"></div>
          <div class="skeleton narrow"></div>
        </div>
      </div>

      <!-- Page info card (hidden until loaded) -->
      <div id="page-card" class="page-card" style="display:none">
        <img id="page-favicon" class="page-favicon" alt="" style="display:none">
        <div id="page-favicon-placeholder" class="page-favicon-placeholder" style="display:none"></div>
        <div class="page-text">
          <div class="page-title" id="page-title"></div>
          <div class="page-domain" id="page-domain"></div>
        </div>
        <span id="platform-chip" class="platform-chip" style="display:none"></span>
      </div>

      <button class="save-btn" id="save-btn" disabled>
        <!-- Bookmark icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
        </svg>
        Save to TravelPanel
      </button>

      <div class="status" id="status" style="display:none"></div>
    </main>

    <footer>
      <a href="#" id="options-link">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Settings
      </a>
      <a href="#" id="open-app-link">
        Open app →
      </a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
