<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 340px;
      background: #fff;
      color: #111827;
      overflow: hidden;
    }

    /* ── State management ─────────────────────────────────────────── */
    .state { display: none; }
    .state.active { display: flex; flex-direction: column; }

    /* ── Header ───────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
      color: white;
    }
    .header-logo {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      flex: 1;
    }
    .header-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.15s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.3); }

    /* ── Content area ─────────────────────────────────────────────── */
    .content {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Page card ────────────────────────────────────────────────── */
    .page-card {
      background: #F9FAFB;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
      object-fit: contain;
    }
    .page-info { flex: 1; min-width: 0; }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-domain {
      font-size: 11px;
      color: #9CA3AF;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      color: white;
      letter-spacing: 0.2px;
    }

    /* ── Primary button ───────────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #6366F1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #4F46E5; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-icon { font-size: 16px; }

    /* ── Recent clips ─────────────────────────────────────────────── */
    .recent-section { display: flex; flex-direction: column; gap: 6px; }
    .recent-label {
      font-size: 11px;
      font-weight: 600;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .recent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .recent-title {
      font-size: 12px;
      color: #374151;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .recent-time {
      font-size: 11px;
      color: #9CA3AF;
      flex-shrink: 0;
    }

    /* ── Divider ─────────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: #F3F4F6;
      margin: 0 -16px;
    }

    /* ── Success state ────────────────────────────────────────────── */
    #state-success .content {
      align-items: center;
      text-align: center;
      padding: 24px 20px;
      gap: 10px;
    }
    .success-check {
      font-size: 48px;
      line-height: 1;
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop {
      0%   { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .success-heading {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }
    .success-sub {
      font-size: 13px;
      color: #6B7280;
      line-height: 1.5;
      max-width: 240px;
    }
    .success-badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: white;
    }

    /* ── Setup state ──────────────────────────────────────────────── */
    #state-setup .content {
      align-items: center;
      text-align: center;
      padding: 20px;
      gap: 12px;
    }
    .setup-icon { font-size: 40px; line-height: 1; }
    .setup-heading { font-size: 15px; font-weight: 700; color: #111827; }
    .setup-sub { font-size: 12px; color: #6B7280; line-height: 1.6; max-width: 240px; }
    .btn-secondary {
      padding: 10px 20px;
      background: #EEF2FF;
      color: #4F46E5;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: #E0E7FF; }
  </style>
</head>
<body>

  <!-- ── Default state: page info + clip button ─────────────────────────── -->
  <div id="state-default" class="state">
    <header class="header">
      <img src="icons/icon.svg" alt="" class="header-logo">
      <span class="header-title">TravelPanel</span>
      <button id="settings-btn" class="header-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>

    <div class="content">
      <!-- Page card -->
      <div class="page-card">
        <img id="favicon" class="favicon" alt="">
        <div class="page-info">
          <div id="page-title" class="page-title">Loading…</div>
          <div id="page-domain" class="page-domain"></div>
          <span id="platform-badge" class="platform-badge">Web</span>
        </div>
      </div>

      <!-- Clip button -->
      <button id="clip-btn" class="btn-primary">
        <span class="btn-icon">✈️</span>
        Clip to TravelPanel
      </button>

      <!-- Recent clips -->
      <div id="recent-section" class="recent-section">
        <div class="divider" style="margin-bottom: 4px;"></div>
        <span class="recent-label">Recently clipped</span>
        <div id="recent-list"></div>
      </div>
    </div>
  </div>

  <!-- ── Success state ──────────────────────────────────────────────────── -->
  <div id="state-success" class="state">
    <header class="header">
      <img src="icons/icon.svg" alt="" class="header-logo">
      <span class="header-title">TravelPanel</span>
    </header>
    <div class="content">
      <div class="success-check">✅</div>
      <div class="success-heading">Opening TravelPanel…</div>
      <span id="success-platform" class="success-badge">Web</span>
      <p id="success-title" class="success-sub"></p>
    </div>
  </div>

  <!-- ── Setup state: no URL configured ────────────────────────────────── -->
  <div id="state-setup" class="state">
    <header class="header">
      <img src="icons/icon.svg" alt="" class="header-logo">
      <span class="header-title">TravelPanel</span>
    </header>
    <div class="content">
      <div class="setup-icon">🗺️</div>
      <div class="setup-heading">Set up TravelPanel</div>
      <p class="setup-sub">
        Enter your TravelPanel app URL to start clipping travel inspiration from any website.
      </p>
      <button id="open-options" class="btn-secondary">Configure URL →</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
