<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: #0F172A;
      color: #F1F5F9;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      color: #14B8A6;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge {
      font-size: 9px;
      background: #134E4A;
      color: #5EEAD4;
      border-radius: 4px;
      padding: 2px 5px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* ── Page Card ── */
    .page-card {
      background: #1E293B;
      border: 1px solid #2D3F55;
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .favicon-wrap {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .favicon {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      object-fit: cover;
    }

    .favicon-placeholder {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .page-info { flex: 1; min-width: 0; }

    .page-title {
      font-size: 12.5px;
      font-weight: 500;
      color: #E2E8F0;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-domain {
      font-size: 11px;
      color: #475569;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Status bar ── */
    .status-bar {
      display: none;
      font-size: 12px;
      text-align: center;
      padding: 7px 10px;
      border-radius: 7px;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .status-bar.success { display: block; background: #064E3B; color: #6EE7B7; }
    .status-bar.error   { display: block; background: #450A0A; color: #FCA5A5; }

    /* ── Primary CTA ── */
    .clip-btn {
      width: 100%;
      padding: 11px 14px;
      background: linear-gradient(135deg, #0D9488 0%, #0891B2 100%);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .clip-btn:hover:not(:disabled) { opacity: 0.9; }
    .clip-btn:active:not(:disabled) { transform: scale(0.98); }
    .clip-btn:disabled {
      background: linear-gradient(135deg, #1E293B 0%, #1E293B 100%);
      color: #475569;
      cursor: default;
    }
    .clip-btn.success {
      background: linear-gradient(135deg, #065F46 0%, #064E3B 100%);
      color: #6EE7B7;
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 11px;
    }

    .settings-btn {
      font-size: 11px;
      color: #334155;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 0;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.1s;
    }
    .settings-btn:hover { color: #64748B; }

    /* ── Travel hint ── */
    .travel-hint {
      font-size: 10.5px;
      color: #334155;
      text-align: center;
      margin-top: 9px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.5" stroke="#0D9488" stroke-width="1.5"/>
        <ellipse cx="12" cy="12" rx="4.5" ry="9.5" stroke="#0D9488" stroke-width="1.2"/>
        <line x1="2.5" y1="12" x2="21.5" y2="12" stroke="#0D9488" stroke-width="1.2"/>
        <line x1="4.5" y1="7.5" x2="19.5" y2="7.5" stroke="#0D9488" stroke-width="0.9" stroke-dasharray="1.5 1"/>
        <line x1="4.5" y1="16.5" x2="19.5" y2="16.5" stroke="#0D9488" stroke-width="0.9" stroke-dasharray="1.5 1"/>
      </svg>
      <span class="brand-name">TravelPanel</span>
    </div>
    <span class="badge">CLIPPER</span>
  </div>

  <!-- Current page -->
  <div class="page-card" id="pageCard">
    <div class="favicon-wrap">
      <img class="favicon" id="favicon" style="display:none" alt="" />
      <div class="favicon-placeholder" id="faviconPlaceholder">🌐</div>
    </div>
    <div class="page-info">
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-domain" id="pageDomain"></div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar" id="statusBar"></div>

  <!-- CTA -->
  <button class="clip-btn" id="clipBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
    Clip to TravelPanel
  </button>

  <p class="travel-hint" id="travelHint"></p>

  <!-- Footer -->
  <div class="footer">
    <button class="settings-btn" id="settingsBtn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
