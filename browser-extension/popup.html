<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <div class="logo">
        <span class="logo-icon">🗺</span>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Main clip view -->
    <main id="clip-view">
      <div class="page-info">
        <div id="platform-chip" class="platform-chip hidden"></div>
        <p id="page-title" class="page-title">Loading…</p>
        <p id="page-url" class="page-url"></p>
      </div>

      <button id="clip-btn" class="clip-btn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
        Clip to TravelPanel
      </button>
    </main>

    <!-- Success view -->
    <main id="success-view" class="hidden">
      <div class="success-content">
        <div class="success-icon">✅</div>
        <p class="success-title">Saved!</p>
        <p class="success-subtitle">Opening TravelPanel…</p>
      </div>
    </main>

    <!-- Settings view -->
    <main id="settings-view" class="hidden">
      <div class="settings-content">
        <h2 class="settings-title">Settings</h2>
        <label class="settings-label" for="app-url-input">TravelPanel URL</label>
        <input
          type="url"
          id="app-url-input"
          class="settings-input"
          placeholder="https://your-app.vercel.app"
          spellcheck="false"
        />
        <p class="settings-hint">The URL where your TravelPanel app is deployed.</p>
        <div class="settings-actions">
          <button id="save-settings-btn" class="save-btn">Save</button>
          <button id="cancel-settings-btn" class="cancel-btn">Cancel</button>
        </div>
        <p id="settings-status" class="settings-status hidden"></p>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
