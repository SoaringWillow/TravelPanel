<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      width: 340px;
      background: #fff;
      color: #111827;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #4338CA 0%, #6366F1 100%);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 7px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: background 0.15s;
    }

    .icon-btn:hover { background: rgba(255,255,255,0.25); }

    /* ── Main clip state ── */
    .clip-state {
      padding: 14px 16px 16px;
    }

    .platform-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 9px;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 100px;
      color: white;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 11px;
      color: #9CA3AF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 14px;
    }

    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #4338CA 0%, #6366F1 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 3px 10px rgba(79, 70, 229, 0.35);
      letter-spacing: -0.01em;
    }

    .save-btn:hover { opacity: 0.92; }
    .save-btn:active { transform: scale(0.985); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .hint-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 9px;
      font-size: 11px;
      color: #9CA3AF;
    }

    /* ── No URL state ── */
    .no-url-state {
      padding: 28px 16px;
      text-align: center;
    }

    .no-url-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .no-url-title {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }

    .no-url-sub {
      font-size: 11px;
      color: #9CA3AF;
      line-height: 1.5;
    }

    /* ── Success state ── */
    .success-state {
      padding: 20px 16px 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .success-ring {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #D1FAE5, #A7F3D0);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 4px;
      animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .success-title {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }

    .success-sub {
      font-size: 11px;
      color: #6B7280;
      line-height: 1.4;
      max-width: 260px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .view-btn {
      margin-top: 8px;
      width: 100%;
      background: #F0FDF4;
      color: #15803D;
      border: 1.5px solid #86EFAC;
      border-radius: 11px;
      padding: 10px 18px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .view-btn:hover { background: #DCFCE7; }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #F3F4F6;
      margin: 0 16px;
    }

    /* ── Footer tabs ── */
    .footer {
      display: flex;
      padding: 8px 12px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 500;
      color: #6B7280;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn:hover {
      background: #F3F4F6;
      color: #111827;
    }

    .tab-btn.active {
      background: #EEF2FF;
      color: #4338CA;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">✈️</div>
      TravelPanel
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Clip state -->
  <div id="clipState" class="clip-state">

    <!-- Content area (URL detected) -->
    <div id="clipContent">
      <div class="platform-row">
        <span id="platformBadge" class="platform-badge"></span>
      </div>
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-url" id="pageUrl"></div>

      <button class="save-btn" id="saveBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17,21 17,13 7,13 7,21"/>
          <polyline points="7,3 7,8 15,8"/>
        </svg>
        Save to TravelPanel
      </button>

      <div class="hint-row">
        <span>✨</span>
        <span>AI extracts spots &amp; travel wisdom</span>
      </div>
    </div>

    <!-- No URL fallback -->
    <div id="noUrlState" class="no-url-state" style="display:none">
      <div class="no-url-icon">🌏</div>
      <div class="no-url-title">Navigate to a travel page</div>
      <div class="no-url-sub">Open Instagram, YouTube, Xiaohongshu, or any travel site, then click the extension.</div>
    </div>

  </div>

  <!-- Success state -->
  <div class="success-state" id="successState">
    <div class="success-ring">✅</div>
    <div class="success-title">TravelPanel opened!</div>
    <div class="success-sub" id="successSub">Saving your clip…</div>
    <button class="view-btn" id="viewBtn">Open TravelPanel →</button>
  </div>

  <div class="divider"></div>

  <!-- Footer tabs -->
  <div class="footer">
    <button class="tab-btn active" id="tabClip">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      </svg>
      Clip
    </button>
    <button class="tab-btn" id="tabOpen">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15,3 21,3 21,9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open App
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
