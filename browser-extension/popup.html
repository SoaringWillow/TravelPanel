<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: #0A0A0C;
      color: #F0F0F2;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 14px 11px;
      border-bottom: 1px solid #1A1A1F;
    }
    .logo {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #F0F0F2;
    }
    .gear-btn {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: #5A5A66;
      padding: 4px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      transition: color 0.1s, background 0.1s;
    }
    .gear-btn:hover { color: #A0A0B0; background: #1A1A1F; }

    /* ── Content ─────────────────────────────────────────────────── */
    .content { padding: 13px 14px; }

    /* ── Page info ────────────────────────────────────────────────── */
    .page-info { margin-bottom: 11px; }
    .page-title {
      font-size: 13px;
      font-weight: 500;
      color: #E0E0E8;
      line-height: 1.45;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px 2px 5px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .platform-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
    }
    .url-text {
      font-size: 11px;
      color: #5A5A66;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Clip button ──────────────────────────────────────────────── */
    .clip-btn {
      width: 100%;
      padding: 9px 12px;
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s;
      letter-spacing: -0.01em;
    }
    .clip-btn:hover:not(:disabled) { opacity: 0.88; }
    .clip-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Loading ──────────────────────────────────────────────────── */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0 6px;
      gap: 9px;
      color: #7A7A8A;
      font-size: 12px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #22222A;
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Success ──────────────────────────────────────────────────── */
    .success-card {
      background: #0B1A14;
      border: 1px solid #14332A;
      border-radius: 10px;
      padding: 13px;
    }
    .success-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .success-check {
      width: 26px;
      height: 26px;
      background: #15803D;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .success-title {
      font-size: 13px;
      font-weight: 600;
      color: #4ADE80;
    }
    .success-subtitle {
      font-size: 11px;
      color: #166534;
      margin-top: 1px;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #0F261E;
      border: 1px solid #15402E;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #86EFAC;
    }
    .open-link {
      display: block;
      text-align: center;
      margin-top: 11px;
      font-size: 12px;
      font-weight: 500;
      color: #6366F1;
      text-decoration: none;
      padding: 8px;
      border: 1px solid #1E1E40;
      border-radius: 7px;
      transition: background 0.1s, color 0.1s;
    }
    .open-link:hover { background: #0F0F20; color: #818CF8; }

    /* ── Setup required ───────────────────────────────────────────── */
    .setup-card {
      background: #13100A;
      border: 1px solid #2A1F08;
      border-radius: 10px;
      padding: 16px 14px;
      text-align: center;
    }
    .setup-emoji { font-size: 26px; margin-bottom: 8px; }
    .setup-title {
      font-size: 13px;
      font-weight: 600;
      color: #F59E0B;
      margin-bottom: 4px;
    }
    .setup-desc {
      font-size: 12px;
      color: #78501A;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .configure-btn {
      padding: 8px 18px;
      background: #F59E0B;
      color: #1C0D00;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.1s;
    }
    .configure-btn:hover { background: #D97706; }

    /* ── Error ────────────────────────────────────────────────────── */
    .error-card {
      background: #120808;
      border: 1px solid #3F1010;
      border-radius: 9px;
      padding: 11px 12px;
      color: #F87171;
      font-size: 12px;
      line-height: 1.6;
    }
    .error-detail {
      color: #7A2020;
      font-size: 11px;
      margin-top: 4px;
    }
    .retry-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: none;
      border: 1px solid #3F1010;
      border-radius: 7px;
      color: #F87171;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }
    .retry-btn:hover { background: #1A0A0A; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✈</div>
    <span class="header-title">TravelPanel</span>
    <button class="gear-btn" id="gearBtn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
  <div class="content" id="content">
    <div class="loading-state">
      <div class="spinner"></div>
      Loading…
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
