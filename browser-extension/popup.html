<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Main clip view -->
    <div id="mainView" class="view">
      <header>
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="#6366f1"/>
            <path d="M12 5C9.24 5 7 7.24 7 10c0 3.75 5 9 5 9s5-5.25 5-9c0-2.76-2.24-5-5-5zm0 6.5c-.83 0-1.5-.67-1.5-1.5S11.17 8.5 12 8.5s1.5.67 1.5 1.5S12.83 11.5 12 11.5z" fill="white"/>
          </svg>
          <span>TravelPanel</span>
        </div>
        <button class="icon-btn" id="settingsBtn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </header>

      <div class="page-info">
        <div class="platform-badge" id="platformBadge" style="display:none"></div>
        <div class="page-meta">
          <img class="favicon" id="faviconImg" src="" alt="" style="display:none">
          <div class="page-text">
            <div class="page-title" id="pageTitleEl">Loading…</div>
            <div class="page-url" id="pageUrlEl"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Save to board</div>
        <div class="board-grid" id="boardGrid">
          <button class="board-chip selected" data-board-id="">
            <span>📥</span><span>Inbox</span>
          </button>
        </div>
        <div class="boards-hint" id="boardsHint">
          <span id="boardsHintText">Open TravelPanel to sync boards</span>
        </div>
      </div>

      <div class="actions">
        <button class="clip-btn" id="clipBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Clip to TravelPanel
        </button>

        <!-- Shown only when on the TravelPanel app tab -->
        <button class="sync-btn" id="syncBtn" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <polyline points="23 20 23 14 17 14"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
          <span id="syncBtnLabel">Sync pending clips</span>
        </button>
      </div>

      <div class="pending-notice" id="pendingNotice" style="display:none">
        <span id="pendingNoticeText"></span>
      </div>
    </div>

    <!-- Success view -->
    <div id="successView" class="view" style="display:none">
      <div class="center-content">
        <div class="success-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="big-title">Clipped!</div>
        <div class="sub-text" id="successSub">Saved to Inbox</div>
        <button class="open-app-btn" id="openAppBtn">Open TravelPanel →</button>
        <div class="pending-pill" id="successPendingPill" style="display:none"></div>
      </div>
    </div>

    <!-- Sync success view -->
    <div id="syncSuccessView" class="view" style="display:none">
      <div class="center-content">
        <div class="sync-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="big-title">Synced!</div>
        <div class="sub-text" id="syncCountText">Clips added to TravelPanel</div>
        <div class="sub-text muted">This page will refresh</div>
      </div>
    </div>

    <!-- Not configured view -->
    <div id="configView" class="view" style="display:none">
      <div class="center-content">
        <div class="config-emoji">✈️</div>
        <div class="big-title">Welcome!</div>
        <div class="sub-text">Add your TravelPanel URL to start clipping travel inspiration</div>
        <button class="clip-btn" id="goSettingsBtn">Configure App URL</button>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
