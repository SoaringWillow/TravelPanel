<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      line-height: 1;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 5px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }

    .icon-btn:hover {
      background: #f3f4f6;
      color: #6b7280;
    }

    /* ── Content ─────────────────────────────────────────────────────────── */
    .content {
      padding: 14px 16px;
    }

    .platform-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 100px;
      color: white;
      margin-bottom: 9px;
      letter-spacing: 0.2px;
    }

    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 16px;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
    }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 11px 16px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-primary:active {
      background: #3730a3;
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary.loading {
      background: #6366f1;
      pointer-events: none;
    }

    /* ── Success state ───────────────────────────────────────────────────── */
    .success-state {
      padding: 22px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .success-icon {
      font-size: 44px;
      line-height: 1;
      animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }

    .success-sub {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }

    .success-meta {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    .meta-pill {
      background: #eef2ff;
      color: #4f46e5;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 100px;
    }

    /* ── Empty / error states ────────────────────────────────────────────── */
    .empty-state {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      color: #9ca3af;
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 2px;
    }

    .empty-title {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
    }

    .empty-sub {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fee2e2;
      color: #dc2626;
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 9px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    .footer {
      padding: 9px 16px 13px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      color: #d1d5db;
    }

    /* ── Setup notice ────────────────────────────────────────────────────── */
    .setup-notice {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 12px;
      color: #92400e;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .setup-notice a {
      color: #d97706;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ── Spinner ─────────────────────────────────────────────────────────── */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-mark">🗺</div>
      <span class="logo-text">TravelPanel</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="settingsBtn" title="Settings (configure TravelPanel URL)">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main content injected by popup.js -->
  <div id="main"></div>

  <!-- Footer -->
  <div class="footer">
    <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
    </svg>
    Saves locally to your device
  </div>

  <script src="popup.js"></script>
</body>
</html>
