<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      padding: 12px 14px;
      border-bottom: 1px solid #F3F4F6;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 26px;
      height: 26px;
      background: #4F46E5;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      letter-spacing: -0.01em;
    }

    .header-settings {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.12s, background 0.12s;
    }
    .header-settings:hover { color: #6B7280; background: #F9FAFB; }

    /* ── Content ── */
    .content {
      padding: 14px;
    }

    /* Platform chip */
    .platform-chip {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 99px;
      color: white;
      margin-bottom: 9px;
      letter-spacing: 0.02em;
    }

    /* Page info */
    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 11px;
      color: #9CA3AF;
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Clip button */
    .clip-btn {
      width: 100%;
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: -0.01em;
    }
    .clip-btn:hover:not(:disabled) { background: #4338CA; }
    .clip-btn:active:not(:disabled) { background: #3730A3; transform: scale(0.98); }
    .clip-btn:disabled {
      background: #E5E7EB;
      color: #9CA3AF;
      cursor: not-allowed;
    }
    .clip-btn .pin-icon {
      font-size: 15px;
      line-height: 1;
    }

    /* Success flash */
    .clip-btn.success {
      background: #10B981;
    }
    .clip-btn.success:hover { background: #10B981; }

    /* ── Setup card (shown when not configured) ── */
    .setup-card {
      background: #EEF2FF;
      border: 1.5px solid #C7D2FE;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .setup-card .setup-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .setup-card h3 {
      font-size: 13px;
      font-weight: 700;
      color: #3730A3;
      margin-bottom: 5px;
    }

    .setup-card p {
      font-size: 12px;
      color: #4F46E5;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .setup-btn {
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s;
    }
    .setup-btn:hover { background: #4338CA; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">✈</div>
    <span class="header-title">TravelPanel</span>
    <button class="header-settings" id="settings-btn" title="Extension settings">⚙</button>
  </div>

  <div class="content">

    <!-- Main view (shown when app URL is configured) -->
    <div id="main-view">
      <span class="platform-chip" id="platform-chip">Web</span>
      <div class="page-title" id="page-title">Loading…</div>
      <div class="page-url" id="page-url"></div>
      <button class="clip-btn" id="clip-btn">
        <span class="pin-icon">📌</span>
        <span id="clip-btn-label">Clip to TravelPanel</span>
      </button>
    </div>

    <!-- Setup view (shown when app URL not configured) -->
    <div id="setup-view" style="display:none">
      <div class="setup-card">
        <div class="setup-icon">🗺</div>
        <h3>Almost there!</h3>
        <p>Enter your TravelPanel app URL to start clipping travel inspiration in one tap.</p>
        <button class="setup-btn" id="open-setup-btn">Configure →</button>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
