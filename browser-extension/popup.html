<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">

    <header class="header">
      <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="5" fill="white" fill-opacity="0.15"/>
        <path d="M12 4C9.24 4 7 6.24 7 9C7 12.75 12 19 12 19C12 19 17 12.75 17 9C17 6.24 14.76 4 12 4Z" fill="white"/>
        <circle cx="12" cy="9" r="2.5" fill="#0D9488"/>
      </svg>
      <span class="title">TravelPanel</span>
      <button id="btn-options" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
      </button>
    </header>

    <!-- State: No app URL configured -->
    <div id="state-no-app" class="state hidden">
      <div class="empty-state">
        <div class="empty-icon">⚙️</div>
        <p>Set your TravelPanel URL to start clipping travel posts.</p>
        <button id="btn-go-settings" class="btn btn-primary btn-sm">Open Settings</button>
      </div>
    </div>

    <!-- State: Not a clippable page -->
    <div id="state-no-url" class="state hidden">
      <div class="empty-state">
        <div class="empty-icon">🌏</div>
        <p>Navigate to a travel post, blog, or social share to clip it.</p>
      </div>
    </div>

    <!-- State: Ready to save -->
    <div id="state-ready" class="state hidden">
      <div class="page-card">
        <div class="page-meta">
          <img id="page-favicon" class="favicon" src="" alt="" width="18" height="18">
          <div class="page-text">
            <span id="page-platform" class="platform-badge hidden"></span>
            <p id="page-title" class="page-title"></p>
            <p id="page-url" class="page-url"></p>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btn-save" class="btn btn-primary">
          <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15">
            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
          </svg>
          Save to TravelPanel
        </button>
        <button id="btn-quick-save" class="btn btn-ghost">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"/>
          </svg>
          Quick Save (skip preview)
        </button>
      </div>
    </div>

    <!-- State: Saved -->
    <div id="state-saved" class="state hidden">
      <div class="success-state">
        <svg class="success-ring" viewBox="0 0 52 52">
          <circle class="success-ring-bg" cx="26" cy="26" r="23" fill="none" stroke="#CCFBF1" stroke-width="3"/>
          <circle class="success-ring-fill" cx="26" cy="26" r="23" fill="none" stroke="#0D9488" stroke-width="3" stroke-dasharray="145" stroke-dashoffset="145"/>
          <polyline class="success-check" points="14,26 22,34 38,18" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
        </svg>
        <p class="success-text">Saved! Opening TravelPanel…</p>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
