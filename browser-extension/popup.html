<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      overflow: hidden;
    }

    /* ─── Header ─────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: #f1f5f9; background: rgba(255,255,255,0.08); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ─── URL section ────────────────────────────────────────────────────── */
    .url-section {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .page-info {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
      background: rgba(255,255,255,0.08);
      object-fit: contain;
    }

    .page-details {
      flex: 1;
      min-width: 0;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 11px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ─── Preview area (shown after clip) ───────────────────────────────── */
    .preview {
      display: none;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      animation: fadeIn 0.2s ease;
    }

    .preview.visible { display: block; }

    .preview-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: #a5b4fc;
    }

    .stat-pill.warning {
      background: rgba(245,158,11,0.1);
      border-color: rgba(245,158,11,0.25);
      color: #fcd34d;
    }

    .stat-pill.success {
      background: rgba(34,197,94,0.1);
      border-color: rgba(34,197,94,0.25);
      color: #86efac;
    }

    /* ─── Actions ────────────────────────────────────────────────────────── */
    .actions {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      width: 100%;
      padding: 9px 16px;
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #f1f5f9; }

    /* ─── Status / Loading ───────────────────────────────────────────────── */
    .status-area {
      display: none;
      padding: 10px 16px 14px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
    .status-area.visible { display: flex; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(99,102,241,0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    .status-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Error state ────────────────────────────────────────────────────── */
    .error-box {
      display: none;
      margin: 0 16px 14px;
      padding: 10px 12px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      font-size: 12px;
      color: #fca5a5;
      line-height: 1.5;
    }
    .error-box.visible { display: block; }

    /* ─── Not a travel URL hint ──────────────────────────────────────────── */
    .hint {
      display: none;
      padding: 12px 16px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .hint.visible { display: block; }
    .hint strong { color: #94a3b8; }

    /* ─── Animations ─────────────────────────────────────────────────────── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Success check animation ────────────────────────────────────────── */
    .checkmark-circle {
      width: 48px;
      height: 48px;
      background: rgba(34,197,94,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }
    .success-screen.visible { display: flex; }

    .success-title {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .success-sub {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- ─── Header ─────────────────────────────────────────────────────────── -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🗺</div>
      <span class="logo-text">TravelPanel</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="openAppBtn" title="Open TravelPanel">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ─── Main clip view ──────────────────────────────────────────────────── -->
  <div id="mainView">
    <!-- URL section -->
    <div class="url-section">
      <div class="page-info">
        <img class="favicon" id="favicon" src="" alt="">
        <div class="page-details">
          <div id="platformBadge" class="platform-badge"></div>
          <div id="pageTitle" class="page-title">Loading page info…</div>
          <div id="pageUrl" class="page-url"></div>
        </div>
      </div>
    </div>

    <!-- Loading / status -->
    <div class="status-area" id="statusArea">
      <div class="spinner" id="statusSpinner"></div>
      <span id="statusText"></span>
    </div>

    <!-- Error -->
    <div class="error-box" id="errorBox"></div>

    <!-- Preview stats (after extraction) -->
    <div class="preview" id="previewArea">
      <div class="preview-stats" id="previewStats"></div>
    </div>

    <!-- Hint for non-travel URLs -->
    <div class="hint" id="hint">
      <strong>Any URL works.</strong> TravelPanel can extract travel content from social posts,
      blog articles, YouTube videos, or any webpage.
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-primary" id="clipBtn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Clip to TravelPanel
      </button>
      <button class="btn-secondary" id="viewAllBtn" style="display:none">
        View all clips
      </button>
    </div>
  </div>

  <!-- ─── Success view ────────────────────────────────────────────────────── -->
  <div class="success-screen" id="successView">
    <div class="checkmark-circle">✓</div>
    <div class="success-title">Clipped!</div>
    <div class="success-sub" id="successSub">Opening TravelPanel…</div>
    <button class="btn-secondary" id="successViewBtn" style="margin-top:4px; width:100%">
      View in TravelPanel
    </button>
    <button class="btn-secondary" id="clipAnotherBtn" style="width:100%">
      Clip another
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
