<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d1117;
      --bg-card:      #161b22;
      --bg-hover:     #1c2128;
      --accent:       #6366f1;
      --accent-dim:   rgba(99,102,241,0.15);
      --accent-hover: #7c7ff5;
      --text:         #e6edf3;
      --text-2:       #8b949e;
      --text-3:       #484f58;
      --border:       #30363d;
      --success:      #3fb950;
      --danger:       #f85149;
      --r:            10px;
      --r-sm:         6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 360px;
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .logo-mark {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .icon-btn {
      color: var(--text-3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text-2); }

    /* ── Views ──────────────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Setup state ─────────────────────────────────────────────── */
    #view-setup { text-align: center; padding: 30px 20px 24px; }
    .setup-icon { font-size: 36px; margin-bottom: 12px; }
    .setup-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .setup-desc { font-size: 12px; color: var(--text-2); margin-bottom: 20px; line-height: 1.7; }

    /* ── Main state ──────────────────────────────────────────────── */
    #view-main { padding: 14px 15px; }

    /* Error banner */
    .error-banner {
      display: none;
      background: rgba(248,81,73,.1);
      border: 1px solid rgba(248,81,73,.3);
      border-radius: var(--r-sm);
      padding: 8px 10px;
      font-size: 11px;
      color: var(--danger);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    /* URL card */
    .url-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .page-title {
      font-weight: 600;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .page-host {
      font-size: 11px;
      color: var(--text-3);
    }

    /* Stats preview */
    .stats-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: var(--accent-dim);
      border: 1px solid rgba(99,102,241,.25);
      color: #a5b4fc;
    }

    /* Tags */
    .tags-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .tag {
      padding: 3px 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 11px;
      color: var(--text-3);
    }

    /* Extraction loading */
    .extract-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 11px;
      color: var(--text-2);
      margin-bottom: 10px;
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 16px;
      border-radius: var(--r);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .15s, transform .1s, opacity .15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--text-2);
      border: 1px solid var(--border);
      margin-top: 7px;
    }
    .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); }

    /* ── Success state ───────────────────────────────────────────── */
    #view-success { padding: 30px 20px 26px; text-align: center; }
    .success-icon { font-size: 40px; margin-bottom: 12px; }
    .success-title { font-size: 16px; font-weight: 700; color: var(--success); margin-bottom: 4px; }
    .success-desc { font-size: 12px; color: var(--text-2); margin-bottom: 20px; line-height: 1.6; }

    /* ── Spinner ─────────────────────────────────────────────────── */
    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    .spinner-sm {
      width: 11px;
      height: 11px;
      border: 1.5px solid rgba(99,102,241,.3);
      border-top-color: #a5b4fc;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Utils ───────────────────────────────────────────────────── */
    .hidden { display: none !important; }
    .mt-2 { margin-top: 8px; }
  </style>
</head>
<body>

  <!-- ── Header ────────────────────────────────────────────────── -->
  <div class="header">
    <div class="logo">
      <div class="logo-mark">✈️</div>
      TravelPanel
    </div>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- ── View: Setup (no URL configured) ───────────────────────── -->
  <div class="view" id="view-setup">
    <div class="setup-icon">🗺️</div>
    <div class="setup-title">Connect to TravelPanel</div>
    <div class="setup-desc">
      Enter your TravelPanel app URL to start clipping travel content from any webpage with one click.
    </div>
    <button class="btn btn-primary" id="openSettingsBtn">Open Settings</button>
  </div>

  <!-- ── View: Main (ready to clip) ────────────────────────────── -->
  <div class="view" id="view-main">
    <div class="error-banner" id="errorBanner"></div>

    <div class="url-card">
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-meta" id="pageMeta"></div>
    </div>

    <!-- Extraction progress (shown while calling /api/import) -->
    <div class="extract-bar hidden" id="extractBar">
      <div class="spinner-sm"></div>
      <span>Extracting travel wisdom…</span>
    </div>

    <!-- Stats after extraction -->
    <div class="stats-row hidden" id="statsRow"></div>

    <!-- Tags after extraction -->
    <div class="tags-row hidden" id="tagsRow"></div>

    <button class="btn btn-primary" id="clipBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      Clip this page
    </button>
    <button class="btn btn-ghost" id="openAppBtn">Open TravelPanel</button>
  </div>

  <!-- ── View: Success ─────────────────────────────────────────── -->
  <div class="view" id="view-success">
    <div class="success-icon">✅</div>
    <div class="success-title">Clipped!</div>
    <div class="success-desc" id="successDesc">
      The share page is opening — choose a board to save.
    </div>
    <button class="btn btn-ghost" id="openAppAgainBtn">Open TravelPanel</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
