<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111827;
      min-height: 200px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .header-title {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .header-sub {
      color: rgba(255,255,255,0.7);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .btn-settings {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 8px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn-settings:hover { background: rgba(255,255,255,0.25); }
    .btn-settings svg { width: 16px; height: 16px; stroke: #fff; fill: none; }

    /* ── Body ────────────────────────────────────────────────── */
    .body { padding: 14px 16px 16px; }

    /* State: not-configured */
    #state-not-configured {
      display: none;
      text-align: center;
      padding: 20px 8px;
    }
    #state-not-configured .config-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }
    #state-not-configured p {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    /* State: ready */
    #state-ready { display: none; }

    /* Page card */
    .page-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      min-height: 68px;
    }
    .page-favicon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #e5e7eb;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      overflow: hidden;
    }
    .page-favicon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }
    .page-meta { flex: 1; min-width: 0; }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Platform badge */
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .platform-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
    }

    /* Clip button */
    .btn-clip {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-clip:hover { opacity: 0.92; }
    .btn-clip:active { transform: scale(0.98); }
    .btn-clip svg { width: 16px; height: 16px; fill: none; stroke: #fff; }

    /* State: success */
    #state-success {
      display: none;
      text-align: center;
      padding: 24px 8px 16px;
    }
    .success-icon { font-size: 44px; margin-bottom: 10px; }
    .success-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }
    .success-sub {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }

    /* State: loading */
    #state-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid #e5e7eb;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      border-top: 1px solid #f3f4f6;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .footer-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: #9ca3af;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .footer-btn:hover { color: #4f46e5; }
    .footer-sep { color: #d1d5db; font-size: 10px; }

    /* Configure button (in not-configured state) */
    .btn-configure {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-configure:hover { opacity: 0.88; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-logo">📍</div>
      <div>
        <div class="header-title">TravelPanel</div>
        <div class="header-sub">Clipper</div>
      </div>
    </div>
    <button class="btn-settings" id="btn-settings" title="Settings">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Loading state -->
    <div id="state-loading">
      <div class="spinner"></div>
    </div>

    <!-- Not configured state -->
    <div id="state-not-configured">
      <div class="config-icon">⚙️</div>
      <p>Set your TravelPanel app URL to start clipping travel inspiration from any page.</p>
      <button class="btn-configure" id="btn-configure-main">Configure App URL →</button>
    </div>

    <!-- Ready state -->
    <div id="state-ready">
      <div class="page-card">
        <div class="page-favicon" id="favicon-wrap">
          <span id="favicon-fallback">🌐</span>
        </div>
        <div class="page-meta">
          <div class="page-title" id="page-title">Loading…</div>
          <div class="page-url" id="page-url"></div>
        </div>
      </div>

      <div id="platform-badge-wrap">
        <span class="platform-badge" id="platform-badge">
          <span class="dot"></span>
          <span id="platform-label">Web</span>
        </span>
      </div>

      <button class="btn-clip" id="btn-clip">
        <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        Clip to TravelPanel
      </button>
    </div>

    <!-- Success state -->
    <div id="state-success">
      <div class="success-icon">✅</div>
      <div class="success-title">Clipped!</div>
      <div class="success-sub">Opening TravelPanel to save to a board…</div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="footer-btn" id="btn-open-app">Open TravelPanel</button>
    <span class="footer-sep">·</span>
    <button class="footer-btn" id="btn-footer-settings">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
