<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.2px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      padding: 4px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #94a3b8; background: #1e293b; }

    /* ── Content ── */
    .content {
      padding: 14px 16px 16px;
    }

    .platform-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 100px;
      border: 1px solid transparent;
      letter-spacing: 0.3px;
    }

    .page-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 14px;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.4;
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 11px;
      color: #475569;
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Save button ── */
    .save-btn {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -0.1px;
    }
    .save-btn:hover:not(:disabled) { opacity: 0.9; }
    .save-btn:active:not(:disabled) { transform: scale(0.98); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Spinner ── */
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Success ── */
    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 24px 16px;
      text-align: center;
    }

    .success-ring {
      width: 52px;
      height: 52px;
      background: rgba(34, 197, 94, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #22c55e;
      animation: pop 0.3s ease-out;
    }
    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .success-title {
      font-weight: 700;
      font-size: 15px;
      color: #f1f5f9;
    }
    .success-sub {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }

    /* ── Non-web ── */
    .non-web-state {
      display: none;
      padding: 28px 20px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }
    .non-web-state .emoji {
      font-size: 28px;
      margin-bottom: 10px;
      display: block;
    }

    /* ── Keyboard hint ── */
    .kbd-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 10px;
      color: #334155;
      font-size: 11px;
    }
    kbd {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 10px;
      color: #475569;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">✈</div>
      TravelPanel
    </div>
    <button class="settings-btn" id="optionsBtn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Main clip UI -->
  <div id="mainContent" class="content">
    <div class="platform-row">
      <span id="platformBadge" class="platform-badge" style="background: rgba(59,130,246,0.1); color: #60a5fa; border-color: rgba(59,130,246,0.25);">
        🌐 Web page
      </span>
    </div>

    <div class="page-card">
      <div id="pageTitle" class="page-title">Loading…</div>
      <div id="pageUrl" class="page-url"></div>
    </div>

    <button id="saveBtn" class="save-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      Save to TravelPanel
    </button>

    <div class="kbd-hint">
      <span>Quick clip:</span>
      <kbd id="kbdMac" style="display:none">⌘⇧T</kbd>
      <kbd id="kbdOther" style="display:none">Alt+Shift+T</kbd>
    </div>
  </div>

  <!-- Success state -->
  <div id="successState" class="success-state">
    <div class="success-ring">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="success-title">Opening TravelPanel</div>
    <div class="success-sub">Pick a board to save your clip.<br>The AI will extract the locations and wisdom.</div>
  </div>

  <!-- Non-web state -->
  <div id="nonWebState" class="non-web-state">
    <span class="emoji">🗺️</span>
    Navigate to a travel post or web page,<br>then click the TravelPanel icon to clip it.
  </div>

  <script src="popup.js"></script>
</body>
</html>
