<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #111827;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #4338CA 0%, #6366F1 100%);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .header-title {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .header-sub {
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      margin-top: 1px;
    }
    .settings-btn {
      margin-left: auto;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.15);
    }

    /* ── Page preview ── */
    .preview {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #F3F4F6;
    }
    .platform-chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 6px;
      color: #fff;
    }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 11px;
      color: #9CA3AF;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Not-configured state ── */
    #not-configured {
      padding: 20px 16px;
      text-align: center;
    }
    #not-configured p {
      font-size: 13px;
      color: #6B7280;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .setup-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #4F46E5;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .setup-btn:hover { background: #4338CA; }
    .setup-btn:active { transform: scale(0.97); }

    /* ── Save CTA ── */
    .save-section {
      padding: 14px 16px;
    }
    .save-btn {
      width: 100%;
      background: #4F46E5;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .save-btn:hover { background: #4338CA; }
    .save-btn:active { transform: scale(0.98); }
    .save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Open full app link ── */
    .footer {
      padding: 0 16px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .open-app-link {
      font-size: 11px;
      color: #9CA3AF;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }
    .open-app-link:hover {
      color: #4F46E5;
      background: #EEF2FF;
    }

    /* ── Success state ── */
    #success-state {
      display: none;
      padding: 24px 16px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .success-icon {
      font-size: 40px;
      margin-bottom: 4px;
    }
    .success-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }
    .success-sub {
      font-size: 12px;
      color: #6B7280;
    }
    .success-view-btn {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #EEF2FF;
      color: #4F46E5;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .success-view-btn:hover { background: #E0E7FF; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">📍</div>
    <div>
      <div class="header-title">TravelPanel</div>
      <div class="header-sub">Save travel inspiration</div>
    </div>
    <button class="settings-btn" id="settings-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Not configured -->
  <div id="not-configured" style="display: none;">
    <p>Set your TravelPanel URL to start saving travel inspiration from any website.</p>
    <button class="setup-btn" id="setup-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Set up TravelPanel URL
    </button>
  </div>

  <!-- Main save UI -->
  <div id="main-ui">
    <!-- Page preview -->
    <div class="preview">
      <span id="platform-chip" class="platform-chip" style="background: #6B7280;">Web</span>
      <div id="page-title" class="page-title">Loading page…</div>
      <div id="page-url" class="page-url"></div>
    </div>

    <!-- Save button -->
    <div class="save-section">
      <button class="save-btn" id="save-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save to TravelPanel
      </button>
    </div>

    <!-- Footer: open app -->
    <div class="footer">
      <a id="open-app-link" href="#" class="open-app-link" target="_blank">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Open TravelPanel app
      </a>
    </div>
  </div>

  <!-- Success state -->
  <div id="success-state">
    <div class="success-icon">✅</div>
    <div class="success-title">Saved to TravelPanel!</div>
    <div class="success-sub" id="success-sub">Opening the save dialog…</div>
    <a id="success-view-link" href="#" class="success-view-btn" target="_blank">
      View your boards →
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
