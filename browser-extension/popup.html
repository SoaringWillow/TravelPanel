<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="6" fill="#0EA5E9"/>
          <path d="M12 4.5C9.52 4.5 7.5 6.52 7.5 9c0 3.75 4.5 10.5 4.5 10.5S16.5 12.75 16.5 9c0-2.48-2.02-4.5-4.5-4.5zm0 6.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="white"/>
        </svg>
        <span class="logo-text">TravelPanel</span>
      </div>
      <a href="#" id="options-link" class="options-icon" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </a>
    </header>

    <!-- Page preview card -->
    <div class="card" id="page-card">
      <div class="card-thumbnail" id="thumbnail-wrap">
        <div class="thumbnail-placeholder" id="thumbnail-placeholder">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
        </div>
        <img id="thumbnail" class="thumbnail-img hidden" alt="" />
      </div>
      <div class="card-body">
        <p class="card-title" id="page-title">Loading…</p>
        <p class="card-url" id="page-url"></p>
      </div>
    </div>

    <!-- Status / error -->
    <p class="status-msg" id="status-msg"></p>

    <!-- Clip button -->
    <button class="clip-btn" id="clip-btn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      </svg>
      Clip to TravelPanel
    </button>

    <!-- Footer -->
    <footer class="footer">
      <span id="panel-url-display"></span>
      <a href="#" id="change-url">change</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
