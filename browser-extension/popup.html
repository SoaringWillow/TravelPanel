<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: #ffffff;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 26px;
      height: 26px;
      background: #6366f1;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }
    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.3px;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
    }
    .settings-btn:hover { color: #6366f1; background: #eef2ff; }

    /* ── Page preview ── */
    .preview {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
    }
    .platform-badge {
      display: none;
      font-size: 11px;
      font-weight: 600;
      color: white;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 7px;
      width: fit-content;
    }
    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Actions ── */
    .actions {
      padding: 12px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .clip-btn {
      width: 100%;
      padding: 11px 16px;
      background: #6366f1;
      color: white;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .clip-btn:hover { background: #4f46e5; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled {
      background: #c7d2fe;
      cursor: not-allowed;
      transform: none;
    }
    .clip-btn svg { flex-shrink: 0; }

    .secondary-row {
      display: flex;
      gap: 6px;
    }
    .open-app-btn {
      flex: 1;
      padding: 8px 12px;
      background: none;
      color: #6b7280;
      font-size: 13px;
      font-weight: 500;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      text-align: center;
    }
    .open-app-btn:hover { border-color: #6366f1; color: #6366f1; }

    /* ── Status ── */
    .status {
      display: none;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      background: #f0fdf4;
      color: #15803d;
      border-top: 1px solid #bbf7d0;
    }
    .status.error { background: #fef2f2; color: #b91c1c; border-top-color: #fecaca; }
    .status.visible { display: flex; }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px 10px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-hint {
      font-size: 11px;
      color: #d1d5db;
    }
    .footer-app-url {
      font-size: 11px;
      color: #c7d2fe;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">📍</div>
      <span class="logo-text">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settings-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Page preview -->
  <div class="preview">
    <div class="platform-badge" id="platform-badge"></div>
    <div class="page-title" id="page-title">Loading…</div>
    <div class="page-url" id="page-url"></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="clip-btn" id="clip-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      Clip to TravelPanel
    </button>
    <div class="secondary-row">
      <button class="open-app-btn" id="open-app-btn">Open app</button>
    </div>
  </div>

  <!-- Status message -->
  <div class="status" id="status"></div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-hint">Saves to Inbox by default</span>
    <span class="footer-app-url" id="footer-app-url"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
