<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .app-name {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.7);
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #fff; background: rgba(255,255,255,0.15); }

    /* ── Body ────────────────────────────────────────────────── */
    .body { padding: 16px; }

    /* ── Setup prompt (shown when app URL not configured) ────── */
    .setup-prompt {
      background: #FFF7ED;
      border: 1px solid #FED7AA;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .setup-prompt p {
      font-size: 13px;
      color: #92400E;
      line-height: 1.5;
    }
    .setup-prompt strong { font-weight: 600; }

    /* ── Page card ───────────────────────────────────────────── */
    .page-card {
      background: #F9FAFB;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .platform-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 11px;
      color: #9CA3AF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Primary button ──────────────────────────────────────── */
    .clip-btn {
      width: 100%;
      padding: 12px;
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, transform 0.1s;
    }
    .clip-btn:hover { background: #4338CA; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    /* ── Success state ───────────────────────────────────────── */
    .success {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 10px;
      text-align: center;
    }
    .success-icon { font-size: 40px; }
    .success-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }
    .success-sub {
      font-size: 12px;
      color: #6B7280;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">✈️</div>
      <span class="app-name">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settings-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Main body -->
  <div class="body" id="main-body">

    <!-- Setup prompt (hidden by default) -->
    <div class="setup-prompt" id="setup-prompt" style="display:none">
      <p><strong>Set your TravelPanel URL</strong><br>
      Click the ⚙️ settings icon above to enter your app's URL (e.g. <code>https://your-app.vercel.app</code>).</p>
    </div>

    <!-- Page card -->
    <div class="page-card" id="page-card">
      <span class="platform-badge" id="platform-badge" style="background:#6B7280">Web</span>
      <div class="page-title" id="page-title">Loading…</div>
      <div class="page-url" id="page-url"></div>
    </div>

    <!-- Clip button -->
    <button class="clip-btn" id="clip-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      Save to TravelPanel
    </button>

  </div>

  <script src="popup.js"></script>
</body>
</html>
