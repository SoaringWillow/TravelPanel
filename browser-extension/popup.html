<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🗺</div>
      <span class="logo-text">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Not configured -->
  <div id="notConfigured" style="display:none">
    <div class="config-notice">
      <p>Set your TravelPanel URL to start clipping travel inspiration from any webpage.</p>
      <button class="config-link" id="openOptionsBtn">⚙️ Configure TravelPanel URL →</button>
    </div>
  </div>

  <!-- Main view -->
  <div id="mainView" style="display:none">
    <!-- Page info card -->
    <div class="page-card">
      <div class="platform-chip" id="platformChip">Web</div>
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-url" id="pageUrl"></div>
    </div>

    <!-- Error notice (hidden by default) -->
    <div class="error-notice" id="errorNotice" style="display:none"></div>

    <!-- Clip button -->
    <div class="clip-section">
      <button class="clip-btn" id="clipBtn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        Clip to TravelPanel
      </button>
    </div>
  </div>

  <!-- Success state -->
  <div id="successState" style="display:none">
    <div class="success-state">
      <div class="success-icon">✅</div>
      <div class="success-title">Clipped!</div>
      <div class="success-sub" id="successSub">Saved and ready for AI extraction.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
