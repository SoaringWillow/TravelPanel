<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #ffffff;
      color: #111827;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      text-decoration: none;
    }
    .logo svg { flex-shrink: 0; }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      font-size: 15px;
    }
    .settings-btn:hover { background: #f5f3ff; color: #6366f1; }

    /* ── Warning banner ── */
    .warning {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      padding: 9px 11px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.4;
    }
    .warning a {
      color: #6366f1;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font: inherit;
      padding: 0;
    }

    /* ── Page card ── */
    .page-card {
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px 13px;
      margin-bottom: 12px;
      min-height: 72px;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 7px;
      letter-spacing: 0.01em;
    }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Clip button ── */
    .clip-btn {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 1px 3px rgba(99,102,241,0.25);
      font-family: inherit;
    }
    .clip-btn:hover:not(:disabled) {
      background: #4f46e5;
      box-shadow: 0 3px 8px rgba(99,102,241,0.35);
      transform: translateY(-1px);
    }
    .clip-btn:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .clip-btn:disabled { background: #a5b4fc; cursor: not-allowed; box-shadow: none; transform: none; }

    /* ── Success state ── */
    .success-state {
      display: none;
      text-align: center;
      padding: 18px 0 12px;
    }
    .success-icon { font-size: 42px; line-height: 1; margin-bottom: 10px; }
    .success-title { font-size: 16px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .success-sub { font-size: 12px; color: #6b7280; }

    /* ── Cannot-clip state ── */
    .no-clip-state {
      display: none;
      text-align: center;
      padding: 20px 0 12px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }
    .no-clip-icon { font-size: 32px; margin-bottom: 10px; }

    /* ── Footer ── */
    .footer {
      margin-top: 11px;
      text-align: center;
      font-size: 10px;
      color: #d1d5db;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="128" height="128" rx="28" fill="#6366f1"/>
        <path d="M64 22C50.2 22 39 33.2 39 47c0 20.3 25 59 25 59s25-38.7 25-59c0-13.8-11.2-25-25-25z" fill="white"/>
        <circle cx="64" cy="46" r="10.5" fill="#6366f1"/>
      </svg>
      TravelPanel
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Not-configured warning -->
  <div class="warning" id="notConfigured" style="display:none">
    Set your TravelPanel URL in
    <button class="warning a" id="configureLink">settings</button>
    first.
  </div>

  <!-- Cannot-clip state (e.g. chrome:// page) -->
  <div class="no-clip-state" id="noClipState">
    <div class="no-clip-icon">🚫</div>
    <div>Can't clip this page.<br>Navigate to a travel post first.</div>
  </div>

  <!-- Page info card -->
  <div class="page-card" id="pageCard">
    <div class="platform-badge" id="platformBadge">Loading…</div>
    <div class="page-title" id="pageTitle">Loading…</div>
    <div class="page-url" id="pageUrl">…</div>
  </div>

  <!-- Success state -->
  <div class="success-state" id="successState">
    <div class="success-icon">✅</div>
    <div class="success-title">Opening TravelPanel…</div>
    <div class="success-sub" id="successSub">Pick a board in the tab that just opened.</div>
  </div>

  <!-- Clip button -->
  <button class="clip-btn" id="clipBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </svg>
    Clip to TravelPanel
  </button>

  <div class="footer">TravelPanel Clipper v1.0</div>

  <script src="popup.js"></script>
</body>
</html>
