<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header>
      <div class="logo">
        <img src="icons/icon48.png" width="20" height="20" alt="" class="logo-img">
        <span class="logo-text">TravelPanel</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="open-tp-btn" title="Open TravelPanel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </button>
        <button class="icon-btn" id="settings-btn" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main content (hidden on success/error) -->
    <div id="main-content">
      <!-- Page info -->
      <div class="page-info" id="page-info">
        <div class="page-favicon" id="page-favicon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <div class="page-meta">
          <div class="page-title" id="page-title">Loading…</div>
          <div class="page-url" id="page-url"></div>
        </div>
      </div>

      <!-- Board picker -->
      <div class="section">
        <div class="section-label">Save to</div>
        <div class="board-scroll" id="board-scroll">
          <div class="board-row" id="board-row">
            <button class="board-chip active" data-board="inbox">
              <span class="chip-icon">📥</span>
              <span class="chip-name">Inbox</span>
            </button>
          </div>
        </div>
        <div class="loading-row" id="loading-row">
          <span class="spinner"></span>
          <span>Connecting to TravelPanel…</span>
        </div>
        <div class="no-tp-hint hidden" id="no-tp-hint">
          <a href="#" id="open-tp-link">Open TravelPanel</a> in a tab to load your boards.
        </div>
      </div>

      <!-- Notes -->
      <div class="section">
        <textarea class="notes-input" id="notes-input" placeholder="Add a note… (optional)" rows="2"></textarea>
      </div>

      <!-- CTA -->
      <button class="clip-btn" id="clip-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save Clip
      </button>

      <!-- Inline error -->
      <div class="error-row hidden" id="error-row"></div>
    </div>

    <!-- Success state -->
    <div class="success-state hidden" id="success-state">
      <div class="check-ring">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="success-title">Saved!</div>
      <div class="success-sub" id="success-sub">Opening TravelPanel…</div>
    </div>

    <!-- Not-configured state -->
    <div class="nc-state hidden" id="nc-state">
      <div class="nc-icon">⚙️</div>
      <div class="nc-msg" id="nc-msg">Configure your TravelPanel URL to get started.</div>
      <button class="nc-btn" id="nc-btn">Open Settings</button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
