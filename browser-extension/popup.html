<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="10" fill="#6366f1"/>
        <circle cx="10" cy="7.5" r="3.2" fill="#fff"/>
        <path d="M7.2 9.3 L10 16 L12.8 9.3 Z" fill="#fff"/>
        <circle cx="10" cy="7.5" r="1.3" fill="#6366f1"/>
      </svg>
      <span class="logo-text">TravelPanel</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Open settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- ── Main view (shown when configured) ──────────────────────────── -->
  <main id="mainView">

    <!-- Page card -->
    <div class="page-card" id="pageCard">
      <img class="favicon" id="favicon" src="" alt="" width="20" height="20" />
      <div class="page-info">
        <div class="page-title" id="pageTitle">Loading…</div>
        <div class="page-url"  id="pageUrl"></div>
      </div>
    </div>

    <!-- Platform chip -->
    <div class="chip-row">
      <span class="chip" id="platformChip">Web</span>
    </div>

    <!-- Primary action -->
    <button class="clip-btn" id="clipBtn">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex-shrink:0">
        <circle cx="10" cy="10" r="10" fill="rgba(255,255,255,0.2)"/>
        <circle cx="10" cy="7.5" r="3.2" fill="#fff"/>
        <path d="M7.2 9.3 L10 16 L12.8 9.3 Z" fill="#fff"/>
        <circle cx="10" cy="7.5" r="1.3" fill="#6366f1"/>
      </svg>
      Clip this page
    </button>

    <!-- Open app link -->
    <button class="secondary-btn" id="openAppBtn">Open TravelPanel →</button>

  </main>

  <!-- ── Setup view (shown when not configured) ─────────────────────── -->
  <div id="setupView" class="setup-view" hidden>
    <div class="setup-icon">🗺️</div>
    <p class="setup-heading">Welcome to TravelPanel Clipper</p>
    <p class="setup-body">Set your TravelPanel URL to start clipping travel inspiration from any page.</p>
    <button class="clip-btn" id="goSetupBtn">Configure now →</button>
  </div>

  <!-- ── Success overlay ────────────────────────────────────────────── -->
  <div id="successOverlay" class="success-overlay" hidden>
    <div class="success-icon-wrap">✅</div>
    <p class="success-heading">Opening TravelPanel…</p>
    <p class="success-body">Choose a board to save this page.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
