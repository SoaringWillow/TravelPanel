<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Setup screen (shown when app URL not configured) -->
  <div id="setup-screen" class="screen hidden">
    <div class="header">
      <div class="logo">
        <span class="logo-icon">✈</span>
        <span class="logo-text">TravelPanel</span>
      </div>
    </div>
    <div class="setup-content">
      <h2 class="setup-title">Welcome to TravelPanel Clipper</h2>
      <p class="setup-desc">Enter your TravelPanel app URL to get started.</p>
      <div class="input-group">
        <label for="setup-url">App URL</label>
        <input
          id="setup-url"
          type="url"
          placeholder="https://your-app.vercel.app"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button id="setup-save-btn" class="btn btn-primary" disabled>
        Save &amp; Start Clipping
      </button>
      <p class="setup-hint">
        This is the URL where TravelPanel is deployed (Vercel, Railway, etc.).<br />
        For local development: <code>http://localhost:3000</code>
      </p>
    </div>
  </div>

  <!-- Main clip screen -->
  <div id="clip-screen" class="screen hidden">
    <div class="header">
      <div class="logo">
        <span class="logo-icon">✈</span>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
      </button>
    </div>

    <!-- Page preview card -->
    <div class="page-card">
      <img id="favicon" class="favicon" src="" alt="" width="20" height="20" />
      <div class="page-info">
        <p id="page-title" class="page-title">Loading…</p>
        <p id="page-domain" class="page-domain"></p>
      </div>
    </div>

    <!-- Status messages -->
    <div id="status-area" class="status-area hidden">
      <div id="status-message" class="status-message"></div>
    </div>

    <!-- Clip button -->
    <button id="clip-btn" class="btn btn-primary clip-btn">
      <span id="clip-btn-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </span>
      <span id="clip-btn-text">Clip This Page</span>
    </button>

    <!-- Footer -->
    <div class="footer">
      <button id="open-app-btn" class="link-btn">
        Open TravelPanel →
      </button>
    </div>
  </div>

  <!-- Error screen -->
  <div id="error-screen" class="screen hidden">
    <div class="header">
      <div class="logo">
        <span class="logo-icon">✈</span>
        <span class="logo-text">TravelPanel</span>
      </div>
    </div>
    <div class="error-content">
      <span class="error-icon">⚠️</span>
      <p id="error-message" class="error-message">Something went wrong.</p>
      <button id="error-retry-btn" class="btn btn-secondary">Retry</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
