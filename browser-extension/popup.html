<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111827;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f3f4f6;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .logo-name {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      color: #9ca3af;
      line-height: 1;
      font-size: 16px;
      transition: color 0.15s, background 0.15s;
    }

    .settings-btn:hover {
      color: #6b7280;
      background: #f9fafb;
    }

    /* ── Main content ── */
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Platform chip + URL */
    .url-section {}

    .platform-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Save button ── */
    .save-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .save-btn:hover { opacity: 0.92; }
    .save-btn:active { transform: scale(0.98); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Not configured state ── */
    .not-configured {
      padding: 20px 16px;
      text-align: center;
    }

    .not-configured p {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .config-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: #4f46e5;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .config-btn:hover { opacity: 0.88; }

    /* ── Success state ── */
    .success-state {
      display: none;
      padding: 20px 16px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .success-state.visible { display: flex; }

    .success-icon {
      font-size: 40px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .success-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }

    .success-subtitle {
      font-size: 12px;
      color: #6b7280;
    }

    /* ── Footer hint ── */
    .footer {
      padding: 0 16px 14px;
      text-align: center;
    }

    .footer-hint {
      font-size: 11px;
      color: #d1d5db;
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <div class="header">
    <div class="logo">
      <div class="logo-mark">✈️</div>
      <span class="logo-name">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
  </div>

  <!-- ── Not configured state ── -->
  <div id="notConfigured" style="display:none" class="not-configured">
    <p>Enter your TravelPanel URL to start clipping travel inspiration.</p>
    <button class="config-btn" id="openOptionsBtn">
      ⚙ Configure
    </button>
  </div>

  <!-- ── Main clip UI ── -->
  <div id="mainContent">
    <div class="content">
      <div class="url-section">
        <span class="platform-chip" id="platformChip">Web</span>
        <div class="page-title" id="pageTitle">Loading…</div>
        <div class="page-url" id="pageUrl"></div>
      </div>

      <button class="save-btn" id="saveBtn">
        <span>✈</span>
        <span>Save to TravelPanel</span>
      </button>
    </div>

    <div class="footer">
      <span class="footer-hint">Opens the save sheet in a new tab</span>
    </div>
  </div>

  <!-- ── Success state ── -->
  <div class="success-state" id="successState">
    <div class="success-icon">✅</div>
    <div class="success-title">Opening TravelPanel…</div>
    <div class="success-subtitle">The save sheet is loading in a new tab.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
