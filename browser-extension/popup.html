<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid #1e1e1e;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f0f0f0;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 11px;
      color: #666;
    }

    .content {
      padding: 14px 16px;
    }

    .page-info {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 13px;
      font-weight: 500;
      color: #e0e0e0;
      line-height: 1.4;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-url {
      font-size: 11px;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 100px;
      margin-top: 8px;
      font-weight: 500;
    }

    .platform-badge.xhs    { background: #ff244222; color: #ff6680; }
    .platform-badge.yt     { background: #ff000022; color: #ff5555; }
    .platform-badge.ig     { background: #e1306c22; color: #e1306c; }
    .platform-badge.other  { background: #3b82f622; color: #60a5fa; }

    .btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
    }

    .status.success {
      display: block;
      background: #16a34a22;
      border: 1px solid #16a34a44;
      color: #4ade80;
    }

    .status.error {
      display: block;
      background: #dc262622;
      border: 1px solid #dc262644;
      color: #f87171;
    }

    .result-locations {
      margin-top: 10px;
      display: none;
    }

    .result-locations h3 {
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .location-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      color: #aaa;
      margin: 2px;
    }

    .open-link {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #3b82f6;
      text-decoration: none;
      margin-top: 10px;
      padding: 4px;
    }

    .open-link:hover { text-decoration: underline; }

    .footer {
      padding: 8px 16px 12px;
      display: flex;
      justify-content: flex-end;
    }

    .settings-link {
      font-size: 11px;
      color: #444;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .settings-link:hover { color: #666; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✈</div>
    <div class="header-text">
      <h1>TravelPanel Clipper</h1>
      <p>Save travel content instantly</p>
    </div>
  </div>

  <div class="content">
    <div class="page-info">
      <div class="page-title" id="pageTitle">Loading page info…</div>
      <div class="page-url" id="pageUrl">—</div>
      <span class="platform-badge other" id="platformBadge">🌐 Web</span>
    </div>

    <button class="btn btn-primary" id="clipBtn">
      <span id="btnIcon">📌</span>
      <span id="btnText">Clip to TravelPanel</span>
    </button>

    <div class="status" id="statusMsg"></div>

    <div class="result-locations" id="resultLocations">
      <h3>Locations found</h3>
      <div id="locationChips"></div>
      <a href="#" class="open-link" id="openAppLink">Open in TravelPanel →</a>
    </div>
  </div>

  <div class="footer">
    <a href="#" class="settings-link" id="settingsLink">⚙ Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
