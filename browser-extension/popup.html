<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>TravelPanel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#0ea5e9"/>
        </svg>
        <span>TravelPanel</span>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Main view -->
    <div id="mainView">

      <!-- Page preview -->
      <div class="page-preview">
        <div class="favicon-wrap" id="faviconWrap">
          <span class="favicon-fallback">🌐</span>
        </div>
        <div class="page-info">
          <div class="page-title" id="pageTitle">Loading…</div>
          <div class="page-domain" id="pageDomain"></div>
        </div>
      </div>

      <!-- Platform badge (shown when detected) -->
      <div class="platform-row" id="platformRow" style="display:none">
        <span class="platform-badge" id="platformBadge"></span>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="btn btn-primary" id="clipInboxBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="clipBtnLabel">Clip to Inbox</span>
        </button>
        <button class="btn btn-secondary" id="chooseBoardBtn">
          Choose board ↗
        </button>
      </div>

      <div class="error-msg" id="errorMsg" style="display:none"></div>
    </div>

    <!-- Success view -->
    <div id="successView" class="success-view" style="display:none">
      <div class="success-check">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div class="success-title">Clipped!</div>
      <div class="success-subtitle" id="successSubtitle">Saved to Inbox</div>
      <div class="success-hint">Extracting locations &amp; tips in the background…</div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <a href="#" id="openAppLink">Open TravelPanel ↗</a>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
