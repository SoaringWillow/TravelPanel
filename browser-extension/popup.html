<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <div class="header-pin">📍</div>
      TravelPanel
    </div>
    <button class="header-settings" id="btn-settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Setup prompt: shown when TravelPanel URL not configured -->
  <div class="setup-prompt" id="setup-prompt" style="display:none">
    <h3>Connect TravelPanel</h3>
    <p>Enter your TravelPanel URL to start clipping travel inspiration from anywhere.</p>
    <button class="btn-setup" id="btn-open-options">Configure TravelPanel URL →</button>
  </div>

  <!-- Main clip UI: shown when URL is configured -->
  <div id="clip-ui" style="display:none">

    <!-- Page preview -->
    <div class="page-preview">
      <div class="preview-thumb" id="preview-thumb">🌍</div>
      <div class="preview-meta">
        <div class="preview-title" id="preview-title">Loading page…</div>
        <div class="preview-domain">
          <span class="dot">●</span>
          <span id="preview-domain">—</span>
        </div>
        <div id="platform-badge-wrapper"></div>
      </div>
    </div>

    <!-- Clip form -->
    <div class="clip-form">
      <div class="form-row">
        <label class="form-label" for="board-select">Save to board</label>
        <select class="form-select" id="board-select">
          <option value="">📥 Inbox</option>
        </select>
      </div>

      <button class="btn-clip" id="btn-clip">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        Clip This Page
      </button>

      <div class="error-msg" id="error-msg"></div>
    </div>

  </div>

  <!-- Success state -->
  <div class="success-state" id="success-state">
    <div class="success-icon">✓</div>
    <div class="success-title">Clipped!</div>
    <div class="success-sub" id="success-sub">Saved to your TravelPanel</div>
    <a href="#" class="success-link" id="success-link">Open TravelPanel →</a>
  </div>

  <!-- Footer -->
  <div class="footer" id="footer" style="display:none">
    <span class="footer-tip">Tip: use the shortcut</span>
    <span class="footer-shortcut">Alt+Shift+S</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
