<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/>
        </svg>
        <span class="brand-name">TravelPanel</span>
      </div>
      <button class="settings-btn" id="settings-toggle" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <!-- Main view -->
    <main class="main" id="main-view">
      <!-- Page info card -->
      <div class="page-card">
        <div class="page-meta">
          <span class="platform-badge" id="platform-badge">Web</span>
        </div>
        <div class="page-title" id="page-title">Loading page info…</div>
        <div class="page-url" id="page-url"></div>
      </div>

      <!-- Primary action -->
      <button class="clip-btn" id="clip-btn">
        <svg class="clip-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor" opacity="0.9"/>
          <circle cx="12" cy="9" r="2.5" fill="white"/>
        </svg>
        Clip to TravelPanel
      </button>

      <!-- Unsupported URL state -->
      <div class="unsupported" id="unsupported" hidden>
        <span class="unsupported-icon">🚫</span>
        <p>This page can't be clipped.</p>
        <small>Navigate to a travel post or webpage first.</small>
      </div>
    </main>

    <!-- Success view -->
    <div class="success-view" id="success-view" hidden>
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#10b981"/>
          <path d="M8 12l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="success-title">Clip saved!</p>
      <p class="success-sub">Opening TravelPanel…</p>
    </div>

    <!-- Settings panel -->
    <div class="settings-panel" id="settings-panel" hidden>
      <h3 class="settings-title">Settings</h3>
      <label class="settings-label" for="app-url-input">TravelPanel URL</label>
      <input
        class="settings-input"
        id="app-url-input"
        type="url"
        placeholder="https://your-app.vercel.app"
        autocomplete="off"
        spellcheck="false"
      >
      <p class="settings-hint">Enter the URL where your TravelPanel app is deployed.</p>
      <button class="settings-save-btn" id="settings-save-btn">Save</button>
      <p class="settings-saved-msg" id="settings-saved-msg" hidden>✓ Saved</p>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
