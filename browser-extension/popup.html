<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #111827;
    }

    /* ── Header ── */
    .header {
      padding: 12px 14px;
      background: #6366f1;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-icon { flex-shrink: 0; }
    .header-title { font-size: 14px; font-weight: 600; flex: 1; letter-spacing: -0.01em; }
    .header-settings {
      background: none;
      border: none;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      border-radius: 4px;
      transition: color 0.12s;
    }
    .header-settings:hover { color: white; }

    /* ── Content area ── */
    .content { padding: 14px 16px 16px; }

    /* ── Page info card ── */
    .page-info {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .page-title {
      font-size: 13px;
      font-weight: 500;
      color: #111827;
      margin-bottom: 3px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url { font-size: 11px; color: #9ca3af; word-break: break-all; }

    /* ── Setup state ── */
    .setup-prompt { text-align: center; padding: 20px 8px 8px; }
    .setup-prompt h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .setup-prompt p { font-size: 12px; color: #6b7280; margin-bottom: 16px; line-height: 1.5; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s, opacity 0.12s;
      letter-spacing: -0.01em;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover:not(:disabled) { background: #4f46e5; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }

    /* ── Loading state ── */
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #6b7280;
      padding: 2px 0;
    }
    .spinner {
      width: 13px; height: 13px;
      border: 2px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Success state ── */
    .success { text-align: center; padding: 8px 0 4px; }
    .success-icon { font-size: 38px; margin-bottom: 8px; line-height: 1; }
    .success-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .success-sub { font-size: 12px; color: #6b7280; margin-bottom: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="header">
    <svg class="header-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5" fill="white" stroke="none"/>
    </svg>
    <span class="header-title">TravelPanel</span>
    <button class="header-settings" id="settingsBtn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65
          1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0
          0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65
          0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6
          9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0
          9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65
          1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9
          a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="content">

    <!-- Setup state -->
    <div id="setupState" style="display:none">
      <div class="setup-prompt">
        <h3>Connect TravelPanel</h3>
        <p>Enter your TravelPanel URL in settings to start clipping travel inspiration from any page.</p>
        <button class="btn btn-primary" id="goSetupBtn">Open Settings</button>
      </div>
    </div>

    <!-- Ready state -->
    <div id="readyState" style="display:none">
      <div class="page-info">
        <div class="page-title" id="pageTitle">Loading…</div>
        <div class="page-url" id="pageUrl"></div>
      </div>
      <button class="btn btn-primary" id="clipBtn">📌&nbsp; Clip to TravelPanel</button>
    </div>

    <!-- Loading state -->
    <div id="loadingState" style="display:none">
      <div class="page-info">
        <div class="page-title" id="loadingTitle"></div>
        <div class="page-url" id="loadingUrl"></div>
      </div>
      <div class="loading">
        <div class="spinner"></div>
        <span>Opening TravelPanel…</span>
      </div>
    </div>

    <!-- Success state -->
    <div id="successState" style="display:none">
      <div class="success">
        <div class="success-icon">✈️</div>
        <div class="success-title">Clipped!</div>
        <div class="success-sub" id="successSub">Opening in TravelPanel…</div>
        <button class="btn btn-secondary" id="clipAnotherBtn">Clip another page</button>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
