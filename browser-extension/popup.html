<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- ── Header ──────────────────────────────────── -->
    <div class="header">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#6366f1" opacity="0.15"/>
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#6366f1"/>
        </svg>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>

    <!-- ── Setup state ─────────────────────────────── -->
    <div id="setupState" class="state" hidden>
      <div class="setup-body">
        <div class="setup-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" width="36" height="36">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#6366f1"/>
          </svg>
        </div>
        <h2 class="setup-title">Connect to TravelPanel</h2>
        <p class="setup-desc">Enter your TravelPanel URL to start clipping travel inspiration.</p>
        <div class="input-group">
          <input
            type="url"
            id="appUrlInput"
            class="input"
            placeholder="https://your-app.vercel.app"
            autocomplete="off"
            spellcheck="false"
          >
          <p class="input-hint">Your deployed TravelPanel URL</p>
        </div>
        <button id="connectBtn" class="btn btn-primary" disabled>
          Connect
        </button>
      </div>
    </div>

    <!-- ── Main state ──────────────────────────────── -->
    <div id="mainState" class="state" hidden>
      <!-- Page preview card -->
      <div class="page-card">
        <img id="pageFavicon" class="favicon" src="" alt="" width="20" height="20">
        <div class="page-details">
          <p id="pageTitle" class="page-title">—</p>
          <p id="pageUrl" class="page-url">—</p>
        </div>
      </div>

      <!-- Platform badge -->
      <div id="platformRow" class="platform-row" hidden>
        <span id="platformBadge" class="platform-badge"></span>
      </div>

      <!-- Primary action -->
      <button id="saveBtn" class="btn btn-primary btn-large">
        <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
          <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
        </svg>
        Save to TravelPanel
      </button>

      <!-- Quick open link -->
      <button id="openAppBtn" class="btn btn-ghost">
        Open TravelPanel →
      </button>
    </div>

    <!-- ── Blocked state (not a travel URL, etc.) ───── -->
    <div id="blockedState" class="state" hidden>
      <div class="blocked-body">
        <span class="blocked-icon">🚫</span>
        <p class="blocked-title">Can't clip this page</p>
        <p class="blocked-desc" id="blockedReason">This page can't be saved to TravelPanel.</p>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
