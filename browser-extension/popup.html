<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #ffffff;
      color: #0f0f11;
      line-height: 1.5;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f0f0f3;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
      color: #0f0f11;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #6366f1; background: #f3f4f6; }

    /* ── Body ────────────────────────────────────────────────────────────────── */
    .body { padding: 16px; }

    /* ── Platform badge ──────────────────────────────────────────────────────── */
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
      margin-bottom: 10px;
    }

    /* ── Page info ───────────────────────────────────────────────────────────── */
    .page-title {
      font-weight: 600;
      font-size: 15px;
      color: #0f0f11;
      margin-bottom: 4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }

    .page-url {
      font-size: 12px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 16px;
    }

    /* ── Clip button ─────────────────────────────────────────────────────────── */
    .clip-btn {
      width: 100%;
      padding: 12px 16px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }
    .clip-btn:hover { background: #4f46e5; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled {
      background: #c7d2fe;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Success state ────────────────────────────────────────────────────────── */
    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      gap: 10px;
    }

    .success-icon {
      width: 52px;
      height: 52px;
      background: #ecfdf5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .success-title {
      font-weight: 700;
      font-size: 16px;
      color: #0f0f11;
    }

    .success-subtitle {
      font-size: 13px;
      color: #6b7280;
    }

    .view-btn {
      margin-top: 4px;
      padding: 8px 20px;
      background: #f3f4f6;
      color: #374151;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .view-btn:hover { background: #e5e7eb; }

    /* ── Error state ─────────────────────────────────────────────────────────── */
    .error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #dc2626;
      margin-bottom: 12px;
    }

    /* ── No-URL state ──────────────────────────────────────────────────────────── */
    .no-url-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 16px;
      gap: 8px;
    }
    .no-url-icon { font-size: 32px; }
    .no-url-text { font-size: 14px; color: #6b7280; }

    /* ── Spinner ─────────────────────────────────────────────────────────────── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🧭</div>
      TravelPanel
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2"/>
      </svg>
    </button>
  </div>

  <!-- Clip UI (default view) -->
  <div class="body" id="clipView">
    <div class="error-banner" id="errorBanner"></div>

    <div id="platform-badge" class="platform-badge" style="background:#6366f1">
      🌐 Web
    </div>

    <div class="page-title" id="pageTitle">Loading…</div>
    <div class="page-url" id="pageUrl"></div>

    <button class="clip-btn" id="clipBtn">
      <span id="btnIcon">📌</span>
      <span id="btnText">Clip to TravelPanel</span>
      <div class="spinner" id="btnSpinner"></div>
    </button>
  </div>

  <!-- Success view -->
  <div class="success-state" id="successView">
    <div class="success-icon">✓</div>
    <div class="success-title">Clipped!</div>
    <div class="success-subtitle" id="successSubtitle">Saved to TravelPanel for AI extraction</div>
    <button class="view-btn" id="viewBtn">Open TravelPanel →</button>
  </div>

  <!-- No-URL view (shown on browser internal pages) -->
  <div class="no-url-state" id="noUrlView">
    <div class="no-url-icon">🗺️</div>
    <div class="no-url-text">Navigate to a travel page to clip it.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
