<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor"/>
          <circle cx="12" cy="9" r="2.5" fill="white"/>
        </svg>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Main view -->
    <main id="main-view">
      <!-- Page preview -->
      <div class="page-preview">
        <div class="page-meta">
          <img id="favicon" class="favicon" src="" alt="" />
          <div class="page-info">
            <div id="platform-badge" class="platform-badge hidden"></div>
            <p id="page-title" class="page-title">Loading…</p>
            <p id="page-url" class="page-url"></p>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <button id="clip-btn" class="clip-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5" fill="white" stroke="none"/>
        </svg>
        Save to TravelPanel
      </button>

      <!-- Quick stats -->
      <div id="stats-row" class="stats-row hidden">
        <span id="clips-count" class="stat"></span>
      </div>

      <!-- Footer link -->
      <button id="open-app-btn" class="open-app-link">Open TravelPanel ↗</button>
    </main>

    <!-- Settings panel -->
    <section id="settings-view" class="settings-view hidden">
      <div class="settings-header">
        <button id="back-btn" class="icon-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
        <span>Settings</span>
      </div>
      <div class="settings-body">
        <label class="settings-label" for="app-url-input">TravelPanel URL</label>
        <input
          type="url"
          id="app-url-input"
          class="settings-input"
          placeholder="https://travelpanel.vercel.app"
          spellcheck="false"
        />
        <p class="settings-hint">Change this if you're running TravelPanel locally or on a custom domain.</p>
        <button id="save-settings-btn" class="save-settings-btn">Save</button>
        <p id="settings-saved-msg" class="settings-saved hidden">Saved!</p>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
