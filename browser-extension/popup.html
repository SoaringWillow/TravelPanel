<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M12 2C8.686 2 6 4.686 6 8c0 4.813 6 14 6 14s6-9.187 6-14c0-3.314-2.686-6-6-6zm0 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
        </svg>
      </div>
      <span class="brand-name">TravelPanel</span>
      <button class="settings-btn" id="settings-btn" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 0 1-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 0 1 .947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 0 1 2.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 0 1 2.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 0 1 .947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 0 1-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 0 1-2.287-.947zM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" clip-rule="evenodd"/>
        </svg>
      </button>
    </header>

    <!-- Page preview -->
    <div class="page-preview">
      <div id="page-favicon" class="favicon-placeholder" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="#9ca3af" width="10" height="10">
          <path d="M8 0C3.58 0 0 3.58 0 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm5.58 5.5H11.1a12.6 12.6 0 0 0-1.11-2.9 6.51 6.51 0 0 1 3.59 2.9zM8 1.52c.63.9 1.18 2 1.54 3.2H6.46C6.82 3.52 7.37 2.42 8 1.52zM1.53 9.5A6.6 6.6 0 0 1 1.5 8a6.6 6.6 0 0 1 .03-.5H4.1a13.1 13.1 0 0 0 0 1H1.53zm.9 1.5h2.49a12.6 12.6 0 0 0 1.11 2.9 6.51 6.51 0 0 1-3.6-2.9zm2.49-5H2.43a6.51 6.51 0 0 1 3.59-2.9A12.6 12.6 0 0 0 4.92 6zm1.54 5.2C6.82 9.98 6.82 8 8 8c0 1.21-.55 2.3-1.54 3.2zm3.08 2.9a12.6 12.6 0 0 0 1.11-2.9h2.49a6.51 6.51 0 0 1-3.6 2.9zM13.5 9.5h-2.58a13.1 13.1 0 0 0 0-1h2.58a6.6 6.6 0 0 1 0 1z"/>
        </svg>
      </div>
      <div class="page-info">
        <div class="page-title" id="page-title">Loading page info…</div>
        <div class="page-url" id="page-url">—</div>
        <span class="platform-badge" id="platform-badge" style="display:none"></span>
      </div>
    </div>

    <!-- Save button -->
    <button class="save-btn" id="save-btn" disabled>
      <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
        <path fill-rule="evenodd" d="M10 3a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H4a1 1 0 1 1 0-2h5V4a1 1 0 0 1 1-1z" clip-rule="evenodd"/>
      </svg>
      Save to TravelPanel
    </button>

    <!-- Status message -->
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <!-- Footer -->
    <footer>
      <a href="#" id="open-app">Open TravelPanel ↗</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
