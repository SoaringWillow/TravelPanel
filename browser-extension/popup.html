<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      width: 320px;
      min-height: 160px;
      color: #111827;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #f3f4f6;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .header-logo img { width: 22px; height: 22px; border-radius: 5px; }
    .header-logo span { font-size: 13px; font-weight: 700; color: #111827; }
    .btn-settings {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .btn-settings:hover { color: #4f46e5; background: #eef2ff; }

    /* ── Setup panel ── */
    #setup-panel {
      padding: 20px 16px;
      display: none;
    }
    #setup-panel h2 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    #setup-panel p  { font-size: 12px; color: #6b7280; margin-bottom: 12px; line-height: 1.5; }
    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-row input:focus { border-color: #4f46e5; }
    .input-row input::placeholder { color: #9ca3af; }
    .btn-save {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-save:hover { background: #4338ca; }

    /* ── Main clip panel ── */
    #clip-panel {
      padding: 12px 14px 14px;
      display: none;
    }

    .page-meta { margin-bottom: 12px; }
    .platform-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      color: #fff;
    }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-clip {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }
    .btn-clip:hover { opacity: 0.92; }
    .btn-clip:active { transform: scale(0.98); }

    .hint {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.4;
    }
    .hint a {
      color: #4f46e5;
      text-decoration: none;
    }
    .hint a:hover { text-decoration: underline; }

    /* ── Settings panel (inline) ── */
    #settings-panel {
      border-top: 1px solid #f3f4f6;
      padding: 12px 14px;
      display: none;
    }
    #settings-panel h3 { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 8px; }
    .settings-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .settings-row input {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .settings-row input:focus { border-color: #4f46e5; }
    .btn-save-sm {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save-sm:hover { background: #4338ca; }
    .settings-note { font-size: 11px; color: #9ca3af; }

    /* ── Clipped confirmation ── */
    #clipped-panel {
      padding: 20px 14px;
      text-align: center;
      display: none;
    }
    .clipped-icon { font-size: 36px; margin-bottom: 8px; }
    .clipped-title { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .clipped-sub { font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <img src="icons/icon48.png" alt="TravelPanel" />
      <span>TravelPanel</span>
    </div>
    <button class="btn-settings" id="btn-toggle-settings" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Setup panel (shown when no app URL is set) -->
  <div id="setup-panel">
    <h2>Connect your TravelPanel app</h2>
    <p>Enter your TravelPanel URL to start clipping travel inspiration from any page.</p>
    <div class="input-row">
      <input id="setup-url-input" type="url" placeholder="https://your-app.vercel.app" />
      <button class="btn-save" id="btn-setup-save">Connect</button>
    </div>
  </div>

  <!-- Main clip panel -->
  <div id="clip-panel">
    <div class="page-meta">
      <div id="platform-badge" class="platform-badge"></div>
      <div id="page-title" class="page-title"></div>
      <div id="page-url" class="page-url"></div>
    </div>
    <button class="btn-clip" id="btn-clip">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      Clip to TravelPanel
    </button>
    <p class="hint" id="hint-text"></p>
  </div>

  <!-- Settings panel (inline, toggled) -->
  <div id="settings-panel">
    <h3>App URL</h3>
    <div class="settings-row">
      <input id="settings-url-input" type="url" placeholder="https://your-app.vercel.app" />
      <button class="btn-save-sm" id="btn-settings-save">Save</button>
    </div>
    <p class="settings-note">Your deployed TravelPanel URL</p>
  </div>

  <!-- Clipped confirmation -->
  <div id="clipped-panel">
    <div class="clipped-icon">✅</div>
    <div class="clipped-title">Opening TravelPanel…</div>
    <div class="clipped-sub" id="clipped-sub"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
