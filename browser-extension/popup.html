<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #111827;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo { font-size: 20px; line-height: 1; }
    .header-text-title {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .header-text-sub {
      color: rgba(255,255,255,0.65);
      font-size: 10px;
      margin-top: 1px;
    }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Setup view ── */
    #setup-view { padding: 18px 16px 20px; }
    .setup-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
    .setup-desc {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.55;
      margin-bottom: 14px;
    }
    .setup-label {
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }
    .input-field {
      width: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 10px;
    }
    .input-field:focus { border-color: #4f46e5; }
    .input-field::placeholder { color: #9ca3af; }

    /* ── Main view ── */
    #main-view { padding: 14px 16px 18px; }

    .page-card {
      background: #f9fafb;
      border: 1px solid #f0f0f0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .page-card-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      margin-bottom: 6px;
      display: block;
    }
    .page-card-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-card-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-card-platform {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      padding: 2px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:active { background: #3730a3; transform: scale(0.985); }
    .btn-primary:disabled { background: #a5b4fc; cursor: default; transform: none; }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 11px;
      gap: 12px;
    }
    .link-btn {
      font-size: 11px;
      color: #9ca3af;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .link-btn:hover { color: #4f46e5; }
    .dot-sep { font-size: 11px; color: #d1d5db; }

    /* ── Success view ── */
    #success-view { padding: 28px 16px 24px; text-align: center; }
    .success-icon { font-size: 44px; margin-bottom: 10px; line-height: 1; }
    .success-title { font-size: 15px; font-weight: 700; color: #111827; }
    .success-sub { font-size: 12px; color: #6b7280; margin-top: 5px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-logo">🗺️</span>
    <div>
      <div class="header-text-title">TravelPanel Clipper</div>
      <div class="header-text-sub">Save travel inspiration</div>
    </div>
  </div>

  <!-- Setup: first-time URL config -->
  <div id="setup-view" class="view">
    <div class="setup-title">Welcome! 👋</div>
    <div class="setup-desc">
      Enter your TravelPanel app URL to start saving travel content from any webpage.
    </div>
    <div class="setup-label">TravelPanel URL</div>
    <input
      type="url"
      id="setup-url"
      class="input-field"
      placeholder="https://your-app.vercel.app"
      autocomplete="off"
    />
    <button class="btn-primary" id="setup-connect-btn">
      Connect TravelPanel
    </button>
  </div>

  <!-- Main: clip current page -->
  <div id="main-view" class="view">
    <div class="page-card">
      <span id="platform-chip" class="page-card-platform" style="display:none"></span>
      <img id="favicon" class="page-card-favicon" src="" alt="" style="display:none" />
      <div class="page-card-title" id="page-title">Loading…</div>
      <div class="page-card-url" id="page-url"></div>
    </div>
    <button class="btn-primary" id="save-btn">
      <span>📍</span>
      <span>Save to TravelPanel</span>
    </button>
    <div class="footer-row">
      <button class="link-btn" id="settings-btn">Settings</button>
      <span class="dot-sep">·</span>
      <button class="link-btn" id="open-app-btn">Open app</button>
    </div>
  </div>

  <!-- Success: tab opened -->
  <div id="success-view" class="view">
    <div class="success-icon">✅</div>
    <div class="success-title">TravelPanel is opening…</div>
    <div class="success-sub">Select a board to save this clip,<br/>then return to browse.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
