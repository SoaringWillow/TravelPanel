<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #293548;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dim: #0ea5e9;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 10px;
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    .header-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      flex: 1;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }

    .settings-btn:hover {
      color: var(--text);
      background: var(--surface2);
    }

    /* ── Content ── */
    .content {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Platform badge ── */
    .platform-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .platform-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* ── URL card ── */
    .url-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .url-card-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 600;
    }

    .url-text {
      font-size: 13px;
      color: var(--text);
      word-break: break-all;
      line-height: 1.4;
    }

    .title-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      width: 100%;
      resize: none;
      padding: 0;
      line-height: 1.4;
    }

    .title-input::placeholder {
      color: var(--muted);
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Quick boards ── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .no-config-hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 6px 0;
      line-height: 1.5;
    }

    .no-config-hint a {
      color: var(--accent);
      text-decoration: none;
    }

    .no-config-hint a:hover {
      text-decoration: underline;
    }

    /* ── CTA button ── */
    .clip-btn {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border: none;
      border-radius: var(--radius);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .clip-btn:hover {
      opacity: 0.92;
    }

    .clip-btn:active {
      transform: scale(0.98);
    }

    .clip-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .clip-btn svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    /* ── Success state ── */
    .success-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 24px 16px;
      text-align: center;
    }

    .success-icon {
      width: 52px;
      height: 52px;
      background: rgba(52, 211, 153, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--success);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
    }

    .success-sub {
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Error state ── */
    .error-banner {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--danger);
      display: none;
    }

    /* ── Loading ── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── No URL state ── */
    .empty-state {
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-state-icon {
      font-size: 32px;
    }

    .empty-state-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }

    .footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </div>
    <span class="header-title">TravelPanel Clipper</span>
    <button class="settings-btn" id="openSettings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Main content -->
  <div id="mainContent">

    <!-- Empty state (no URL) -->
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="empty-state-icon">✈️</div>
      <div class="empty-state-text">
        Navigate to a travel blog, Instagram, YouTube, or Xiaohongshu page to clip it.
      </div>
    </div>

    <!-- Normal state -->
    <div id="normalState" class="content">
      <div id="platformRow" class="platform-row" style="display:none">
        <span id="platformBadge" class="platform-badge">
          <span id="platformDot" class="platform-dot"></span>
          <span id="platformLabel"></span>
        </span>
        <span id="domainLabel" style="font-size:12px;color:var(--muted)"></span>
      </div>

      <div class="url-card">
        <span class="url-card-label">Title</span>
        <textarea
          id="clipTitle"
          class="title-input"
          rows="2"
          placeholder="Page title…"
        ></textarea>
      </div>

      <div class="url-card">
        <span class="url-card-label">URL</span>
        <div id="clipUrl" class="url-text"></div>
      </div>

      <div id="errorBanner" class="error-banner"></div>

      <button class="clip-btn" id="clipBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <span id="clipBtnText">Clip to TravelPanel</span>
      </button>
    </div>

    <!-- Success state -->
    <div id="successState" class="success-state" style="display:none">
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="success-title">Clipped! ✈️</div>
      <div class="success-sub">Opening TravelPanel to pick a board…</div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <span>TravelPanel v1.0</span>
    <a id="openAppLink" href="#" target="_blank">Open TravelPanel ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
