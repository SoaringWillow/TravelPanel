<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="10" r="4" stroke="white" stroke-width="2"/>
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke="white" stroke-width="2" fill="none"/>
        </svg>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button class="icon-btn" id="settingsToggle" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Settings panel (hidden by default) -->
    <div class="settings-panel" id="settingsPanel" hidden>
      <label class="field-label" for="urlInput">TravelPanel URL</label>
      <div class="field-row">
        <input
          type="url"
          id="urlInput"
          class="text-input"
          placeholder="https://your-app.vercel.app"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="save-btn" id="saveSettings">Save</button>
      </div>
      <p class="field-hint" id="settingsStatus"></p>
    </div>

    <!-- Current page card -->
    <div class="page-card" id="pageCard">
      <div class="platform-badge" id="platformBadge" hidden></div>
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-host" id="pageHost"></div>
    </div>

    <!-- Clip button -->
    <button class="clip-btn" id="clipBtn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5" fill="currentColor"/>
      </svg>
      <span class="btn-label">Clip to TravelPanel</span>
    </button>

    <!-- Recent clips -->
    <section class="recent-section">
      <div class="section-header">
        <span class="section-title">Recent clips</span>
        <button class="icon-btn small" id="clearRecent" title="Clear history" aria-label="Clear history" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
      <div class="recent-list" id="recentList">
        <p class="empty-state">No clips yet — start clipping travel pages!</p>
      </div>
    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
