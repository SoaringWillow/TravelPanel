<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="url(#logoGrad)"/>
          <path d="M12 7l1.5 3.5L17 12l-3.5 1.5L12 17l-1.5-3.5L7 12l3.5-1.5L12 7z" fill="white"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4F46E5"/>
              <stop offset="100%" stop-color="#2563EB"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">TravelPanel</span>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
      </button>
    </header>

    <!-- Page preview card -->
    <div class="page-card" id="pageCard">
      <div class="page-favicon-wrap">
        <img class="page-favicon" id="pageFavicon" src="" alt="" width="28" height="28">
        <div class="favicon-placeholder" id="faviconPlaceholder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
      </div>
      <div class="page-info">
        <div class="page-meta">
          <span class="platform-badge" id="platformBadge" style="display:none"></span>
        </div>
        <p class="page-title" id="pageTitle">Loading page…</p>
        <p class="page-url" id="pageUrl"></p>
      </div>
    </div>

    <!-- Loading state -->
    <div class="loading-state" id="loadingState" style="display:none">
      <div class="spinner"></div>
      <span>Saving…</span>
    </div>

    <!-- Success state -->
    <div class="success-state" id="successState" style="display:none">
      <div class="success-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <p class="success-text">Saved to TravelPanel!</p>
      <p class="success-sub" id="successSub">AI is extracting spots &amp; tips…</p>
    </div>

    <!-- Actions -->
    <div class="actions" id="actionsArea">
      <button class="clip-btn" id="clipBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        Clip to TravelPanel
      </button>
      <button class="open-btn" id="openBtn">
        Open App
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
        </svg>
      </button>
    </div>

    <!-- Error state -->
    <div class="error-state" id="errorState" style="display:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errorText">Something went wrong</span>
    </div>

    <!-- Settings panel -->
    <div class="settings-panel" id="settingsPanel" style="display:none">
      <div class="settings-header">
        <h3>Settings</h3>
        <button class="close-settings" id="closeSettings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="settings-field">
        <label for="appUrlInput">TravelPanel URL</label>
        <input
          type="url"
          id="appUrlInput"
          placeholder="https://your-app.vercel.app"
          autocomplete="off"
          spellcheck="false"
        >
        <p class="field-hint">Your deployed app URL or <code>http://localhost:3000</code> for local dev.</p>
      </div>
      <button class="save-settings-btn" id="saveSettingsBtn">Save Settings</button>
      <p class="settings-note" id="settingsSaved" style="display:none">✓ Saved!</p>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
