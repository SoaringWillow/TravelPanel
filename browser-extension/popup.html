<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #fff;
      color: #111827;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .header-subtitle {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 1px;
    }

    /* Body */
    .body { padding: 14px 16px; }

    /* Platform badge */
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    /* Page info */
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 11px;
      color: #9CA3AF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 14px;
    }

    /* Save button */
    .btn-save {
      width: 100%;
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
    }
    .btn-save:hover { background: #4338CA; }
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled {
      background: #A5B4FC;
      cursor: not-allowed;
      transform: none;
    }

    /* Setup notice */
    .setup-notice {
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .setup-notice p {
      font-size: 12px;
      color: #92400E;
      line-height: 1.4;
    }
    .setup-notice a {
      color: #B45309;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Footer */
    .footer {
      padding: 8px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #F3F4F6;
    }
    .footer-link {
      font-size: 11px;
      color: #9CA3AF;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      padding: 0;
    }
    .footer-link:hover { color: #6B7280; }

    /* Error / loading states */
    .state-loading .body, .state-error .body { padding-bottom: 0; }
    .error-msg {
      font-size: 12px;
      color: #EF4444;
      margin-bottom: 10px;
      background: #FEF2F2;
      padding: 8px 10px;
      border-radius: 8px;
    }

    /* Divider with "or" */
    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      color: #D1D5DB;
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-logo">📍</div>
    <div>
      <div class="header-title">TravelPanel Clipper</div>
      <div class="header-subtitle">Save travel inspiration</div>
    </div>
  </div>

  <!-- Body -->
  <div class="body" id="body">
    <!-- Platform badge -->
    <div id="platform-badge" class="platform-badge" style="display:none"></div>

    <!-- Page title -->
    <div id="page-title" class="page-title"></div>
    <div id="page-url" class="page-url"></div>

    <!-- Setup notice (shown when URL not configured) -->
    <div id="setup-notice" class="setup-notice" style="display:none">
      <p>
        Set your TravelPanel URL to start clipping.
        <a id="setup-link">Open settings →</a>
      </p>
    </div>

    <!-- Error -->
    <div id="error-msg" class="error-msg" style="display:none"></div>

    <!-- Save button -->
    <button id="btn-save" class="btn-save">
      <span>📌</span>
      <span id="btn-label">Save to TravelPanel</span>
    </button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="footer-status" style="font-size:11px; color:#9CA3AF;"></span>
    <button class="footer-link" id="settings-btn">⚙ Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
