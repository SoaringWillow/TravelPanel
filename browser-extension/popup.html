<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 160px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo {
      width: 26px;
      height: 26px;
      background: rgba(255,255,255,0.18);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
    }
    .header-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.65);
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      transition: background 0.12s, color 0.12s;
    }
    .settings-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    /* ── Setup notice ────────────────────────────────────────── */
    .setup-notice {
      display: none;
      margin: 12px 14px 0;
      padding: 10px 12px;
      background: #fef9c3;
      border: 1px solid #fde047;
      border-radius: 10px;
      font-size: 12px;
      color: #713f12;
      line-height: 1.45;
    }
    .setup-notice.visible { display: block; }
    .setup-notice a {
      color: #854d0e;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ── Page card ───────────────────────────────────────────── */
    .page-card {
      margin: 12px 14px 0;
      padding: 11px 12px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .page-favicon {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: #f1f5f9;
      flex-shrink: 0;
      object-fit: contain;
      display: none;
    }
    .favicon-placeholder {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: #e2e8f0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .page-meta {
      min-width: 0;
      flex: 1;
    }
    .platform-chip {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      margin-bottom: 4px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #fff;
    }
    .page-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 10.5px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    /* ── Clip button ─────────────────────────────────────────── */
    .clip-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: calc(100% - 28px);
      margin: 10px 14px 0;
      padding: 13px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: opacity 0.12s, transform 0.08s;
    }
    .clip-btn:hover { opacity: 0.9; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled { opacity: 0.45; cursor: default; }
    .clip-btn .icon { font-size: 16px; }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px 13px;
    }
    .open-app-link {
      font-size: 11px;
      color: #94a3b8;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.12s;
      background: none;
      border: none;
    }
    .open-app-link:hover { color: #6366f1; }

    /* ── Loading state ───────────────────────────────────────── */
    #loading-state {
      padding: 28px 16px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }

    /* ── Error state ─────────────────────────────────────────── */
    .error-notice {
      margin: 12px 14px 10px;
      padding: 10px 12px;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      font-size: 12px;
      color: #991b1b;
      line-height: 1.45;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-brand">
      <div class="header-logo">✈️</div>
      <span class="header-name">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settings-btn" title="Settings">⚙️</button>
  </div>

  <!-- Setup required notice -->
  <div class="setup-notice" id="setup-notice">
    ⚠️ Enter your TravelPanel URL in <a id="setup-link">Settings</a> to start clipping.
  </div>

  <!-- Loading state -->
  <div id="loading-state">Loading…</div>

  <!-- Main content (hidden until loaded) -->
  <div id="main-content" class="hidden">
    <!-- Error notice (conditionally shown) -->
    <div class="error-notice hidden" id="error-notice"></div>

    <!-- Page card -->
    <div class="page-card">
      <img class="page-favicon" id="page-favicon" alt="" />
      <div class="favicon-placeholder" id="favicon-placeholder">🌐</div>
      <div class="page-meta">
        <span class="platform-chip" id="platform-chip">Web</span>
        <div class="page-title" id="page-title">Untitled page</div>
        <div class="page-url" id="page-url"></div>
      </div>
    </div>

    <!-- Clip button -->
    <button class="clip-btn" id="clip-btn">
      <span class="icon">✈️</span>
      Clip to TravelPanel
    </button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="open-app-link" id="open-app-btn">Open TravelPanel ↗</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
