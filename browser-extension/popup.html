<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TravelPanel Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #1f2937;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      padding: 14px 16px 12px;
      color: #fff;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header .tagline {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 2px;
    }

    /* ── Body ── */
    .body { padding: 14px 16px 16px; }

    /* Platform chip */
    .chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 99px;
      color: #fff;
      margin-bottom: 8px;
    }

    /* URL preview card */
    .preview-card {
      background: #f5f7ff;
      border: 1px solid #e0e7ff;
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 14px;
    }
    .preview-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .preview-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Save button */
    .save-btn {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.13s, transform 0.08s;
      letter-spacing: -0.2px;
    }
    .save-btn:hover  { background: #4f46e5; }
    .save-btn:active { transform: scale(0.975); background: #4338ca; }

    /* Settings footer */
    .footer {
      display: flex;
      align-items: center;
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid #f3f4f6;
      gap: 8px;
    }
    .footer-url {
      flex: 1;
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer-settings {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 500;
      color: #6366f1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .footer-settings:hover { color: #4f46e5; }

    /* ── Not-configured state ── */
    .setup {
      padding: 20px 16px 18px;
      text-align: center;
    }
    .setup-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .setup h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #111827;
    }
    .setup p {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .setup-btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.13s;
    }
    .setup-btn:hover { background: #4f46e5; }

    /* ── Success state ── */
    .success {
      padding: 24px 16px 20px;
      text-align: center;
    }
    .success-icon { font-size: 44px; margin-bottom: 10px; }
    .success h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .success p { font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <h1>TravelPanel</h1>
    </div>
    <div class="tagline">Clip travel inspiration to your boards</div>
  </div>

  <div id="content"></div>

  <script src="popup.js"></script>
</body>
</html>
