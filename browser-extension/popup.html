<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: #fff;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .header-text h1 { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.2; }
    .header-text p  { font-size: 11px; color: rgba(255,255,255,0.75); margin-top: 1px; }
    .header-settings {
      margin-left: auto;
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.7); font-size: 18px; padding: 2px;
      display: flex; align-items: center;
      transition: color 0.15s;
    }
    .header-settings:hover { color: #fff; }

    /* ── Content ── */
    .content { padding: 14px 16px 0; }

    /* ── Page preview ── */
    .preview-card {
      background: #f9fafb;
      border: 1px solid #f0f0f0;
      border-radius: 12px;
      padding: 11px 13px;
      display: flex; align-items: flex-start; gap: 10px;
      min-height: 56px;
    }
    .preview-favicon {
      width: 20px; height: 20px; border-radius: 4px;
      flex-shrink: 0; margin-top: 1px; object-fit: cover;
    }
    .preview-favicon-placeholder {
      width: 20px; height: 20px; border-radius: 4px;
      background: #e5e7eb; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }
    .preview-meta { min-width: 0; }
    .preview-title {
      font-size: 12.5px; font-weight: 600; color: #111827;
      line-height: 1.4; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview-domain { font-size: 11px; color: #9ca3af; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Thumbnail ── */
    .thumbnail-wrap { margin-top: 10px; border-radius: 10px; overflow: hidden; display: none; }
    .thumbnail-wrap.visible { display: block; }
    .thumbnail-wrap img { width: 100%; height: 120px; object-fit: cover; display: block; }

    /* ── Platform chip ── */
    .platform-chip {
      display: inline-block; margin-top: 10px;
      font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 100px;
      color: #fff;
    }

    /* ── Action area ── */
    .actions { padding: 12px 16px; }

    .btn-save {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
    }
    .btn-save:hover:not(:disabled) { background: #4338ca; }
    .btn-save:active:not(:disabled) { transform: scale(0.985); }
    .btn-save:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Loading state ── */
    .state-loading {
      display: flex; align-items: center; justify-content: center;
      padding: 24px 0 10px;
      color: #9ca3af; font-size: 13px; gap: 8px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #e5e7eb;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Success state ── */
    .state-success {
      display: none;
      flex-direction: column; align-items: center;
      padding: 20px 16px 16px; gap: 6px; text-align: center;
    }
    .state-success.visible { display: flex; }
    .success-icon { font-size: 40px; line-height: 1; }
    .success-title { font-size: 15px; font-weight: 700; color: #111827; }
    .success-sub   { font-size: 12px; color: #6b7280; }
    .btn-open-app {
      margin-top: 6px;
      background: none; border: 1.5px solid #4f46e5;
      color: #4f46e5; border-radius: 10px;
      padding: 8px 16px; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-open-app:hover { background: #eef2ff; }

    /* ── Error state ── */
    .error-msg {
      display: none; margin-top: 8px;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; padding: 8px 12px;
      font-size: 12px; color: #dc2626;
    }
    .error-msg.visible { display: block; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid #f3f4f6;
      padding: 9px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-url  { font-size: 10.5px; color: #d1d5db; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .footer-link { font-size: 11px; color: #9ca3af; cursor: pointer; background: none; border: none; padding: 0; transition: color 0.15s; }
    .footer-link:hover { color: #4f46e5; }

    /* ── Hidden ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">✈️</div>
    <div class="header-text">
      <h1>TravelPanel</h1>
      <p>Clipper</p>
    </div>
    <button class="header-settings" id="btn-settings" title="Settings">⚙</button>
  </div>

  <!-- Loading state -->
  <div class="state-loading" id="state-loading">
    <div class="spinner"></div>
    Reading page…
  </div>

  <!-- Main clip UI -->
  <div id="clip-ui" class="hidden">
    <div class="content">
      <!-- Page preview card -->
      <div class="preview-card">
        <img class="preview-favicon hidden" id="favicon" alt="">
        <div class="preview-favicon-placeholder hidden" id="favicon-placeholder">🌐</div>
        <div class="preview-meta">
          <div class="preview-title" id="page-title">Loading…</div>
          <div class="preview-domain" id="page-domain"></div>
        </div>
      </div>

      <!-- Thumbnail (shown only if og:image present) -->
      <div class="thumbnail-wrap" id="thumbnail-wrap">
        <img id="thumbnail-img" alt="Page thumbnail">
      </div>

      <!-- Platform chip -->
      <span class="platform-chip hidden" id="platform-chip"></span>
    </div>

    <!-- Save button -->
    <div class="actions">
      <button class="btn-save" id="btn-save">
        <span>📌</span>
        <span id="btn-label">Save to TravelPanel</span>
      </button>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <!-- Success state -->
  <div class="state-success" id="state-success">
    <div class="success-icon">✅</div>
    <div class="success-title">Saved!</div>
    <div class="success-sub" id="success-sub">Opening TravelPanel…</div>
    <button class="btn-open-app" id="btn-open-app">Open TravelPanel →</button>
  </div>

  <!-- Footer -->
  <div class="footer" id="footer">
    <span class="footer-url" id="footer-tp-url"></span>
    <button class="footer-link" id="footer-settings-link">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
