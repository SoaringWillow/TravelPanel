<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <div class="header">
    <svg class="header-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="24" height="24" rx="5.5" fill="rgba(255,255,255,0.2)"/>
      <path d="M12 3.5C8.96 3.5 6.5 5.96 6.5 9c0 4.38 5.5 11.5 5.5 11.5S17.5 13.38 17.5 9C17.5 5.96 15.04 3.5 12 3.5zm0 7.75c-1.52 0-2.75-1.23-2.75-2.75S10.48 5.75 12 5.75s2.75 1.23 2.75 2.75S13.52 11.25 12 11.25z" fill="white"/>
    </svg>
    <span class="header-title">TravelPanel Clipper</span>
  </div>

  <!-- ── Content ─────────────────────────────────────────────── -->
  <div class="content">

    <!-- Setup banner (shown when no URL configured) -->
    <div id="setup-banner" class="setup-banner" style="display:none">
      ⚙️ Set your TravelPanel URL in
      <a id="open-options" href="#">Settings</a>
      to start clipping.
    </div>

    <!-- Page preview card -->
    <div class="page-preview" id="page-preview">
      <div class="page-domain" id="domain-row">
        <img id="favicon" class="page-favicon" src="" alt="" style="display:none">
        <span id="domain-text">Loading…</span>
      </div>
      <div id="page-title" class="page-title loading">Loading page…</div>
      <div id="page-url" class="page-url"></div>
    </div>

    <!-- Restricted state (chrome:// pages etc.) -->
    <div id="restricted-msg" class="restricted-msg" style="display:none">
      Can't clip browser internal pages.
    </div>

    <!-- Clip button -->
    <button id="clip-btn" class="clip-btn" disabled>
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/>
      </svg>
      <span id="clip-btn-text">Clip to TravelPanel</span>
    </button>

  </div>

  <!-- ── Footer ──────────────────────────────────────────────── -->
  <div class="footer">
    <span class="version">v1.0.0</span>
    <button class="settings-link" id="settings-link">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
        <path d="M12 15.5c-1.93 0-3.5-1.57-3.5-3.5S10.07 8.5 12 8.5s3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5zm7.43-1.97c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z" fill="currentColor"/>
      </svg>
      Settings
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
