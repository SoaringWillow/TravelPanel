<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      background: #6366f1;
      color: #fff;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .header-brand svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: rgba(255,255,255,0.8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #fff; background: rgba(255,255,255,0.15); }
    .settings-btn svg { width: 16px; height: 16px; }

    /* ── Page preview ── */
    .page-preview {
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .favicon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
      object-fit: contain;
      background: #f3f4f6;
    }
    .page-info {
      min-width: 0;
      flex: 1;
    }
    .page-title {
      font-size: 13px;
      font-weight: 500;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-domain {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Tags hint ── */
    .tags-hint {
      padding: 10px 16px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 11px;
      padding: 3px 8px;
      background: #f3f4f6;
      color: #6b7280;
      border-radius: 20px;
    }

    /* ── Action area ── */
    .action {
      padding: 12px 16px 16px;
    }
    .clip-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
    }
    .clip-btn:hover:not(:disabled) { background: #4f46e5; }
    .clip-btn:active:not(:disabled) { transform: scale(0.98); }
    .clip-btn:disabled { background: #c7d2fe; cursor: default; }
    .clip-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── States ── */
    .error-state {
      padding: 14px 16px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      text-align: center;
    }
    .setup-prompt {
      padding: 14px 16px 4px;
      font-size: 12px;
      color: #f59e0b;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.4;
    }
    .setup-prompt svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }

    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px 10px;
      text-align: center;
      font-size: 10px;
      color: #d1d5db;
    }
    .footer a { color: #a5b4fc; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    #app { display: contents; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="header-brand">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="8" r="5.5" fill="white" opacity="0.9"/>
          <circle cx="10" cy="8" r="2.5" fill="#6366f1"/>
          <path d="M10 13.5 L10 19" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        </svg>
        TravelPanel
      </div>
      <button class="settings-btn" id="settings-btn" title="Settings">
        <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M6.5 1a.5.5 0 0 0-.5.5v.64a5.01 5.01 0 0 0-1.24.72l-.56-.32a.5.5 0 0 0-.68.18L2.5 4a.5.5 0 0 0 .18.68l.57.33A5.05 5.05 0 0 0 3 6.5c0 .43.05.85.15 1.25l-.57.33A.5.5 0 0 0 2.5 9l1 1.73a.5.5 0 0 0 .68.18l.56-.32c.39.29.81.52 1.26.72v.64a.5.5 0 0 0 .5.5h2a.5.5 0 0 0 .5-.5v-.64a5.01 5.01 0 0 0 1.24-.72l.56.32a.5.5 0 0 0 .68-.18L13.5 9a.5.5 0 0 0-.18-.68l-.57-.32c.1-.4.15-.82.15-1.25 0-.43-.05-.85-.15-1.25l.57-.33A.5.5 0 0 0 13.5 4l-1-1.73a.5.5 0 0 0-.68-.18l-.56.32A5.01 5.01 0 0 0 10 1.64V1a.5.5 0 0 0-.5-.5h-3zM8.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
        </svg>
      </button>
    </div>

    <div id="page-preview" class="page-preview" style="display:none">
      <img class="favicon" id="favicon" src="" alt="" />
      <div class="page-info">
        <div class="page-title" id="page-title"></div>
        <div class="page-domain" id="page-domain"></div>
      </div>
    </div>

    <div id="setup-prompt" class="setup-prompt" style="display:none">
      <svg viewBox="0 0 16 16" fill="#f59e0b" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 3a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4zm0 7.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
      </svg>
      <span>Set your TravelPanel URL in settings to start clipping.</span>
    </div>

    <div id="error-state" class="error-state" style="display:none"></div>

    <div class="action">
      <button class="clip-btn" id="clip-btn">
        <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1a5 5 0 0 1 3.536 8.536l-2.829 2.828a1 1 0 0 1-1.414 0L4.464 9.536A5 5 0 0 1 8 1zm0 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
        </svg>
        <span id="clip-btn-text">Clip to TravelPanel</span>
      </button>
    </div>

    <div class="footer">
      <a href="#" id="footer-link">travelpanel.app</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
