<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .logo { font-size: 18px; line-height: 1; }

    .header-title {
      font-weight: 700;
      color: #f8fafc;
      font-size: 15px;
      flex: 1;
      letter-spacing: -0.01em;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #475569;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: #94a3b8; }

    .page-info {
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .favicon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #1e293b;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      overflow: hidden;
    }
    .favicon-wrap img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: contain;
    }

    .page-meta { flex: 1; min-width: 0; }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: 0.01em;
    }
    .badge-xiaohongshu { background: #450a0a; color: #fca5a5; }
    .badge-douyin      { background: #0c1a2e; color: #7dd3fc; }
    .badge-bilibili    { background: #1a0a2e; color: #d8b4fe; }
    .badge-wechat      { background: #052e16; color: #86efac; }
    .badge-youtube     { background: #1c0505; color: #fca5a5; }
    .badge-instagram   { background: #1a0a1e; color: #f0abfc; }
    .badge-other       { background: #1e293b; color: #94a3b8; }

    .page-title {
      font-weight: 500;
      color: #f1f5f9;
      line-height: 1.35;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      color: #475569;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      padding: 2px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clip-btn {
      width: 100%;
      padding: 10px 16px;
      background: #ea580c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .clip-btn:hover:not(:disabled) { background: #c2410c; }
    .clip-btn:active:not(:disabled) { transform: scale(0.98); }
    .clip-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
    .clip-btn.success { background: #15803d; pointer-events: none; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      text-align: center;
      font-size: 12px;
      color: #475569;
      min-height: 18px;
      line-height: 1.4;
    }
    .status.error   { color: #f87171; }
    .status.success { color: #4ade80; }

    .shortcut-hint {
      text-align: center;
      font-size: 11px;
      color: #1e3a5f;
      padding-bottom: 10px;
    }
    .shortcut-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      font-size: 10px;
      font-family: inherit;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">✈️</span>
    <span class="header-title">TravelPanel</span>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </button>
  </header>

  <div class="page-info">
    <div class="favicon-wrap" id="faviconWrap">🌐</div>
    <div class="page-meta">
      <div class="platform-badge badge-other" id="platformBadge">Web</div>
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-url" id="pageUrl"></div>
    </div>
  </div>

  <div class="actions">
    <button class="clip-btn" id="clipBtn">
      <span id="clipIcon">📌</span>
      <span id="clipText">Clip to TravelPanel</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="shortcut-hint" id="shortcutHint"></div>

  <script src="popup.js"></script>
</body>
</html>
