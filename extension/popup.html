<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      background: #fff;
      color: #111827;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f3f4f6;
    }
    .header-logo {
      width: 28px; height: 28px;
      background: #4f46e5;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-logo svg { width: 16px; height: 16px; }
    .header-title { font-size: 15px; font-weight: 700; color: #111827; }
    .header-subtitle { font-size: 11px; color: #9ca3af; margin-top: 1px; }
    .settings-btn {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: background 0.15s;
    }
    .settings-btn:hover { background: #f3f4f6; color: #6b7280; }

    /* ── Page preview card ── */
    .preview {
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
    }
    .platform-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 100px;
      color: #fff;
      margin-bottom: 8px;
    }
    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Main clip button ── */
    .clip-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: calc(100% - 32px);
      margin: 14px 16px 0;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .clip-btn:hover { background: #4338ca; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled { background: #a5b4fc; cursor: default; }

    /* ── Secondary action row ── */
    .secondary-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px 14px;
    }
    .open-btn {
      flex: 1;
      padding: 9px;
      background: #f3f4f6;
      color: #374151;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .open-btn:hover { background: #e5e7eb; }

    /* ── Settings panel (hidden by default) ── */
    .settings-panel {
      display: none;
      padding: 14px 16px;
      border-top: 1px solid #f3f4f6;
    }
    .settings-panel.visible { display: block; }
    .settings-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .settings-input-row {
      display: flex;
      gap: 6px;
    }
    .settings-input {
      flex: 1;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      color: #374151;
      outline: none;
      transition: border-color 0.15s;
    }
    .settings-input:focus { border-color: #6366f1; }
    .save-btn {
      padding: 7px 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .save-btn:hover { background: #4338ca; }
    .settings-hint {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 5px;
    }

    /* ── Saved toast ── */
    .toast {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #ecfdf5;
      border-top: 1px solid #a7f3d0;
    }
    .toast.visible { display: flex; }
    .toast-text { font-size: 13px; color: #065f46; font-weight: 600; }

    /* ── No URL state ── */
    .no-url {
      padding: 24px 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }
    .no-url strong { display: block; color: #374151; font-size: 14px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="6.5" r="3" stroke="white" stroke-width="1.5"/>
        <path d="M8 3.5C8 3.5 4 7.5 4 10.5C4 12.7 5.8 14.5 8 14.5C10.2 14.5 12 12.7 12 10.5C12 7.5 8 3.5 8 3.5Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="header-title">TravelPanel</div>
      <div class="header-subtitle">Clip inspiration</div>
    </div>
    <button class="settings-btn" id="settingsToggle" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Page preview (shown when URL is valid) -->
  <div id="previewSection" class="preview">
    <div id="platformChip" class="platform-chip"></div>
    <div id="pageTitle" class="page-title"></div>
    <div id="pageUrl" class="page-url"></div>
  </div>

  <!-- No URL state -->
  <div id="noUrlSection" class="no-url" style="display:none;">
    <strong>Nothing to clip here</strong>
    Navigate to a travel post, article, or video, then click the extension.
  </div>

  <!-- Main clip button -->
  <button class="clip-btn" id="clipBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
    </svg>
    Clip to TravelPanel
  </button>

  <!-- Secondary actions -->
  <div class="secondary-row">
    <button class="open-btn" id="openAppBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open TravelPanel
    </button>
  </div>

  <!-- Settings panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-label">TravelPanel URL</div>
    <div class="settings-input-row">
      <input
        type="url"
        class="settings-input"
        id="appUrlInput"
        placeholder="https://your-app.vercel.app"
      />
      <button class="save-btn" id="saveUrlBtn">Save</button>
    </div>
    <div class="settings-hint">Default: https://travelpanel.vercel.app</div>
  </div>

  <!-- Success toast -->
  <div class="toast" id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span class="toast-text">Opening TravelPanel…</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
