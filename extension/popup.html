<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #fff;
      color: #111827;
    }

    /* ── Header ───────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f3f4f6;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
    }
    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.3px;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #6366f1; background: #eef2ff; }

    /* ── Main content ─────────────────────── */
    .content { padding: 14px 16px; }

    .platform-chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      color: white;
      margin-bottom: 8px;
    }

    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 14px;
    }

    /* ── Clip button ──────────────────────── */
    .clip-btn {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .clip-btn:hover { background: #4f46e5; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled { background: #c7d2fe; cursor: not-allowed; }

    .clip-btn-icon { font-size: 16px; }

    /* ── No URL state ─────────────────────── */
    .empty-state {
      text-align: center;
      padding: 20px 16px;
      color: #6b7280;
      font-size: 13px;
    }
    .empty-state .emoji { font-size: 32px; margin-bottom: 8px; }

    /* ── Not configured state ─────────────── */
    .config-notice {
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #92400e;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .config-link {
      color: #6366f1;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ── Success state ────────────────────── */
    .success-state {
      text-align: center;
      padding: 16px;
    }
    .success-state .emoji { font-size: 40px; margin-bottom: 8px; }
    .success-msg {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }
    .success-sub {
      font-size: 12px;
      color: #6b7280;
    }

    /* ── Footer ───────────────────────────── */
    .footer {
      padding: 8px 16px 12px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      justify-content: flex-end;
    }
    .open-app-link {
      font-size: 11px;
      color: #6366f1;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .open-app-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <div class="logo-icon">📍</div>
      <span class="logo-text">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>
  </div>

  <!-- Main -->
  <div id="main" class="content">
    <div class="empty-state">
      <div class="emoji">⏳</div>
      Loading…
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="open-app-link" id="openAppBtn">
      Open TravelPanel
      <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/>
      </svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
