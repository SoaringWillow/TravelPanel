<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #fff;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f3f4f6;
    }
    .header-logo {
      width: 24px;
      height: 24px;
      background: #6366f1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      flex: 1;
    }
    .btn-settings {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      color: #9ca3af;
      font-size: 16px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }
    .btn-settings:hover { color: #6b7280; background: #f3f4f6; }

    /* ── Main content ── */
    .content { padding: 16px; }

    /* ── Setup state ── */
    .setup-state {
      text-align: center;
      padding: 8px 0 16px;
    }
    .setup-icon { font-size: 32px; margin-bottom: 10px; }
    .setup-title {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    .setup-desc {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* ── Page info ── */
    .platform-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 16px;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 11px 16px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      color: #6366f1;
      border: 2px solid #e0e7ff;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn-secondary:hover { border-color: #6366f1; background: #f0f4ff; }

    /* ── Success state ── */
    .success-state {
      text-align: center;
      padding: 12px 0 8px;
    }
    .success-icon { font-size: 48px; margin-bottom: 10px; }
    .success-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }
    .success-desc {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .success-countdown {
      font-size: 11px;
      color: #9ca3af;
    }

    /* ── Hidden ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">🗺</div>
    <span class="header-title">TravelPanel</span>
    <button class="btn-settings" id="btn-settings" title="Settings">⚙</button>
  </div>

  <!-- Main content area -->
  <div class="content">

    <!-- Setup state (shown when TravelPanel URL is not configured) -->
    <div id="state-setup" class="setup-state hidden">
      <div class="setup-icon">🔗</div>
      <div class="setup-title">Connect your TravelPanel</div>
      <div class="setup-desc">Enter your TravelPanel URL to start<br>clipping travel inspiration.</div>
      <button class="btn-primary" id="btn-open-options-setup">
        ⚙ Open Settings
      </button>
    </div>

    <!-- Ready state (normal clip view) -->
    <div id="state-ready" class="hidden">
      <div id="platform-chip" class="platform-chip"></div>
      <div id="page-title" class="page-title"></div>
      <div id="page-url" class="page-url"></div>
      <button class="btn-primary" id="btn-save">
        📌 Save to TravelPanel
      </button>
    </div>

    <!-- Success state -->
    <div id="state-success" class="success-state hidden">
      <div class="success-icon">✅</div>
      <div class="success-title">Clipped!</div>
      <div id="success-desc" class="success-desc"></div>
      <div class="success-countdown" id="countdown"></div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
