<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.18);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .header-text { flex: 1; }
    .header-title {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-sub {
      color: rgba(255,255,255,0.65);
      font-size: 11px;
      margin-top: 1px;
    }

    /* ── Main content ── */
    .content { padding: 14px 14px 12px; }

    .platform-badge {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
      width: fit-content;
    }
    .badge-xhs       { background: #fee2e2; color: #dc2626; }
    .badge-youtube   { background: #fee2e2; color: #dc2626; }
    .badge-instagram { background: #fce7f3; color: #db2777; }
    .badge-douyin    { background: #f0fdf4; color: #16a34a; }
    .badge-wechat    { background: #f0fdf4; color: #16a34a; }
    .badge-bilibili  { background: #eff6ff; color: #2563eb; }
    .badge-web       { background: #ede9fe; color: #7c3aed; }

    .page-preview {
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 12px;
    }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .error-msg {
      display: none;
      padding: 8px 11px;
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      border-radius: 8px;
      font-size: 12px;
      color: #dc2626;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .btn-save {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.12s, transform 0.1s;
      letter-spacing: -0.01em;
    }
    .btn-save:hover:not(:disabled) { opacity: 0.92; }
    .btn-save:active:not(:disabled) { transform: scale(0.98); }
    .btn-save:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Footer ── */
    .footer {
      padding: 9px 14px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-link {
      font-size: 11px;
      color: #9ca3af;
      text-decoration: none;
    }
    .footer-link:hover { color: #6366f1; }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #d1d5db;
      font-size: 15px;
      padding: 2px;
      line-height: 1;
      transition: color 0.12s;
    }
    .settings-btn:hover { color: #6366f1; }

    /* ── Success state ── */
    .success-state {
      display: none;
      padding: 28px 16px;
      text-align: center;
    }
    .success-icon {
      width: 52px; height: 52px;
      background: #f0fdf4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 26px;
    }
    .success-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 5px;
    }
    .success-sub {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }

    /* ── Not configured state ── */
    .not-configured {
      display: none;
      padding: 20px 16px;
      text-align: center;
    }
    .not-configured-icon { font-size: 32px; margin-bottom: 10px; }
    .not-configured-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 5px;
    }
    .not-configured-sub {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .btn-configure {
      padding: 9px 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-configure:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">✈️</div>
    <div class="header-text">
      <div class="header-title">TravelPanel</div>
      <div class="header-sub">Save travel inspiration</div>
    </div>
  </div>

  <div id="main-content">
    <div class="content">
      <div id="platform-badge" class="platform-badge"></div>
      <div class="page-preview">
        <div id="page-title" class="page-title">Loading…</div>
        <div id="page-url" class="page-url"></div>
      </div>
      <div id="error-msg" class="error-msg"></div>
      <button id="btn-save" class="btn-save">
        <span>📌</span> Save to TravelPanel
      </button>
    </div>
    <div class="footer">
      <a id="open-app" class="footer-link" href="#" target="_blank">Open TravelPanel ↗</a>
      <button class="settings-btn" id="settings-btn" title="Settings">⚙️</button>
    </div>
  </div>

  <div id="success-state" class="success-state">
    <div class="success-icon">✅</div>
    <div class="success-title">Saved to TravelPanel!</div>
    <div class="success-sub">Claude is extracting spots and travel wisdom<br>from this page in the background.</div>
  </div>

  <div id="not-configured" class="not-configured">
    <div class="not-configured-icon">🗺️</div>
    <div class="not-configured-title">Connect to TravelPanel</div>
    <div class="not-configured-sub">Enter your TravelPanel URL to start<br>saving travel inspiration.</div>
    <button class="btn-configure" id="btn-configure">Set up →</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
