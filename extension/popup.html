<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f5;
      --muted: #6b7280;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 12px;
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
    }

    /* ─── Header ─── */
    .header {
      background: linear-gradient(135deg, #1e1b4b 0%, #1a1a2e 50%, #0a0a0f 100%);
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo svg { width: 16px; height: 16px; }

    .brand { flex: 1; }
    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }
    .brand-tagline {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      display: flex;
    }
    .settings-btn:hover { color: var(--text); background: var(--border); }

    /* ─── Body ─── */
    .body { padding: 14px 18px 18px; }

    /* Page preview card */
    .page-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .page-platform {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CTA button */
    .save-btn {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    .save-btn:hover { opacity: 0.9; }
    .save-btn:active { transform: scale(0.98); }
    .save-btn:disabled { opacity: 0.4; cursor: default; }

    /* Success state */
    .success-body {
      padding: 28px 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .success-icon {
      width: 52px;
      height: 52px;
      background: rgba(34,197,94,0.12);
      border: 1.5px solid rgba(34,197,94,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .success-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .success-sub {
      font-size: 12px;
      color: var(--muted);
    }

    /* Error */
    .error-msg {
      font-size: 11px;
      color: var(--danger);
      margin-top: 8px;
      text-align: center;
    }

    /* Hidden */
    .hidden { display: none !important; }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ─── Header ─── -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1.5C4.96 1.5 2.5 3.96 2.5 7c0 3.5 5.5 7.5 5.5 7.5S13.5 10.5 13.5 7c0-3.04-2.46-5.5-5.5-5.5Z" fill="white" fill-opacity="0.9"/>
        <circle cx="8" cy="7" r="1.8" fill="#6366f1"/>
      </svg>
    </div>
    <div class="brand">
      <div class="brand-name">TravelPanel</div>
      <div class="brand-tagline">Save travel inspiration</div>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <!-- ─── Main view ─── -->
  <div id="mainView">
    <div class="body">
      <div class="page-card">
        <div class="page-platform" id="platformChip"></div>
        <div class="page-title" id="pageTitle">Loading…</div>
        <div class="page-url" id="pageUrl"></div>
      </div>

      <button class="save-btn" id="saveBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
        Save to TravelPanel
      </button>

      <div class="error-msg hidden" id="errorMsg"></div>
    </div>
  </div>

  <!-- ─── Success view ─── -->
  <div id="successView" class="hidden">
    <div class="success-body">
      <div class="success-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="success-title">Clipped!</div>
      <div class="success-sub">Saved to TravelPanel — pick a board there.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
