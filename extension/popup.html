<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span>TravelPanel</span>
    </div>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- Current page info -->
  <div class="page-info" id="page-info">
    <div class="favicon-wrap">
      <img id="favicon" src="" alt="" width="20" height="20">
      <span class="favicon-fallback hidden" id="favicon-fallback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
      </span>
    </div>
    <div class="page-meta">
      <p class="page-title" id="page-title">Loading page…</p>
      <p class="page-domain" id="page-domain"></p>
    </div>
  </div>

  <!-- Clip action (default view) -->
  <div class="action-wrap" id="action-wrap">
    <button class="clip-btn" id="clip-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
      </svg>
      Clip to TravelPanel
    </button>
  </div>

  <!-- Setup required (no URL configured) -->
  <div class="setup-wrap hidden" id="setup-wrap">
    <div class="setup-card">
      <p class="setup-heading">One quick setup step</p>
      <p class="setup-body">Add your TravelPanel URL to start saving travel inspiration with one click.</p>
      <button class="setup-btn" id="setup-btn">Configure TravelPanel URL →</button>
    </div>
  </div>

  <!-- Success state -->
  <div class="success-wrap hidden" id="success-wrap">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>
    <p class="success-title">Opening TravelPanel…</p>
    <p class="success-sub">Choose a board in the new tab to save your clip.</p>
  </div>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <a href="#" id="settings-link">Settings</a>
    <a href="https://github.com/soaringwillow/travelpanel" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
