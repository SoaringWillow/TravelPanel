<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      width: 320px;
      background: #ffffff;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.01em;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #6b7280; background: #f9fafb; }

    /* ── Page preview ────────────────────────────────────────── */
    .preview {
      padding: 16px;
      border-bottom: 1px solid #f3f4f6;
    }

    .platform-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 100px;
      margin-bottom: 8px;
      background: #ede9fe;
      color: #7c3aed;
    }

    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Clip button ─────────────────────────────────────────── */
    .actions {
      padding: 14px 16px 16px;
    }

    .clip-btn {
      width: 100%;
      padding: 11px 16px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
    }
    .clip-btn:hover:not(:disabled) { background: #4f46e5; }
    .clip-btn:active:not(:disabled) { transform: scale(0.98); }
    .clip-btn:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .clip-btn .icon { font-size: 16px; }

    /* ── Not configured warning ──────────────────────────────── */
    .warning {
      margin-top: 10px;
      padding: 9px 12px;
      background: #fefce8;
      border: 1px solid #fef08a;
      border-radius: 8px;
      font-size: 12px;
      color: #854d0e;
      display: none;
    }
    .warning a { color: #92400e; cursor: pointer; text-decoration: underline; }
    .warning.visible { display: block; }

    /* ── Success flash ───────────────────────────────────────── */
    .success-flash {
      margin-top: 10px;
      padding: 9px 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-size: 12px;
      color: #166534;
      display: none;
    }
    .success-flash.visible { display: block; }

    /* ── Footer hint ─────────────────────────────────────────── */
    .footer {
      padding: 0 16px 14px;
    }
    .footer-hint {
      font-size: 11px;
      color: #d1d5db;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="brand-icon">✈️</div>
      <span class="brand-name">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settings-btn" title="Settings">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>
  </header>

  <div class="preview">
    <span class="platform-chip" id="platform-chip">Web</span>
    <p class="page-title" id="page-title">Loading…</p>
    <p class="page-url" id="page-url"></p>
  </div>

  <div class="actions">
    <button class="clip-btn" id="clip-btn" disabled>
      <span class="icon">📌</span>
      Clip to TravelPanel
    </button>

    <div class="warning" id="warning">
      App URL not set. <a id="open-options">Configure in settings →</a>
    </div>

    <div class="success-flash" id="success-flash">
      ✅ Opening TravelPanel…
    </div>
  </div>

  <div class="footer">
    <p class="footer-hint">Clips are saved to your board for AI trip planning</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
