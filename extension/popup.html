<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      color: #1f2937;
      background: #ffffff;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-label {
      color: rgba(255,255,255,0.92);
      font-size: 14px;
      font-weight: 500;
    }
    .icon-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.28); }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 32px 16px;
      color: #9ca3af;
      font-size: 13px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #e5e7eb;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Notice (restricted / same-app) */
    .notice {
      padding: 24px 20px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }
    .notice strong {
      color: #374151;
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    /* Clip card */
    .content { padding: 14px 16px; }
    .clip-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      background: #f9fafb;
    }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Clip button */
    .clip-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, opacity 0.15s;
    }
    .clip-btn:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.93; }
    .clip-btn:active:not(:disabled) { transform: translateY(0); }
    .clip-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .clip-btn.success {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
    }

    /* Settings */
    .settings-section { margin-bottom: 16px; }
    .settings-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .settings-hint {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
      margin-top: 5px;
    }
    .settings-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      color: #1f2937;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #ffffff;
    }
    .settings-input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }
    .save-btn {
      width: 100%;
      padding: 10px;
      background: #7c3aed;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .save-btn:hover { background: #6d28d9; }

    /* Footer */
    .footer {
      padding: 10px 16px;
      border-top: 1px solid #f3f4f6;
      text-align: center;
    }
    .footer a {
      font-size: 11px;
      color: #d1d5db;
      text-decoration: none;
    }
    .footer a:hover { color: #7c3aed; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── Main view ── -->
  <div id="main-view">
    <div class="header">
      <div class="logo">
        <!-- Map pin icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/>
        </svg>
        TravelPanel
      </div>
      <button class="icon-btn" id="settings-btn" title="Settings">
        <!-- Gear icon -->
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="white"/>
        </svg>
      </button>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      Loading page info…
    </div>

    <div id="restricted-notice" class="notice hidden">
      <strong>Can't clip this page</strong>
      Navigate to a website to save travel content.
    </div>

    <div id="same-app-notice" class="notice hidden">
      <strong>You're already on TravelPanel!</strong>
      Paste a travel URL in the import field to clip it.
    </div>

    <div id="clip-view" class="hidden">
      <div class="content">
        <div class="clip-card">
          <div id="platform-badge" class="platform-badge"></div>
          <div id="page-title" class="page-title"></div>
          <div id="page-url" class="page-url"></div>
        </div>
        <button id="clip-btn" class="clip-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/>
          </svg>
          Save to TravelPanel
        </button>
      </div>
      <div class="footer">
        <a href="#" id="open-app-link">Open TravelPanel</a>
      </div>
    </div>
  </div>

  <!-- ── Settings view ── -->
  <div id="settings-view" class="hidden">
    <div class="header">
      <div class="header-left">
        <button class="icon-btn" id="back-btn" title="Back">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="white"/>
          </svg>
        </button>
        <span class="header-label">Settings</span>
      </div>
    </div>
    <div class="content">
      <div class="settings-section">
        <label class="settings-label" for="app-url-input">TravelPanel URL</label>
        <input
          id="app-url-input"
          class="settings-input"
          type="url"
          placeholder="http://localhost:3000"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="settings-hint">
          The URL where your TravelPanel app is hosted.<br>
          Default: <code>http://localhost:3000</code>
        </p>
      </div>
      <button id="save-settings-btn" class="save-btn">Save Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
