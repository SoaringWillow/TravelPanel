<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 14px;
      font-weight: 800;
      color: #1e1b4b;
      letter-spacing: -0.02em;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: background 0.15s, color 0.15s;
    }
    .settings-btn:hover { background: #f3f4f6; color: #4b5563; }

    /* ── Main content area ──────────────────────────────────────────────────── */
    .main {
      padding: 14px 16px 16px;
    }

    /* ── Empty / setup states ───────────────────────────────────────────────── */
    .centered-state {
      text-align: center;
      padding: 24px 16px 8px;
    }

    .state-emoji {
      font-size: 36px;
      margin-bottom: 10px;
      display: block;
    }

    .state-title {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 5px;
    }

    .state-desc {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
    }
    .primary-btn:hover { opacity: 0.92; }
    .primary-btn:active { transform: scale(0.97); }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Page card ──────────────────────────────────────────────────────────── */
    .page-card {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      margin-bottom: 13px;
    }

    .page-favicon-wrap {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      overflow: hidden;
      flex-shrink: 0;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .page-favicon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-info {
      flex: 1;
      min-width: 0;
    }

    .platform-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 20px;
      margin-bottom: 4px;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-domain {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Clip button ────────────────────────────────────────────────────────── */
    .clip-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }
    .clip-btn:hover { opacity: 0.93; }
    .clip-btn:active { transform: scale(0.98); }
    .clip-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .clip-btn-icon { font-size: 16px; }

    /* ── Loading spinner ────────────────────────────────────────────────────── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error banner ───────────────────────────────────────────────────────── */
    .error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 9px;
      padding: 9px 12px;
      margin-top: 10px;
      font-size: 12px;
      color: #dc2626;
      line-height: 1.45;
    }

    /* ── Success state ──────────────────────────────────────────────────────── */
    .success-state {
      text-align: center;
      padding: 22px 16px 8px;
    }

    .success-check {
      width: 52px;
      height: 52px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 12px;
    }

    .success-title {
      font-size: 15px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 4px;
    }

    .success-desc {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }

    /* ── Footer ─────────────────────────────────────────────────────────────── */
    .footer {
      border-top: 1px solid #f1f5f9;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-hint {
      font-size: 11px;
      color: #cbd5e1;
    }

    .footer-link {
      font-size: 11px;
      color: #94a3b8;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .footer-link:hover { color: #4f46e5; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <div class="logo-mark">✈️</div>
      <span class="logo-text">TravelPanel</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">⚙️</button>
  </div>

  <div class="main" id="main">
    <!-- Injected by popup.js -->
    <div class="centered-state">
      <span class="state-emoji">⏳</span>
      <div class="state-title">Loading…</div>
    </div>
  </div>

  <div class="footer">
    <span class="footer-hint">Right-click any page to clip</span>
    <button class="footer-link" id="footerSettings">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
