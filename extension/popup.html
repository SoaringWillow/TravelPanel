<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TravelPanel Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 128 128" fill="none">
        <path d="M64 20c-16.57 0-30 13.43-30 30 0 26.25 30 58 30 58s30-31.75 30-58c0-16.57-13.43-30-30-30z" fill="white"/>
        <circle cx="64" cy="50" r="11" fill="#6366f1"/>
      </svg>
      <span>TravelPanel</span>
    </div>
    <button id="optionsBtn" class="icon-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>

  <div class="page-info">
    <div class="favicon-wrap">
      <img id="favicon" src="" alt="" style="display:none">
      <div id="faviconFallback" class="favicon-fallback">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="white">
          <path fill-rule="evenodd" d="M4.083 9h1.946c.089-1.546.383-2.97.837-4.118A6.004 6.004 0 004.083 9zm5.917-7c-3.866 0-7 3.134-7 7s3.134 7 7 7 7-3.134 7-7-3.134-7-7-7zM9 4.083c-.73.17-1.398.823-1.878 1.788C6.822 6.54 6.563 7.746 6.487 9H9V4.083zm2 0V9h2.513c-.076-1.254-.335-2.46-.635-3.129C10.398 4.906 9.73 4.253 9 4.083L11 4.083zm0 6.917h2.513c-.076 1.254-.335 2.46-.635 3.129C12.398 15.094 11.73 15.747 11 15.917V11zm-2 0v4.917c-.73-.17-1.398-.823-1.878-1.788C6.822 13.46 6.563 12.254 6.487 11H9zm-4.917 0H4.083A6.004 6.004 0 009 15.917V11H4.083zM15.917 11A6.004 6.004 0 0115.917 11H15.917zm0-2H14.054A6.004 6.004 0 0015.917 9z" clip-rule="evenodd"/>
        </svg>
      </div>
    </div>
    <div class="page-details">
      <div class="page-title" id="pageTitle">Loading…</div>
      <div class="page-url" id="pageUrl"></div>
    </div>
  </div>

  <div class="platform-badge" id="platformBadge" style="display:none"></div>

  <div class="actions">
    <button id="clipBtn" class="clip-btn">
      <svg id="btnIcon" width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 6a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V8z" clip-rule="evenodd"/>
      </svg>
      <span id="btnText">Save to TravelPanel</span>
    </button>
  </div>

  <div class="footer">
    <span id="statusMsg"></span>
    <a id="openAppLink" href="#" style="display:none">Open TravelPanel ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
