<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelPanel Clipper — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }

    .container { width: 100%; max-width: 480px; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
    }
    .header-text p { font-size: 12px; color: #64748b; }

    /* ── Card ── */
    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    /* ── Form ── */
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .hint {
      font-size: 11px;
      color: #475569;
      margin-bottom: 10px;
    }

    input[type="url"], input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: 'SF Mono', 'Cascadia Code', monospace;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: rgba(99, 102, 241, 0.5); }
    input::placeholder { color: #334155; }

    .presets {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: #818cf8;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .preset-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
    }

    /* ── Shortcut info ── */
    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .shortcut-label { font-size: 13px; color: #94a3b8; }
    .kbd {
      display: inline-flex;
      gap: 3px;
    }
    .kbd span {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      font-size: 11px;
      font-family: 'SF Mono', monospace;
      padding: 2px 6px;
      color: #94a3b8;
    }

    /* ── Save button ── */
    .save-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 2px 12px rgba(99, 102, 241, 0.35);
      letter-spacing: -0.01em;
    }
    .save-btn:hover { opacity: 0.92; }
    .save-btn:active { transform: scale(0.99); }

    /* ── Status ── */
    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: block;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="logo">✈️</div>
      <div class="header-text">
        <h1>TravelPanel Clipper</h1>
        <p>Extension Settings</p>
      </div>
    </div>

    <!-- App URL -->
    <div class="card">
      <h2>App Connection</h2>
      <label for="appUrl">TravelPanel App URL</label>
      <p class="hint">Where your TravelPanel app is running. Use localhost for development or your Vercel URL for production.</p>
      <input type="url" id="appUrl" placeholder="http://localhost:3000" autocomplete="off" spellcheck="false">
      <div class="presets">
        <button class="preset-btn" data-url="http://localhost:3000">Local (port 3000)</button>
        <button class="preset-btn" data-url="https://travelpanel.vercel.app">Vercel (example)</button>
      </div>
    </div>

    <!-- Keyboard shortcuts -->
    <div class="card">
      <h2>Keyboard Shortcuts</h2>
      <div class="shortcut-row">
        <span class="shortcut-label">Save current page</span>
        <span class="kbd">
          <span id="kbdMod">Alt+Shift</span>
          <span>T</span>
        </span>
      </div>
      <p class="hint" style="margin-top: 8px;">
        You can also right-click any page or link to save it via the context menu.
      </p>
    </div>

    <button class="save-btn" id="saveBtn">Save Settings</button>
    <div class="status" id="status"></div>

  </div>
  <script src="options.js"></script>
</body>
</html>
