<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelPanel Clipper — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #0EA5E9;
      --primary-dark: #0284C7;
      --text: #0F172A;
      --text-muted: #64748B;
      --bg: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --border: #E2E8F0;
      --success: #059669;
      --error: #DC2626;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg-subtle);
      min-height: 100vh;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
    }

    .header img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="url"] {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text);
      background: white;
      outline: none;
      transition: border-color 0.15s;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    input[type="url"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
    }

    .btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn:hover {
      background: var(--bg-subtle);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .test-result {
      font-size: 12.5px;
      padding: 7px 11px;
      border-radius: 6px;
      line-height: 1.4;
    }

    .test-result.success { background: #ECFDF5; color: #065F46; }
    .test-result.error   { background: #FEF2F2; color: #991B1B; }
    .test-result.warning { background: #FFFBEB; color: #92400E; }

    .save-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .save-status {
      font-size: 12.5px;
      color: var(--success);
      font-weight: 500;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
    }

    .shortcuts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .shortcut-row span:first-child {
      color: var(--text-muted);
    }

    kbd {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--text);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="">
      <div class="header-text">
        <h1>TravelPanel Clipper</h1>
        <p>Extension Settings</p>
      </div>
    </div>

    <div class="body">

      <!-- TravelPanel URL -->
      <div class="field">
        <label for="url-input">TravelPanel URL</label>
        <div class="input-row">
          <input type="url" id="url-input" placeholder="http://localhost:3000" spellcheck="false">
          <button class="btn" id="test-btn">Test</button>
        </div>
        <p class="hint">Where your TravelPanel app is running — your local dev server or deployed Vercel URL.</p>
        <div class="test-result hidden" id="test-result"></div>
      </div>

      <hr class="divider">

      <!-- Keyboard shortcuts -->
      <div class="field">
        <label>Keyboard Shortcuts</label>
        <div class="shortcuts">
          <div class="shortcut-row">
            <span>Open Clipper</span>
            <div>
              <kbd id="shortcut-mac" class="hidden">⌘⇧T</kbd>
              <kbd id="shortcut-other">Alt+Shift+T</kbd>
            </div>
          </div>
          <p class="hint">You can customize shortcuts at <code>chrome://extensions/shortcuts</code></p>
        </div>
      </div>

      <hr class="divider">

      <!-- Save -->
      <div class="save-row">
        <button class="btn btn-primary" id="save-btn">Save Settings</button>
        <span class="save-status hidden" id="save-status">✓ Saved!</span>
      </div>

    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
