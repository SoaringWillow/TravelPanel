<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelPanel Clipper — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --bg-card:  #1a1d27;
      --border:   rgba(255,255,255,0.08);
      --text:     #f0f0f5;
      --muted:    #8b8fa8;
      --accent:   #f97316;
      --radius:   12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 480px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .brand-icon { font-size: 24px; }
    .brand-name {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #f97316, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }

    .section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .field-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.5;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }

    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 20px;
    }
    .save-btn {
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 20px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .save-btn:hover { opacity: 0.9; }

    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      font-size: 13px;
      padding: 9px 16px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .reset-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    .toast {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #22c55e;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.visible { opacity: 1; }

    .about {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 24px;
      line-height: 1.6;
    }
    .about a { color: var(--accent); text-decoration: none; }
    .about a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <span class="brand-icon">🗺️</span>
      <span class="brand-name">TravelPanel</span>
      <span class="brand-sub">Clipper Settings</span>
    </header>

    <div class="section">
      <div class="section-title">Connection</div>

      <div class="field">
        <label for="app-url">TravelPanel URL</label>
        <input type="url" id="app-url" placeholder="https://your-app.vercel.app" autocomplete="off" spellcheck="false">
        <div class="field-hint">
          Your deployed TravelPanel instance. Clips open the share page on this URL.
          Leave as default if you're using the hosted version.
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="save-btn" id="btn-save">Save settings</button>
      <button class="reset-btn" id="btn-reset">Reset to default</button>
      <span class="toast" id="toast">✓ Saved</span>
    </div>

    <p class="about">
      TravelPanel Clipper v1.0 ·
      <a href="https://github.com/soaringwillow/travelpanel" target="_blank">GitHub</a>
      · Powered by Claude AI
    </p>
  </div>

  <script src="options.js"></script>
</body>
</html>
