<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelPanel Clipper — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #13131a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #1a1a2e 100%);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg { width: 22px; height: 22px; }

    .card-header h1 { font-size: 18px; font-weight: 700; }
    .card-header p  { font-size: 12px; color: #6b7280; margin-top: 2px; }

    .card-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }

    label { display: block; }
    label span {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    input[type="url"] {
      width: 100%;
      background: #0a0a0f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 14px;
      color: #f0f0f5;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="url"]:focus { border-color: #6366f1; }
    input[type="url"]::placeholder { color: #374151; }

    .hint {
      font-size: 11px;
      color: #4b5563;
      margin-top: 6px;
    }

    .save-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .save-btn:hover { opacity: 0.88; }

    .status {
      text-align: center;
      font-size: 13px;
      height: 18px;
      transition: opacity 0.2s;
    }
    .status.ok    { color: #22c55e; }
    .status.error { color: #ef4444; }
    .status.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1.5C4.96 1.5 2.5 3.96 2.5 7c0 3.5 5.5 7.5 5.5 7.5S13.5 10.5 13.5 7c0-3.04-2.46-5.5-5.5-5.5Z" fill="white" fill-opacity="0.9"/>
          <circle cx="8" cy="7" r="1.8" fill="#6366f1"/>
        </svg>
      </div>
      <div>
        <h1>TravelPanel Clipper</h1>
        <p>Extension settings</p>
      </div>
    </div>

    <div class="card-body">
      <label>
        <span>TravelPanel App URL</span>
        <input type="url" id="appUrl" placeholder="https://your-app.vercel.app" />
        <div class="hint">The URL where your TravelPanel instance is deployed. Leave blank to use the default.</div>
      </label>

      <button class="save-btn" id="saveBtn">Save Settings</button>
      <div class="status hidden" id="status"></div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
