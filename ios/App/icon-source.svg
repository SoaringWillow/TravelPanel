<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- iOS icon background — teal gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#0F766E"/>
    </linearGradient>
    <!-- Drop shadow for the pin -->
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Background (iOS adds rounded corners automatically) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle world-map grid lines -->
  <!-- Equator -->
  <line x1="0" y1="512" x2="1024" y2="512" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Prime meridian -->
  <line x1="512" y1="0" x2="512" y2="1024" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Tropic of Cancer -->
  <line x1="0" y1="360" x2="1024" y2="360" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <!-- Tropic of Capricorn -->
  <line x1="0" y1="664" x2="1024" y2="664" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

  <!-- Location pin — centered, large, with shadow -->
  <g filter="url(#shadow)">
    <!-- Pin body -->
    <path
      d="M512 160
         C410 160 328 242 328 344
         C328 490 512 860 512 860
         C512 860 696 490 696 344
         C696 242 614 160 512 160 Z"
      fill="white"
    />
    <!-- Inner circle cutout — shows the teal -->
    <circle cx="512" cy="340" r="88" fill="#0D9488"/>
    <!-- Small white dot inside -->
    <circle cx="512" cy="340" r="28" fill="white"/>
  </g>
</svg>
